/* ---- XY パッド ---- */
const plane=document.getElementById('plane');
const cv=document.getElementById('cv'), g2=cv.getContext('2d');
function resize(){
  const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*d));
  cv.height=Math.max(1,Math.round(r.height*d));
  g2.setTransform(d,0,0,d,0,0);
}
new ResizeObserver(()=>{ resize(); if(ytReady) sizeVideo(); }).observe(plane);
window.addEventListener('resize',resize);
resize();

let dragging=false;
function setFromPointer(e){
  const r=cv.getBoundingClientRect();
  target.yy      = clamp((e.clientX-r.left)/r.width);
  target.density = clamp((e.clientY-r.top)/r.height);
  // 手で陰陽を動かしたら、波の位置もそこへ移す。放したあとは続きから進む (D-13)
  wavePos=yyToWavePos(target.yy);
  markEdited();
}
plane.addEventListener('pointerdown',e=>{dragging=true;plane.setPointerCapture(e.pointerId);setFromPointer(e)});
plane.addEventListener('pointermove',e=>{if(dragging)setFromPointer(e)});
plane.addEventListener('pointerup',()=>dragging=false);
plane.addEventListener('pointercancel',()=>dragging=false);

// 陰は青緑、陽は琥珀。密度で粒の数が変わる
const flakes=[];
function draw(){
  requestAnimationFrame(draw);
  const w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return;
  const yy=current.yy, dn=current.density;

  // 陰 (青緑) から陽 (琥珀) へ。色相を下る経路は緑を通ってしまうので、
  // 青 → 紫 → 赤と上って一周させる
  const hue=(a,b)=>(lerp(a,b,yy))%360;
  if(videoOn){
    // 動画のときは塗りつぶさない。文字が読める程度の幕だけを、陰陽の色で掛ける
    g2.clearRect(0,0,w,h);
    g2.fillStyle=`hsla(${hue(196,398)} ${lerp(34,52,yy)}% ${lerp(8,14,yy)}% / .52)`;
    g2.fillRect(0,0,w,h);
  }else{
    const gd=g2.createLinearGradient(0,0,w,h);
    if(themePad.a && themePad.b){
      // テーマが下地を持つ場合はそれを使う。陰陽は粒と波形の色で示す
      gd.addColorStop(0,themePad.a); gd.addColorStop(1,themePad.b);
    }else{
      gd.addColorStop(0, `hsl(${hue(196,398)} ${lerp(34,52,yy)}% ${lerp(11,19,yy)}%)`);
      gd.addColorStop(1, `hsl(${hue(210,382)} ${lerp(40,44,yy)}% ${lerp(6,11,yy)}%)`);
    }
    g2.fillStyle=gd; g2.fillRect(0,0,w,h);
  }

  const want=Math.round(lerp(14,90,dn));
  while(flakes.length<want) flakes.push({x:Math.random()*w,y:Math.random()*h,v:rand(.1,.5),r:rand(.6,2.2)});
  while(flakes.length>want) flakes.pop();
  g2.fillStyle=`rgba(231,226,206,${lerp(.10,.26,yy)})`;
  for(const f of flakes){
    f.y-=f.v*(0.4+dn); if(f.y<0){ f.y=h; f.x=Math.random()*w; }
    g2.beginPath(); g2.arc(f.x,f.y,f.r*lerp(1.6,.7,dn),0,6.283); g2.fill();
  }

  // 波形 (D-36)。いま出ている音をそのまま横に引き伸ばして描く。
  // 立ち上がりが左端に来るよう、上りのゼロ交差を探して起点にする
  if(scope && running){
    scope.getFloatTimeDomainData(scopeBuf);
    const n=scopeBuf.length;
    let start=0;
    for(let i=1;i<n>>1;i++){
      if(scopeBuf[i-1]<=0 && scopeBuf[i]>0){ start=i; break; }
    }
    const span=Math.min(n-start, n>>1);
    g2.beginPath();
    for(let x=0;x<w;x++){
      const v=scopeBuf[start+Math.floor(x/w*span)]||0;
      const y=h/2 - v*h*.42;
      x ? g2.lineTo(x,y) : g2.moveTo(x,y);
    }
    g2.strokeStyle=scopeColor();
    g2.lineWidth=1.4;
    g2.stroke();
  }

  // 拍の明滅。無音の段階でも拍が見えるようにしておく
  if(uiStep>=0 && uiStep%4===0){
    g2.fillStyle=`rgba(216,163,64,${.05+ (uiStep===0?.05:0)})`;
    g2.fillRect(0,0,w,h);
  }

  // 白い十字が目標、琥珀のランプが現在地
  const tx=target.yy*w, ty=target.density*h;
  g2.strokeStyle='rgba(255,255,255,.5)'; g2.lineWidth=1;
  g2.beginPath(); g2.moveTo(tx-7,ty); g2.lineTo(tx+7,ty); g2.moveTo(tx,ty-7); g2.lineTo(tx,ty+7); g2.stroke();
  const cx=current.yy*w, cy=current.density*h;
  g2.fillStyle='rgba(216,163,64,.9)';
  g2.beginPath(); g2.arc(cx,cy,3.4,0,6.283); g2.fill();
}
draw();

/* ============================================================
   背景の動画 (D-32)
   ------------------------------------------------------------
   いま鳴っているシーンの英語名で YouTube を検索し、改変を許すライセンス
   (YouTube の CC は CC BY 3.0 のみ) の動画を音無しで背景に流す。
   4小節ごとに差し替え、そのつどクロスフェードする。

   キーはユーザーが入れてこのブラウザにだけ保存する。リポジトリには持たない。
   キーが無ければ何も通信せず、これまでどおりの背景になる。
   ============================================================ */
const YT_KEY_STORE='elevator-two:ytkey';
const YT_CACHE_STORE='elevator-two:ytcache';
/* 検索 (search.list) は1回100単位、既定の上限は1日1万単位。
   一方 videos.list は1単位で済む。そこで、
   - 検索の結果は30日取っておき、そうそう引き直さない
   - 生き死にと長さの確認だけは videos.list に任せ、1日1回1単位で済ませる
   という分担にしてある (D-35) */
const YT_CACHE_TTL=30*24*60*60*1000;
const YT_VERIFY_TTL=24*60*60*1000;

const bgEl=document.getElementById('bg');
const capEl=document.getElementById('vcap');
const noteEl=document.getElementById('ytnote');
const keyEl=document.getElementById('ytkey');
const bgBtn=document.getElementById('bgvideo');

try{ ytKey=localStorage.getItem(YT_KEY_STORE)||''; }catch(_){ }
keyEl.value=ytKey;

function ytNote(key){ noteEl.textContent = key ? t(key) : ''; }

// 検索結果はシーンごとに1日ぶん取っておく。毎回引くとクォータをすぐ使い切る
function ytCache(){
  try{ return JSON.parse(localStorage.getItem(YT_CACHE_STORE)||'{}'); }catch(_){ return {}; }
}
function ytCachePut(id,items,{searched=true}={}){
  try{
    const c=ytCache();
    const prev=c[id]||{};
    c[id]={at: searched?Date.now():(prev.at||Date.now()), checkedAt:Date.now(), items};
    localStorage.setItem(YT_CACHE_STORE,JSON.stringify(c));
  }catch(_){ /* 保存できなくても動く */ }
}

// IFrame Player API。テストなどで先に window.YT が用意されていればそれを使う
function loadYT(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(loadYT._p) return loadYT._p;
  loadYT._p=new Promise((res,rej)=>{
    window.onYouTubeIframeAPIReady=()=>res();
    const sc=document.createElement('script');
    sc.src='https://www.youtube.com/iframe_api';
    sc.onerror=()=>rej(new Error('iframe api'));
    document.head.appendChild(sc);
    setTimeout(()=>rej(new Error('timeout')),15000);
  });
  return loadYT._p;
}

/* 検索語。シーンの英語名だけでは一般的すぎて結果がばらけるので、
   docs/SCENES.md に書いたそのシーンの性格を語に落として添える (D-33)。
   さらに全シーン共通で footage を足し、素材寄りの動画に寄せる */
const SCENE_QUERY={
  submerge:'underwater deep dark slow',
  moss:    'forest floor damp macro',
  frost:   'ice crystals macro',
  pulse:   'neon night city rain',
  drowse:  'dawn haze mist slow',
  glass:   'reflection refraction light',
  dusk:    'skyline golden hour',
  gear:    'machinery factory mechanism',
  bounce:  'street night traffic motion',
  steel:   'industrial mill welding',
  spark:   'welding close up slow motion',
  daybreak:'sunrise clouds timelapse',
  dash:    'highway speed motion blur',
  jubilee: 'fireworks celebration lights',
};
const YT_COMMON='footage';

function ytQuery(sc){
  const name=I18N.en[`scene.${sc.id}.name`];
  return [name, SCENE_QUERY[sc.id]||'', YT_COMMON].filter(Boolean).join(' ');
}

function ytUrl(q,{long=true}={}){
  return 'https://www.googleapis.com/youtube/v3/search'
    +'?part=snippet&type=video&maxResults=12&safeSearch=moderate'
    +'&videoEmbeddable=true&videoLicense=creativeCommon'
    +'&order=viewCount'                       // 関連度順より当たり外れが少ない
    +(long?'&videoDuration=long':'')          // 20分以上。途中から流しても絵が続く
    +`&q=${encodeURIComponent(q)}&key=${encodeURIComponent(ytKey)}`;
}

async function ytFetch(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('search '+r.status);
  const j=await r.json();
  return (j.items||[]).map(it=>({
    id:it.id&&it.id.videoId,
    title:(it.snippet&&it.snippet.title)||'',
    by:(it.snippet&&it.snippet.channelTitle)||'',
  })).filter(v=>v.id);
}

/* videos.list で、取っておいた動画がまだ使えるかと長さを確かめる (1単位)。
   検索を引き直すより100倍安いので、長く取っておいた一覧の手入れはこちらで行う */
function iso8601Sec(d){
  const m=/^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(d||'');
  if(!m) return 0;
  return (+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0);
}
async function ytVerify(items){
  if(!items.length) return items;
  const url='https://www.googleapis.com/youtube/v3/videos'
    +'?part=contentDetails,status'
    +`&id=${items.slice(0,50).map(v=>v.id).join(',')}&key=${encodeURIComponent(ytKey)}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error('videos '+r.status);
  const j=await r.json();
  const info={};
  for(const it of (j.items||[])){
    const st=it.status||{};
    // 埋め込めない・非公開・ライセンスが変わった動画はここで落とす
    if(!st.embeddable || st.privacyStatus!=='public' || st.license!=='creativeCommon') continue;
    info[it.id]=iso8601Sec(it.contentDetails&&it.contentDetails.duration);
  }
  return items.filter(v=>info[v.id]!==undefined).map(v=>({...v,dur:info[v.id]}));
}

async function ytSearch(sc){
  const cached=ytCache()[sc.id];
  if(cached && Date.now()-cached.at<YT_CACHE_TTL && cached.items.length){
    // 一覧はそのまま使い、生き死にと長さの確認だけ1日に1度行う
    if(Date.now()-(cached.checkedAt||0)<YT_VERIFY_TTL) return cached.items;
    try{
      const fresh=await ytVerify(cached.items);
      if(fresh.length){ ytCachePut(sc.id,fresh,{searched:false}); return fresh; }
    }catch(e){ return cached.items; }   // 確認に失敗しても、あるものは使う
  }
  const q=ytQuery(sc);
  let items=await ytFetch(ytUrl(q));
  // 長さで絞ると何も見つからないシーンがありうる。そのときだけ長さの条件を外して引き直す
  if(!items.length) items=await ytFetch(ytUrl(q,{long:false}));
  try{ items=await ytVerify(items); }catch(e){ /* 確認できなくても検索結果は使う */ }
  ytCachePut(sc.id,items);
  return items;
}

function ytPlayer(i){
  return new Promise(res=>{
    ytPlayers[i]=new YT.Player('yt'+i,{
      width:'640', height:'360',
      playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,playsinline:1,
                  iv_load_policy:3,fs:0},
      events:{ onReady:e=>{ try{ e.target.mute(); }catch(_){ } res(e.target); } },
    });
  });
}

async function ytInit(){
  if(ytReady) return true;
  try{
    await loadYT();
    await Promise.all([ytPlayer(0),ytPlayer(1)]);
    ytReady=true;
    sizeVideo();
    return true;
  }catch(e){
    ytFailed=true; ytNote('yt.error');
    return false;
  }
}

// 動画は 16:9。パッドの形に合わせて、はみ出すぶんを許して覆う
function sizeVideo(){
  const r=plane.getBoundingClientRect();
  const w=Math.max(r.width, r.height*16/9), h=Math.max(r.height, r.width*9/16);
  for(const f of bgEl.querySelectorAll('iframe')){
    f.style.width=Math.ceil(w)+'px';
    f.style.height=Math.ceil(h)+'px';
  }
}

// いまのシーンぶんの一覧を用意する
async function ytEnsureList(){
  const sc=SCENES[sceneIdx];
  if(ytSceneId===sc.id && ytList.length) return;
  ytSceneId=sc.id; ytList=[]; ytPos=0;
  ytNote('yt.searching');
  try{
    ytList=await ytSearch(sc);
    ytNote(ytList.length?null:'yt.none');
  }catch(e){
    ytFailed=true; ytNote('yt.error');
  }
}

// 4小節ごとに呼ばれる。次の動画を裏の層に用意してから重ねる
async function ytSwap(){
  if(!videoOn || !ytKey || ytFailed || ytBusy) return;
  ytBusy=true;
  try{
    if(!await ytInit()) return;
    await ytEnsureList();
    if(!ytList.length) return;
    let v=ytList[ytPos++%ytList.length];
    // シーンが変わると一覧を引き直して先頭へ戻るので、同じ動画が続くことがある。
    // 直前と同じなら一つ送る
    if(v.id===ytLastId && ytList.length>1) v=ytList[ytPos++%ytList.length];
    ytLastId=v.id;
    const next=1-ytLayer;
    const pl=ytPlayers[next];
    // 頭からではなく途中から流す。冒頭の題字や暗転を避ける
    // 長さが分かっていれば、頭と終わりを避けた範囲から流し始める
    const start = v.dur>90 ? Math.floor(rand(20,Math.max(30,v.dur-60))) : Math.floor(rand(5,20));
    pl.loadVideoById({videoId:v.id, startSeconds:start});
    try{ pl.mute(); pl.playVideo(); }catch(_){ }
    await new Promise(r=>setTimeout(r,700));   // 絵が出るのを少し待ってから重ねる
    document.getElementById('vid'+next).classList.add('on');
    document.getElementById('vid'+ytLayer).classList.remove('on');
    ytLayer=next;
    capEl.textContent=`${v.title} — ${v.by} (${t('yt.license')})`;
  }catch(e){
    ytFailed=true; ytNote('yt.error');
  }finally{
    ytBusy=false;
  }
}

function setVideo(on){
  videoOn=on && !!ytKey;
  bgBtn.setAttribute('aria-pressed',String(videoOn));
  bgEl.hidden=!videoOn;
  if(!videoOn){
    capEl.textContent='';
    for(const pl of ytPlayers){ try{ pl && pl.pauseVideo(); }catch(_){ } }
    ytNote(ytKey?null:'yt.needkey');
  }else{
    ytFailed=false;
    ytNote(null);
    ytSwap();
  }
}

bgBtn.addEventListener('click',()=>setVideo(!videoOn));
keyEl.addEventListener('change',()=>{
  ytKey=keyEl.value.trim();
  try{ ytKey ? localStorage.setItem(YT_KEY_STORE,ytKey) : localStorage.removeItem(YT_KEY_STORE); }catch(_){ }
  ytFailed=false; ytSceneId=null; ytList=[];
  setVideo(!!ytKey);
});

/* ============================================================
   バックグラウンド再生
   ------------------------------------------------------------
   iOS の Safari は画面ロックやバックグラウンド遷移で2つの止め方をしてくる。

   1. AudioContext 自体が中断される
      → 出力を MediaStreamDestination 経由で <audio> 要素に流し、
        ページを「メディア再生中」として扱わせる
   2. setInterval / setTimeout が絞られて止まる
      → 進行の時計を AudioWorklet に移す。音声スレッドで回るので絞られない

   どちらも対応していない環境では ctx.destination と setInterval に戻る。
   elevator-one で作った仕組みをそのまま引き継いでいる (D-2)。
   ============================================================ */
const CLOCK_SRC=`
class ClockProcessor extends AudioWorkletProcessor {
  constructor(){ super(); this.n=0; }
  process(){
    if(++this.n>=8){ this.n=0; this.port.postMessage(0); }   // 128フレーム × 8
    return true;
  }
}
registerProcessor('clock', ClockProcessor);
`;

let clockNode=null, sink=null, sinkActive=false, fallbackTimer=null;

function tick(){
  if(!ctx) return;
  if(performance.now()-smoothAt>=100) smooth();   // 平滑化とUI更新は100ms間隔で十分
  runStepUI(ctx.currentTime);
  runDisposals(ctx.currentTime);   // 止めたあとも鳴り終わりの片付けだけは続ける
  if(!running) return;
  seqTick();
}

async function startClock(){
  if(clockNode) return;
  if(ctx.audioWorklet){
    const url=URL.createObjectURL(new Blob([CLOCK_SRC],{type:'text/javascript'}));
    try{
      await ctx.audioWorklet.addModule(url);
      // Ladder も同じ入口で読む。こちらが失敗してもクロックは動かす
      try{
        const lurl=URL.createObjectURL(new Blob([LADDER_SRC],{type:'text/javascript'}));
        try{ await ctx.audioWorklet.addModule(lurl); ladderReady=true; }
        finally{ URL.revokeObjectURL(lurl); }
      }catch(e){ ladderReady=false; }
      clockNode=new AudioWorkletNode(ctx,'clock',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});
      clockNode.port.onmessage=tick;
      clockNode.connect(comp);   // 繋がないと process が呼ばれない。出力は無音なので混ざらない
      return;
    }catch(e){
      clockNode=null;
    }finally{
      URL.revokeObjectURL(url);
    }
  }
  clearInterval(fallbackTimer); fallbackTimer=setInterval(tick,25);
}

// 再生が実際に進み始めたかを最大1.5秒待って見る
async function sinkAdvances(){
  const t0=sink.currentTime;
  for(let i=0;i<15;i++){
    await new Promise(r=>setTimeout(r,100));
    if(sink.currentTime>t0) return true;
  }
  return false;
}

async function routeToSink(){
  if(sinkActive){
    if(sink.paused) try{ await sink.play(); }catch(e){}
    return true;
  }
  if(!sink){
    sink=document.createElement('audio');
    sink.setAttribute('playsinline','');
    sink.autoplay=true;
    sink.srcObject=streamDest.stream;
    sink.addEventListener('pause',()=>reviveAudio());
    sink.addEventListener('ended',()=>reviveAudio());
    document.body.appendChild(sink);
  }
  try{
    out.disconnect(ctx.destination);   // 二重に鳴らさないため先に切る
    await sink.play();
    if(await sinkAdvances()){
      sinkActive=true;
      if(!running) sink.pause();
      return true;
    }
  }catch(e){ /* 下のフォールバックへ */ }
  try{ sink.pause(); }catch(e){}
  out.connect(ctx.destination);
  return false;
}

// ロック画面 / コントロールセンター / CarPlay には現在のシーンを出す
function mediaMetadata(){
  return new MediaMetadata({title:sceneLabel(), artist:`Elevator Two ${VERSION}`});
}
function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata=mediaMetadata();
    navigator.mediaSession.setActionHandler('play', ()=>{ startAudio(); });
    navigator.mediaSession.setActionHandler('pause',stopAudio);
    // 「次へ」はロック画面からも押せるようにする
    navigator.mediaSession.setActionHandler('nexttrack',()=>{ newWavePeriod(); enterScene(chooseScene()); });
  }catch(e){}
}
function updateMediaMetadata(){
  if(!('mediaSession' in navigator) || !navigator.mediaSession.metadata) return;
  try{ navigator.mediaSession.metadata=mediaMetadata(); }catch(e){}
}

function reviveAudio(){
  if(!running || !ctx) return;
  if(ctx.state!=='running') ctx.resume().catch(()=>{});
  if(sinkActive && sink && sink.paused) sink.play().catch(()=>{});
}
document.addEventListener('visibilitychange',reviveAudio);
setInterval(reviveAudio,4000);

/* ---- 再生 / 一時停止 ---- */
const playBtn=document.getElementById('play');
const pauseBtn=document.getElementById('pause');
const bigPlay=document.getElementById('bigplay');

function setPowerUI(on){
  bigPlay.hidden=on;   // 止まっている間だけ大きなボタンを出す (Issue #1)
  playBtn.dataset.on=on?'1':'0';
  pauseBtn.dataset.on=on?'0':'1';
  playBtn.setAttribute('aria-pressed',on?'true':'false');
  pauseBtn.setAttribute('aria-pressed',on?'false':'true');
}
setPowerUI(false);

async function startAudio(){
  if(running) return;
  if(navigator.audioSession) try{ navigator.audioSession.type='playback'; }catch(e){}
  if(!ctx) build();
  await ctx.resume();
  running=true;
  setPowerUI(true);
  stepIdx=0; barCount=0; nextStepTime=ctx.currentTime+.12;
  phraseStartBar=0; sceneStartBar=0; phraseLen=PHRASE_BARS;
  sceneBars=sceneLengthBars();
  muteHatUntilBar=-1; muteKickUntilBar=-1; glitchBar=-1;
  pendingScene=-1; transitionEndBar=-1; seqB=null;
  evFilterUntil=0; evMasterUntil=0; evDelayUntil=0;
  bpmCur=bpmTarget();
  await startClock();
  ensureBass();   // Ladder の読み込み結果が要るので、時計のあとに組む
  routeToSink().catch(()=>{});   // 完了を待たない
  setupMediaSession();
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing';
}

function stopAudio(){
  if(!running) return;
  running=false;
  setPowerUI(false);
  muteHatUntilBar=-1; muteKickUntilBar=-1; glitchBar=-1; epGuest=false;
  pendingScene=-1; transitionEndBar=-1; seqB=null; pendingSpill=null;
  evLeadUntil=0;
  if(phaserWet){ phaserWet.gain.cancelScheduledValues(ctx.currentTime); phaserWet.gain.setValueAtTime(0,ctx.currentTime); }
  if(drumMixB) endMixFades(ctx.currentTime);
  flushSteps();
  uiStep=-1; renderSteps();
  apply();
  if(sink) sink.pause();
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused';
}

playBtn.addEventListener('click',()=>{ startAudio(); });
// パッドは pointerdown でポインタを捕まえるので、そのままだと click が
// パッド側へ吸われてボタンに届かない。ここで伝播を止める
bigPlay.addEventListener('pointerdown',e=>e.stopPropagation());
bigPlay.addEventListener('click',()=>{ startAudio(); });
pauseBtn.addEventListener('click',stopAudio);

/* ---- タブ切替 (狭幅時のみ表示) ---- */
const mainEl=document.getElementById('main');
const tabBtns=[...document.querySelectorAll('#tabs .tab')];
tabBtns.forEach(b=>b.addEventListener('click',()=>{
  mainEl.dataset.tab=b.dataset.tab;
  tabBtns.forEach(o=>o.setAttribute('aria-selected',String(o===b)));
  resize(); // display:none 明けの canvas を再計測
}));

/* ---- ツールチップ ---- */
const tipEl=document.getElementById('tip');
let tipHost=null;
const TIP_LIFE_MS=5000;
let tipTimer=0;
function showTip(el){
  const txt=el.dataset.tip;
  if(!txt) return;
  clearTimeout(tipTimer);
  tipEl.classList.remove('fade');
  tipHost=el; tipEl.textContent=txt; tipEl.classList.add('on');
  const r=el.getBoundingClientRect();
  const tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
  let x=r.left, y=r.bottom+8;
  if(y+th>innerHeight-8) y=Math.max(8, r.top-th-8);
  if(x+tw>innerWidth-10) x=innerWidth-tw-10;
  if(x<8) x=8;
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
  tipTimer=setTimeout(fadeTip, TIP_LIFE_MS);
}
function fadeTip(){ tipHost=null; tipEl.classList.add('fade'); tipEl.classList.remove('on'); }
function hideTip(){ clearTimeout(tipTimer); tipHost=null; tipEl.classList.remove('on','fade'); }
// 引数名は t() (翻訳) と紛れないように node
const nearest=node=>(node && node.closest) ? node.closest('[data-tip]') : null;
document.addEventListener('mouseover',e=>{ const el=nearest(e.target); if(el&&el!==tipHost) showTip(el); });
document.addEventListener('mouseout', e=>{ const el=nearest(e.target); if(el&&el===tipHost) hideTip(); });
document.addEventListener('focusin',  e=>{ const el=nearest(e.target); if(el) showTip(el); });
document.addEventListener('focusout', hideTip);
window.addEventListener('blur', hideTip);

/* ---- 表示言語の適用 ---- */
const langBtn=document.getElementById('lang');
function applyI18n(){
  document.documentElement.lang=lang;
  for(const el of document.querySelectorAll('[data-i18n]'))      el.textContent=t(el.dataset.i18n);
  for(const el of document.querySelectorAll('[data-i18n-tip]'))  el.dataset.tip=t(el.dataset.i18nTip);
  for(const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label',t(el.dataset.i18nAria));
  langBtn.textContent=lang.toUpperCase();
  updateScene();   // シーン名も訳し分ける。MediaMetadata もここで追随する
  showProgress();  // フレーズ名とイベント名も同じく
  hideTip();
}
langBtn.addEventListener('click',()=>{
  lang = lang==='ja' ? 'en' : 'ja';
  try{ localStorage.setItem(LANG_KEY,lang); }catch(_){ /* 保存できなくても切り替えはできる */ }
  applyI18n();
});

wavePos=yyToWavePos(P.yy.def);
newWavePeriod();
enterScene(chooseScene());
pickProg();
sceneBars=sceneLengthBars();
setTheme(theme);

window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); if(running) stopAudio(); else startAudio(); }
});

})();
