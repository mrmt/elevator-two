/* ---- 調性 (D-9) ----
   キーはシーンごとに変え、移動先は五度圏で近い調から選ぶ。
   音階は主回路の群ごとに変える。ベースもハーモニーもここから音を引く */
const SCALES={
  stab:    [0,2,3,5,7,8,10],   // 自然短音階
  jazz:    [0,2,3,5,7,9,10],   // ドリアン。テンションを載せやすい
  funk:    [0,3,5,7,10],       // 短調のペンタトニック
  sustain: [0,2,4,7,9,11],     // 長調寄り。add9 / sus2 の響きを作る
};
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let keyPc=9;   // 主音のピッチクラス。既定は A

// 五度圏で隣へ動く。同じ調に留まることもある
function moveKey(){ keyPc=(keyPc+pick([5,7,0,5,7,2]))%12; }
const scale = () => SCALES[SCENES[sceneIdx].group];
const mtof = m => 440*Math.pow(2,(m-69)/12);

function build(){
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  ctx.onstatechange=()=>reviveAudio();   // iOS は interrupted に落とすことがある

  comp = ctx.createDynamicsCompressor();
  comp.threshold.value=-14; comp.knee.value=24; comp.ratio.value=4;
  comp.attack.value=.05; comp.release.value=.6;

  // DynamicsCompressorNode は自動メイクアップを持たないので、圧縮した分を戻す段を後ろに置く
  makeup = ctx.createGain(); makeup.gain.value=1;

  // コンプのアタックをすり抜ける立ち上がりを tanh で丸める。
  // 前段で半分にしてから curve の定義域 -1〜1 を実振幅 -2〜2 に見立てる
  const clipPre = ctx.createGain(); clipPre.gain.value=.5;
  const clip = ctx.createWaveShaper();
  {
    const n=2048, curve=new Float32Array(n);
    for(let i=0;i<n;i++) curve[i]=Math.tanh((i/(n-1)*2-1)*2);
    clip.curve=curve; clip.oversample='4x';
  }
  out = clip;   // destination への最終段。経路の切り替えはここから行う

  master = ctx.createGain(); master.gain.value=0;
  master.connect(comp).connect(makeup).connect(clipPre).connect(clip).connect(ctx.destination);
  streamDest = ctx.createMediaStreamDestination();
  out.connect(streamDest);   // バックグラウンド再生用の <audio> へ流す経路

  // 波形を覗くための分岐。音は通すだけで何も変えない (D-36)
  scope = ctx.createAnalyser();
  scope.fftSize=2048; scope.smoothingTimeConstant=0;
  scopeBuf = new Float32Array(scope.fftSize);
  out.connect(scope);

  // 全体フィルタ。第3層イベントの masterfilter がここを閉じて開く (D-4)
  mixFilter = ctx.createBiquadFilter();
  mixFilter.type='lowpass'; mixFilter.frequency.value=20000; mixFilter.Q.value=.7;
  mixFilter.connect(master);

  dry = ctx.createGain(); dry.gain.value=.9; dry.connect(mixFilter);

  // リバーブ
  const conv=ctx.createConvolver();
  {
    const sec=3.2, n=Math.floor(ctx.sampleRate*sec);
    const buf=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){
      const d=buf.getChannelData(ch);
      for(let i=0;i<n;i++){
        const u=i/n;
        d[i]=(Math.random()*2-1)*Math.pow(1-u,2.6)*(1-Math.exp(-i/300));
      }
    }
    conv.buffer=buf;
  }
  revGain=ctx.createGain(); revGain.gain.value=.4;
  revSend=ctx.createGain(); revSend.gain.value=1;
  revSend.connect(conv).connect(revGain).connect(mixFilter);

  // ディレイ。左右で時間の違う2系統を持ち、テンポに同期させる (dub の中核になる)
  const mkTap=(pan)=>{
    const d=ctx.createDelay(4), fb=ctx.createGain(), lp=ctx.createBiquadFilter(),
          pn=ctx.createStereoPanner(), o=ctx.createGain();
    lp.type='lowpass'; lp.frequency.value=2600; fb.gain.value=.45; pn.pan.value=pan; o.gain.value=.5;
    d.connect(lp).connect(fb).connect(d);
    lp.connect(o).connect(pn).connect(mixFilter);
    pn.connect(revSend);
    return {d,fb,lp,o};
  };
  dlySend=ctx.createGain(); dlySend.gain.value=1;
  const tapL=mkTap(-.75), tapR=mkTap(.75);
  dlySend.connect(tapL.d); dlySend.connect(tapR.d);
  delayNodes={tapL,tapR};

  // ---- ドラムバス ----
  // 打点はここへ集め、まとめて軽く飽和させてからフィルタを通す。
  // drumFilter は sweep イベントが動かす
  noiseBuf=noiseBuffer(2);
  metalBuf=metalBuffer(1);

  drumBus=ctx.createGain(); drumBus.gain.value=1;
  drumSat=ctx.createWaveShaper();
  {
    const n=1024, curve=new Float32Array(n);
    for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; curve[i]=Math.tanh(x*1.9); }
    drumSat.curve=curve; drumSat.oversample='2x';
  }
  drumFilter=ctx.createBiquadFilter();
  drumFilter.type='lowpass'; drumFilter.frequency.value=20000; drumFilter.Q.value=1.0;
  const drumPost=ctx.createGain(); drumPost.gain.value=1;
  drumMix=ctx.createGain(); drumMix.gain.value=1;
  drumBus.connect(drumSat).connect(drumPost).connect(drumFilter).connect(drumMix);
  build.drumPost=drumPost;
  drumMix.connect(dry);
  const dSend=ctx.createGain(); dSend.gain.value=.5; drumMix.connect(dSend).connect(revSend);
  const dDly =ctx.createGain(); dDly.gain.value=.3;  drumMix.connect(dDly).connect(dlySend);
  build.drumSends={rev:dSend,dly:dDly};

  // DJ ミックス風の遷移 (D-5 方式3) で、入ってくるシーンのドラムを流す2本目の経路。
  // 普段は drumMixB が 0 なので何も出ない
  drumBusB=ctx.createGain(); drumBusB.gain.value=1;
  drumFilterB=ctx.createBiquadFilter();
  drumFilterB.type='highpass'; drumFilterB.frequency.value=1200; drumFilterB.Q.value=.9;
  drumMixB=ctx.createGain(); drumMixB.gain.value=0;
  const satB=ctx.createWaveShaper(); satB.curve=drumSat.curve; satB.oversample='2x';
  drumBusB.connect(satB).connect(drumFilterB).connect(drumMixB);
  drumMixB.connect(dry);
  drumMixB.connect(dSend); drumMixB.connect(dDly);

  buildHarmony();
  ready=true;
}

/* ============================================================
   ハーモニー3回路 (D-8 / D-9)
   ------------------------------------------------------------
   汎用の和音生成器のパラメータ違いではなく、別々の回路として持つ。
   同時に鳴ることは基本的に想定せず、シーンがどれを使うかを選ぶ。
   ============================================================ */
function buildHarmony(){
  // ---- 持続回路 (陽) ----
  // 4層を持ち、build のフレーズで下から積み上がる (D-9)
  padBus=ctx.createGain(); padBus.gain.value=0;
  padFilter=ctx.createBiquadFilter();
  padFilter.type='lowpass'; padFilter.frequency.value=1800; padFilter.Q.value=.8;
  padFilter.connect(padBus);

  // 弦楽アンサンブル的なコーラス。左右に振った2つの短いディレイを揺らす
  const chA=ctx.createDelay(.06), chB=ctx.createDelay(.06);
  chA.delayTime.value=.013; chB.delayTime.value=.021;
  for(const [d,f,dep] of [[chA,.11,.0035],[chB,.17,.0045]]){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.value=dep;
    o.connect(g).connect(d.delayTime); o.start();
  }
  const pL=ctx.createStereoPanner(), pR=ctx.createStereoPanner();
  pL.pan.value=-.7; pR.pan.value=.7;
  const chG=ctx.createGain(); chG.gain.value=.6;
  padFilter.connect(chA).connect(pL).connect(chG);
  padFilter.connect(chB).connect(pR).connect(chG);
  chG.connect(padBus);

  padLayer=[];
  for(let i=0;i<4;i++){
    const g=ctx.createGain(); g.gain.value=0;
    g.connect(padFilter);
    padLayer.push(g);
  }
  padBus.connect(dry);
  const pRev=ctx.createGain(); pRev.gain.value=.3; padBus.connect(pRev).connect(revSend);
  const pDly=ctx.createGain(); pDly.gain.value=.15; padBus.connect(pDly).connect(dlySend);

  // ---- スタブ回路 (陰) ----
  // 原音はほとんど出さず、ディレイへのセンドを主とする (D-9)
  stabBus=ctx.createGain(); stabBus.gain.value=1;
  stabFilter=ctx.createBiquadFilter();
  stabFilter.type='lowpass'; stabFilter.frequency.value=2400; stabFilter.Q.value=2.2;
  stabBus.connect(stabFilter);
  const sDry=ctx.createGain(); sDry.gain.value=.22; stabFilter.connect(sDry).connect(dry);
  const sRev=ctx.createGain(); sRev.gain.value=.5;  stabFilter.connect(sRev).connect(revSend);
  const sDly=ctx.createGain(); sDly.gain.value=.9;  stabFilter.connect(sDly).connect(dlySend);

  // ---- ジャズ / ボッサ回路 (彩り) ----
  epBus=ctx.createGain(); epBus.gain.value=.72;   // 音が短いぶん量で釣り合いを取る (D-41)
  /* Juno のコーラス (D-40)。短いディレイを2本、少しずつ違う速さで揺らして
     左右に振る。原音と足すと、あの厚みとうねりになる */
  const epOut=ctx.createGain(); epOut.gain.value=1;
  epBus.connect(epOut);                       // 原音
  for(const [dt,rate,pan] of [[.0042,.62,-.8],[.0071,.93,.8]]){
    const dl=ctx.createDelay(.05); dl.delayTime.value=dt;
    const lfo=ctx.createOscillator(), dep=ctx.createGain();
    lfo.type='sine'; lfo.frequency.value=rate; dep.gain.value=dt*.45;
    lfo.connect(dep).connect(dl.delayTime); lfo.start();
    const pn=ctx.createStereoPanner(); pn.pan.value=pan;
    const g=ctx.createGain(); g.gain.value=.6;
    epBus.connect(dl); dl.connect(pn).connect(g).connect(epOut);
  }
  epOut.connect(dry);
  const eRev=ctx.createGain(); eRev.gain.value=.35; epOut.connect(eRev).connect(revSend);
  const eDly=ctx.createGain(); eDly.gain.value=.2;  epOut.connect(eDly).connect(dlySend);

  /* ---- インダストリアル・ノイズの発音 (D-38) ----
   1音ごとに音色を不規則に振る。素材・再生速度・フィルタの種類と帯域・
   減衰の長さを毎回引き直すので、同じ音は二度と出ない */
function industrialHit(time,vel,pan){
  const metal=Math.random()<.45;
  const src=ctx.createBufferSource();
  src.buffer = metal ? metalBuf : noiseBuf;
  src.loop=true;
  src.playbackRate.value = metal ? rand(.35,2.6) : rand(.6,1.8);
  // ときどき再生速度を落として、崩れ落ちるような音にする
  if(Math.random()<.3) src.playbackRate.exponentialRampToValueAtTime(
    Math.max(.15,src.playbackRate.value*rand(.25,.6)), time+rand(.08,.3));

  const f=ctx.createBiquadFilter();
  f.type = Math.random()<.55 ? 'bandpass' : 'highpass';
  f.frequency.value = rand(320,7200);
  f.Q.value = rand(.8,12);
  if(Math.random()<.35) f.frequency.exponentialRampToValueAtTime(
    Math.max(180,f.frequency.value*rand(.2,3)), time+rand(.06,.35));

  const dec=rand(.02,.28);
  const g=ctx.createGain(), pn=ctx.createStereoPanner();
  pn.pan.value=clamp(pan+rand(-.08,.08),-1,1);
  decayTo(g.gain,time,vel*.26,dec,.002);
  src.connect(f).connect(g).connect(pn).connect(noiseBus);
  src.start(time); src.stop(time+dec+.05);
  for(const n of [src,f,g,pn]) disposeAt(n,time+dec+.12);
}

/* ---- コード弾きの連打 (D-34) ----
     持続する音色の代わりに、サステインを持たない短い和音を連打する。
     専用のステレオディレイ (左右で返しを送り合う ping-pong) へ送り、
     原音より返しのほうが多く出るようにする */
  chopBus=ctx.createGain(); chopBus.gain.value=0;
  const chDry=ctx.createGain(); chDry.gain.value=.45;
  chopBus.connect(chDry).connect(mixFilter);
  const chRev=ctx.createGain(); chRev.gain.value=.25; chopBus.connect(chRev).connect(revSend);
  chopDly=ctx.createGain(); chopDly.gain.value=.7;
  chopBus.connect(chopDly);
  const mkChop=(pan)=>{
    const d=ctx.createDelay(4), fb=ctx.createGain(), lp=ctx.createBiquadFilter(),
          pn=ctx.createStereoPanner(), o=ctx.createGain();
    lp.type='lowpass'; lp.frequency.value=3200; fb.gain.value=.38;
    pn.pan.value=pan; o.gain.value=.65;
    d.connect(lp); lp.connect(o).connect(pn).connect(mixFilter);
    return {d,fb,lp,pn,o};
  };
  const chL=mkChop(-.8), chR=mkChop(.8);
  chopDly.connect(chL.d); chopDly.connect(chR.d);
  chL.lp.connect(chL.fb).connect(chR.d);
  chR.lp.connect(chR.fb).connect(chL.d);
  chopTaps={l:chL,r:chR};

  /* ---- インダストリアル・ノイズ (D-38) ----
     小節に乗らない周期で回る打点。左右それぞれが独立した周期を持ちうる */
  noiseBus=ctx.createGain(); noiseBus.gain.value=0;
  noiseSat=ctx.createWaveShaper();
  {
    const n=1024, curve=new Float32Array(n);
    for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; curve[i]=Math.tanh(x*2.6); }
    noiseSat.curve=curve; noiseSat.oversample='2x';
  }
  noiseBus.connect(noiseSat);
  noiseSat.connect(dry);
  const nRev=ctx.createGain(); nRev.gain.value=.22; noiseSat.connect(nRev).connect(revSend);
  const nDly=ctx.createGain(); nDly.gain.value=.18; noiseSat.connect(nDly).connect(dlySend);
  build.noiseSends={rev:nRev,dly:nDly};

  build.harmSends={pad:{rev:pRev,dly:pDly}, stab:{dry:sDry,rev:sRev,dly:sDly}, ep:{rev:eRev,dly:eDly}};

  /* ---- フェーザー (D-28) ----
     全域通過フィルタを4段重ね、その周波数を LFO で揺らす。
     原音と足すと、動く谷が周波数軸を上下する。普段は wet が 0 で、
     第3層イベントの phaser が持ち上げる */
  phaserSend=ctx.createGain(); phaserSend.gain.value=1;
  phaserWet=ctx.createGain(); phaserWet.gain.value=0;
  let node=phaserSend;
  const stages=[];
  for(let i=0;i<4;i++){
    const ap=ctx.createBiquadFilter();
    ap.type='allpass'; ap.frequency.value=340*Math.pow(2.1,i); ap.Q.value=.7;
    node.connect(ap); node=ap; stages.push(ap);
  }
  node.connect(phaserWet).connect(mixFilter);
  const plfo=ctx.createOscillator(), pdep=ctx.createGain();
  plfo.type='sine'; plfo.frequency.value=.25; pdep.gain.value=0;
  for(const ap of stages) pdep.connect(ap.frequency);
  plfo.connect(pdep); plfo.start();
  phaserLfo={osc:plfo, depth:pdep, stages};
  drumMix.connect(phaserSend);   // ドラムも通す。接続はフェーザーができてから行う

  // ---- 16分のシーケンス (D-21) ----
  // 盛り上げるときのために、本線とは別のステレオディレイを持たせる。
  // 左右で16分3つと5つ、返しを互いに送り合うので像が左右に開いていく
  leadBus=ctx.createGain(); leadBus.gain.value=0;
  // シーケンス全体にかかるフィルタ。小節をまたぐ上げ下げと、
  // レゾナンスを上げての発振はここで作る (D-29)
  leadFilt=ctx.createBiquadFilter();
  leadFilt.type='lowpass'; leadFilt.frequency.value=6000; leadFilt.Q.value=1;
  leadBus.connect(leadFilt);
  leadFilt.connect(dry);
  leadFilt.connect(phaserSend);
  const lRev=ctx.createGain(); lRev.gain.value=.18; leadFilt.connect(lRev).connect(revSend);

  leadDly=ctx.createGain(); leadDly.gain.value=0;
  leadFilt.connect(leadDly);
  const mkPing=(pan)=>{
    const d=ctx.createDelay(4), fb=ctx.createGain(), lp=ctx.createBiquadFilter(),
          pn=ctx.createStereoPanner(), o=ctx.createGain();
    lp.type='lowpass'; lp.frequency.value=3800; fb.gain.value=.42;
    pn.pan.value=pan; o.gain.value=.6;
    d.connect(lp); lp.connect(o).connect(pn).connect(mixFilter);
    return {d,fb,lp,pn,o};
  };
  const pingL=mkPing(-.85), pingR=mkPing(.85);
  leadDly.connect(pingL.d); leadDly.connect(pingR.d);
  pingL.lp.connect(pingL.fb).connect(pingR.d);   // 返しを左右で送り合う
  pingR.lp.connect(pingR.fb).connect(pingL.d);
  leadTaps={l:pingL,r:pingR};
  build.leadSends={rev:lRev};
}

/* ---- 16分のシーケンスの発音 (D-21) ----
   ディケイの短いアナログシンセの音。音色は小節ごとに引き直す */
const LEAD_TYPES=['sawtooth','square','triangle','pulse'];
function leadNote(time,midi,vel,dec,type){
  const g=ctx.createGain(), f=ctx.createBiquadFilter(), pn=ctx.createStereoPanner();
  f.type='lowpass'; f.Q.value=4.5;
  const base=900+current.yy*2600;
  f.frequency.setValueAtTime(Math.min(base*3.2,11000),time);
  f.frequency.exponentialRampToValueAtTime(Math.max(300,base*.7),time+dec*.8);
  pn.pan.value=rand(-.3,.3);
  decayTo(g.gain,time,vel*.20,dec,.003);
  f.connect(g).connect(pn).connect(leadBus);

  const freq=mtof(midi);
  if(type==='pulse'){
    // ベースと同じ作り方。鋸波とその遅延の差で細いパルスを作る
    const a=ctx.createOscillator(), b=ctx.createOscillator(),
          d=ctx.createDelay(.02), inv=ctx.createGain();
    inv.gain.value=-1;
    for(const o of [a,b]){ o.type='sawtooth'; o.frequency.value=freq; }
    d.delayTime.value=(.5/freq)*rand(.3,.7);   // 細めのパルス
    a.connect(f); b.connect(d).connect(inv).connect(f);
    for(const n of [a,b]){ n.start(time); n.stop(time+dec+.05); }
    for(const n of [a,b,d,inv]) disposeAt(n,time+dec+.1);
  }else{
    const o=ctx.createOscillator();
    o.type=type; o.frequency.value=freq; o.detune.value=rand(-6,6);
    o.connect(f); o.start(time); o.stop(time+dec+.05);
    disposeAt(o,time+dec+.1);
  }
  for(const n of [f,g,pn]) disposeAt(n,time+dec+.1);
}

/* ---- 和音 ----
   度数は主音からの半音数。品質ごとの構成音を持つ */
const QUALITIES={
  m7:  [0,3,7,10],
  m9:  [0,3,7,10,14],
  m11: [0,3,7,10,14,17],
  maj9:[0,4,7,11,14],
  add9:[0,4,7,14],
  sus2:[0,2,7,14],
  x13: [0,4,10,14,21],
};
// 進行。回路ごとに持つ。スタブは進行しない (D-9)
const PROGS={
  stab:    [ [[0,'m9']], [[0,'m9'],[10,'m7']] ],
  sustain: [ [[0,'add9'],[5,'add9']], [[0,'add9'],[9,'m9']], [[0,'sus2'],[7,'add9']] ],
  jazz:    [ [[2,'m9'],[7,'x13'],[0,'maj9']], [[0,'maj9'],[5,'m9']], [[0,'maj9'],[2,'m11'],[7,'x13']] ],
  funk:    [ [[0,'m7']], [[0,'m7'],[5,'m7']] ],
};
// 和音が変わる間隔 (小節)。ジャズは細かく、スタブはほぼ動かない
const CHORD_BARS={stab:16, sustain:8, jazz:4, funk:8};

const circuit = () => SCENES[sceneIdx].group;

let prog=PROGS.stab[0], progPos=0, chordDeg=0, chordQual='m9', chordAt=-999;

function pickProg(){
  const c=circuit();
  prog=pick(PROGS[c]);
  progPos=0;
  setChord();
}
function setChord(){
  const [deg,q]=prog[progPos%prog.length];
  chordDeg=deg; chordQual=q;
}
// 和音の構成音を midi で返す。base は最低音のおおよその位置
function chordNotes(base){
  const iv=QUALITIES[chordQual]||QUALITIES.m9;
  const root=base+keyPc+chordDeg;
  return iv.map(i=>root+i);
}
// ルートを省いて3度と7度を中音域へ寄せた積み方 (D-9 のジャズ回路)
function rootlessNotes(base){
  const iv=(QUALITIES[chordQual]||QUALITIES.maj9).slice(1);
  const root=base+keyPc+chordDeg;
  return iv.map(i=>root+(i%12)+((i>=12)?12:0)).sort((a,b)=>a-b);
}

/* ============================================================
   Ladder フィルタ (D-10)
   ------------------------------------------------------------
   ベースの中核。BiquadFilter の多段近似ではレゾナンスを上げたときの
   粘りと飽和が出ないため、音声スレッドで自前に持つ。
   4段の一次ローパスに負帰還をかけ、各段を tanh で飽和させる古典的な構成。
   単一ファイル方針は Blob URL で読み込むことで保つ (時計と同じ手)。
   ============================================================ */
const LADDER_SRC=`
class LadderProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors(){
    return [
      {name:'cutoff',    defaultValue:700, minValue:30, maxValue:16000, automationRate:'a-rate'},
      {name:'resonance', defaultValue:1.4, minValue:0,  maxValue:4.2,   automationRate:'k-rate'},
      {name:'drive',     defaultValue:1.0, minValue:.1, maxValue:8,     automationRate:'k-rate'},
    ];
  }
  constructor(){ super(); this.s=[0,0,0,0]; }
  process(inputs, outputs, params){
    const inp=inputs[0][0], out=outputs[0][0];
    if(!out) return true;
    if(!inp){ out.fill(0); return true; }
    const cut=params.cutoff, res=params.resonance[0], drv=params.drive[0];
    const nyq=sampleRate*0.45, s=this.s;
    for(let i=0;i<out.length;i++){
      const fc=Math.min(cut.length>1?cut[i]:cut[0], nyq);
      const g=1-Math.exp(-2*Math.PI*fc/sampleRate);
      // 4段目の出力を戻す。レゾナンスを上げるほど低域が痩せるのが ladder の性格
      const x=Math.tanh(inp[i]*drv - res*s[3]);
      s[0]+=g*(x-Math.tanh(s[0]));
      s[1]+=g*(Math.tanh(s[0])-Math.tanh(s[1]));
      s[2]+=g*(Math.tanh(s[1])-Math.tanh(s[2]));
      s[3]+=g*(Math.tanh(s[2])-Math.tanh(s[3]));
      out[i]=s[3];
    }
    return true;
  }
}
registerProcessor('ladder', LadderProcessor);
`;
let ladderReady=false;

// ベースの経路を組む。Worklet が使えない環境では BiquadFilter 2段へ落とす
function ensureBass(){
  if(bassReady) return;
  bassSum=ctx.createGain(); bassSum.gain.value=.3;   // 鋸の差で作るぶん振幅が大きい
  bassPre=ctx.createGain(); bassPre.gain.value=1;
  bassShaper=ctx.createWaveShaper();
  {
    const n=1024, curve=new Float32Array(n);
    for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; curve[i]=Math.tanh(x*2.2); }
    bassShaper.curve=curve; bassShaper.oversample='4x';
  }
  if(ladderReady){
    bassLadder=new AudioWorkletNode(ctx,'ladder',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
  }else{
    // 代替。粘りは出ないが鳴らないよりはよい
    const a=ctx.createBiquadFilter(), b=ctx.createBiquadFilter();
    a.type='lowpass'; b.type='lowpass'; a.Q.value=6; b.Q.value=.7;
    a.connect(b);
    bassLadder={ _a:a, _b:b, connect:(n)=>b.connect(n),
      parameters:{ get:(k)=> k==='cutoff' ? a.frequency : k==='resonance' ? a.Q : b.gain } };
    bassLadder.__in=a;
  }
  bassAmp=ctx.createGain(); bassAmp.gain.value=0;
  bassComp=ctx.createDynamicsCompressor();
  // 「厚めのコンプが効いた音」(D-3)。速く深くかけて質量を出す
  bassComp.threshold.value=-22; bassComp.knee.value=6; bassComp.ratio.value=6;
  bassComp.attack.value=.004; bassComp.release.value=.12;
  bassBus=ctx.createGain(); bassBus.gain.value=.9;

  bassSum.connect(bassPre).connect(bassShaper);
  bassShaper.connect(bassLadder.__in || bassLadder);
  bassLadder.connect(bassAmp);
  bassAmp.connect(bassComp).connect(bassBus);
  bassBus.connect(dry);
  /* ベースが疎な小節でだけ掛けるフェーザー (D-39)。
     全域通過4段を LFO で揺らし、原音と足す。普段は wet が 0 */
  {
    let node=bassBus;
    const stages=[];
    for(let i=0;i<4;i++){
      const ap=ctx.createBiquadFilter();
      ap.type='allpass'; ap.frequency.value=220*Math.pow(2.2,i); ap.Q.value=.6;
      node.connect(ap); node=ap; stages.push(ap);
    }
    bassPhWet=ctx.createGain(); bassPhWet.gain.value=0;
    node.connect(bassPhWet).connect(dry);
    const lo=ctx.createOscillator(), dep=ctx.createGain();
    lo.type='sine'; lo.frequency.value=.15; dep.gain.value=520;
    for(const ap of stages) dep.connect(ap.frequency);
    lo.connect(dep); lo.start();
    bassPhLfo={osc:lo,depth:dep};
  }
  const bRev=ctx.createGain(); bRev.gain.value=.08; bassBus.connect(bRev).connect(revSend);
  const bDly=ctx.createGain(); bDly.gain.value=.10; bassBus.connect(bDly).connect(dlySend);
  build.bassSends={rev:bRev,dly:bDly};

  // ゆっくりしたうねり。「ベースラインにフィルタが揺れ動く」の土台 (D-3)
  const lo=ctx.createOscillator(), lg=ctx.createGain();
  lo.type='sine'; lo.frequency.value=.06; lg.gain.value=0;
  lo.connect(lg).connect(bassCutParam());
  lo.start();
  bassLfo={osc:lo,gain:lg};
  bassReady=true;
}
const bassCutParam = () => bassLadder.parameters ? bassLadder.parameters.get('cutoff') : bassLadder.frequency;
const bassResParam = () => bassLadder.parameters ? bassLadder.parameters.get('resonance') : null;
const bassDrvParam = () => (bassLadder.parameters && bassLadder.parameters.get('drive')) || null;

/* ============================================================
   ベース (D-10)
   ------------------------------------------------------------
   矩形波3基を ±7cent でデチューンし、1オクターブ下のサブを足す。
   飽和 → Ladder → 深いコンプ、という順で質量を作る。
   単音なので包絡とフィルタは共有の段に持たせ、打点ごとには
   オシレータだけを立てる。
   ============================================================ */
/* 矩形波を1本のオシレータでは作らず、鋸波とその遅延の差で作る。
   遅延の長さがそのままパルス幅になるので、そこを揺らせば pulse width modulation になり、
   デチューンだけでは出ない厚みとコーラス感が乗る (D-18) */
function pulseVoice(t,freq,cents,dur){
  const a=ctx.createOscillator(), b=ctx.createOscillator();
  for(const o of [a,b]){ o.type='sawtooth'; o.frequency.value=freq; o.detune.value=cents; }
  const d=ctx.createDelay(.05), inv=ctx.createGain();
  inv.gain.value=-1;
  const half=.5/freq;             // 半周期ぶん遅らせると duty 50% の矩形波になる
  d.delayTime.value=half;
  const lfo=ctx.createOscillator(), lg=ctx.createGain();
  lfo.type='sine'; lfo.frequency.value=rand(.12,.45);
  lg.gain.value=half*.5;          // duty はおおよそ 25〜75% の間で揺れる
  lfo.connect(lg).connect(d.delayTime);
  a.connect(bassSum);
  b.connect(d).connect(inv).connect(bassSum);
  for(const n of [a,b,lfo]){ n.start(t); n.stop(t+dur+.06); }
  for(const n of [a,b,lfo,d,inv,lg]) disposeAt(n,t+dur+.12);
}

function bassNote(time,midi,durSec,vel,accent){
  if(!bassReady) return;
  const f=mtof(midi), t=time;
  const oscs=[];
  for(const cents of [-7,0,7]) pulseVoice(t,f,cents,durSec);
  // サブ。ここが「厚み」の半分を担う
  const sub=ctx.createOscillator(), sg=ctx.createGain();
  sub.type='square'; sub.frequency.value=f/2;
  sg.gain.value=.85+current.weight*.5;
  sub.connect(sg).connect(bassSum); sub.start(t); sub.stop(t+durSec+.06);
  oscs.push(sub);
  for(const o of oscs) disposeAt(o,t+durSec+.12);
  disposeAt(sg,t+durSec+.12);

  // 振幅。持続する音と、ディケイだけのタイトな音の2通りを持つ (D-25)
  const g=bassAmp.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(Math.max(g.value,.0001),t);
  g.linearRampToValueAtTime(vel*.9,t+.005);
  if(bassTight){
    // サスティンを持たず、短いディケイだけで落とす。リリースもほぼ無い
    const dec=Math.min(durSec*.55,.13);
    g.exponentialRampToValueAtTime(.0001,t+dec);
  }else{
    // 頭を出したあと、サスティンは頭より低いところで伸ばす (D-43)。
    // 頭と同じ高さで持たせると、鳴っている間じゅうベースが前に出続ける
    const sus=Math.max(vel*.5,.0002);
    g.exponentialRampToValueAtTime(sus,t+Math.min(durSec*.3,.16));
    g.setValueAtTime(sus,t+durSec*.85);
    g.linearRampToValueAtTime(.0001,t+durSec);
  }

  // フィルタ包絡。1音ごとにカットオフを叩いて戻す。アクセントで深さが変わる
  // フィルタ包絡。頭を大きく開けてから短い時間で閉じる。
  // 開き幅と閉じる速さがベースの粘りを決めるので、ここは長さより落差を優先する。
  // 音程が動かない小節では、開き幅と落ち着き先を1音ごとに振って単調さを補う (D-42)
  const cp=bassCutParam();
  const base=bassCutoffBase()*(bassWobble?rand(.3,3.4):1);
  const mul=bassWobble ? (rand(3,15)+accent*4+current.drive*3)
                      : (4.5+accent*7+current.drive*3.5);
  const peak=Math.min(base*mul, 15000);
  const settle=Math.min(durSec*.45,.16);
  cp.cancelScheduledValues(t);
  cp.setValueAtTime(peak,t);
  cp.exponentialRampToValueAtTime(Math.max(60,base),t+settle);
  if(bassWobble){
    // 落ち着いたあとも動かし続ける。1音の中で二度三度と行き先を変える (D-42)
    let at=t+settle, f=base;
    while(at < t+durSec*.95){
      const span=Math.min(rand(.05,.22), t+durSec-at);
      if(span<=.01) break;
      f=clamp(base*rand(.25,4.2), 70, 15000);
      cp.exponentialRampToValueAtTime(f, at+span);
      at+=span;
    }
    // レゾナンスも一緒に振る。発振寸前まで上げる音も混ぜる。
    // apply() 側は揺らしている間これに触らない
    const rp=bassResParam();
    if(rp){
      rp.cancelScheduledValues(t);
      rp.setValueAtTime(clamp(1.8+Math.random()*2.35,0,4.2),t);
      if(durSec>.25) rp.linearRampToValueAtTime(clamp(1.5+Math.random()*2.6,0,4.2),t+durSec*.8);
    }
  }
}

// シーケンスのフィルタの基準値。陽ほど開き、build の局面ではさらに開く
function leadCutoffBase(){
  return (1400+current.yy*5200)*(phrase==='build'?1.5:1);
}

// カットオフの基準値。陰は低く閉じ、陽は高く開く
function bassCutoffBase(){
  const yy=current.yy, w=current.weight;
  return (170+yy*680)*(1.25-w*.5);
}

/* ---- 持続回路の発音 (D-9) ----
   4層を持ち、下2層は和音が変わるたびに組み直す持続音、
   上2層はアルペジオと高域リフで、打点ごとに鳴らす */
// ベースの音色。シーンに入るたびに引き直す。
// true なら、サスティンを持たずディケイだけで落ちるタイトな音になる (D-25)
/* インダストリアル・ノイズ (D-38)。
   周期は16分5〜15個、または8分5〜7個。どちらも16の約数にならないので、
   小節をまたぐたびに位置がずれてポリリズムになる */
const NOISE_P={stab:.6, jazz:.2, funk:.3, sustain:.2};
let noiseOn=false, noiseGens=[];

function makeNoiseGen(pan){
  const eighth=Math.random()<.5;
  let count, len;
  do{
    count = eighth ? 5+Math.floor(Math.random()*3)     // 8分5〜7個
                   : 5+Math.floor(Math.random()*11);   // 16分5〜15個
    len = eighth ? count*2 : count;                    // 16分に換算した周期
    // 16の約数だと小節にそのまま乗ってしまい、ポリリズムにならない (16分8個がこれに当たる)
  }while(16 % len === 0);
  const step = eighth ? 2 : 1;
  const pat=new Array(len).fill(null);
  for(let i=0;i<len;i+=step){
    if(Math.random()<.35) continue;                        // 休符
    pat[i]={vel:.4+Math.random()*.5};
  }
  if(!pat.some(Boolean)) pat[0]={vel:.7};
  return {len,pat,pan,count,eighth};
}
function rollNoise(group){
  noiseOn = Math.random() < (NOISE_P[group]||0);
  if(!noiseOn){ noiseGens=[]; return; }
  // 7割は左右それぞれ独立した周期。3割はどちらか片側だけ
  noiseGens = Math.random()<.7
    ? [makeNoiseGen(-.82), makeNoiseGen(.82)]
    : [makeNoiseGen(Math.random()<.5 ? -.82 : .82)];
}

let bassTight=false;
// いまの小節のベースの音符数。5未満ならフェーザーを掛ける (D-39)
let bassNotes=0;
const bassSparse = () => bassNotes>0 && bassNotes<5;
// 音程が動かない小節。1音ごとにフィルタとレゾナンスを振る (D-42)
let bassWobble=false;
// true なら、持続する和音の代わりに短い和音を連打する (D-34)
let padChop=false;

let padVoices=[];
function padRebuild(time){
  if(!padLayer.length) return;
  const xf=1.4;   // 前の和音との重なり。切り替えの継ぎ目を出さない
  for(const v of padVoices){
    v.g.gain.cancelScheduledValues(time);
    v.g.gain.setValueAtTime(v.g.gain.value,time);
    v.g.gain.linearRampToValueAtTime(.0001,time+xf);
    for(const o of v.osc) try{ o.stop(time+xf+.05); }catch(e){}
    disposeAt(v.g,time+xf+.2);
  }
  padVoices=[];
  const tones=chordNotes(48);
  for(let layer=0;layer<2;layer++){
    const g=ctx.createGain(); g.gain.value=.0001;
    g.connect(padLayer[layer]);
    const osc=[];
    for(const n of tones){
      const f=mtof(n+layer*12);
      for(const det of [-6,6]){
        const o=ctx.createOscillator();
        o.type = layer===0 ? 'sawtooth' : 'triangle';
        o.frequency.value=f; o.detune.value=det;
        o.connect(g); o.start(time); osc.push(o);
      }
    }
    g.gain.setValueAtTime(.0001,time);
    g.gain.linearRampToValueAtTime(.8/tones.length,time+xf);
    padVoices.push({g,osc});
  }
}

// アルペジオと高域リフ。短い撥弦のような音
function padPluck(time,midi,layerIdx,type,dec,vel){
  const o=ctx.createOscillator(), g=ctx.createGain(), pn=ctx.createStereoPanner();
  o.type=type; o.frequency.value=mtof(midi);
  pn.pan.value=rand(-.5,.5);
  decayTo(g.gain,time,vel*.16,dec,.004);
  o.connect(g).connect(pn).connect(padLayer[layerIdx]);
  o.start(time); o.stop(time+dec+.05);
  disposeAt(o,time+dec+.1); disposeAt(g,time+dec+.1); disposeAt(pn,time+dec+.1);
}

/* ---- インダストリアル・ノイズの発音 (D-38) ----
   1音ごとに音色を不規則に振る。素材・再生速度・フィルタの種類と帯域・
   減衰の長さを毎回引き直すので、同じ音は二度と出ない */
function industrialHit(time,vel,pan){
  const metal=Math.random()<.45;
  const src=ctx.createBufferSource();
  src.buffer = metal ? metalBuf : noiseBuf;
  src.loop=true;
  src.playbackRate.value = metal ? rand(.35,2.6) : rand(.6,1.8);
  // ときどき再生速度を落として、崩れ落ちるような音にする
  if(Math.random()<.3) src.playbackRate.exponentialRampToValueAtTime(
    Math.max(.15,src.playbackRate.value*rand(.25,.6)), time+rand(.08,.3));

  const f=ctx.createBiquadFilter();
  f.type = Math.random()<.55 ? 'bandpass' : 'highpass';
  f.frequency.value = rand(320,7200);
  f.Q.value = rand(.8,12);
  if(Math.random()<.35) f.frequency.exponentialRampToValueAtTime(
    Math.max(180,f.frequency.value*rand(.2,3)), time+rand(.06,.35));

  const dec=rand(.02,.28);
  const g=ctx.createGain(), pn=ctx.createStereoPanner();
  pn.pan.value=clamp(pan+rand(-.08,.08),-1,1);
  decayTo(g.gain,time,vel*.26,dec,.002);
  src.connect(f).connect(g).connect(pn).connect(noiseBus);
  src.start(time); src.stop(time+dec+.05);
  for(const n of [src,f,g,pn]) disposeAt(n,time+dec+.12);
}

/* ---- コード弾きの連打 (D-34) ----
   サステインを持たず、短いディケイだけで落ちる和音。ステレオディレイで広げる */
function chordChop(time,vel){
  const tones=chordNotes(48);
  const g=ctx.createGain(), f=ctx.createBiquadFilter(), pn=ctx.createStereoPanner();
  f.type='lowpass'; f.Q.value=3.2;
  const base=1200+current.yy*3200;
  f.frequency.setValueAtTime(Math.min(base*2.4,9000),time);
  f.frequency.exponentialRampToValueAtTime(Math.max(400,base*.8),time+.08);
  pn.pan.value=rand(-.25,.25);
  decayTo(g.gain,time,vel*.16,.085,.003);
  f.connect(g).connect(pn).connect(chopBus);
  for(const n of tones){
    for(const det of [-4,4]){
      const o=ctx.createOscillator();
      o.type='sawtooth'; o.frequency.value=mtof(n); o.detune.value=det;
      o.connect(f); o.start(time); o.stop(time+.16);
      disposeAt(o,time+.2);
    }
  }
  for(const n of [f,g,pn]) disposeAt(n,time+.24);
}

/* ---- スタブ回路の発音 (D-9) ----
   裏拍に短く刺す。原音は薄く、ディレイへ送る量が多い */
function stabHit(time,vel){
  const tones=chordNotes(48);   // 基準は C (midi 48)。12の倍数でないと音名がずれる
  const g=ctx.createGain(), pn=ctx.createStereoPanner();
  pn.pan.value=rand(-.35,.35);
  decayTo(g.gain,time,vel*.18,.13,.004);
  g.connect(pn).connect(stabBus);
  for(const n of tones){
    for(const det of [-5,5]){
      const o=ctx.createOscillator();
      o.type='sawtooth'; o.frequency.value=mtof(n); o.detune.value=det;
      o.connect(g); o.start(time); o.stop(time+.2);
      disposeAt(o,time+.25);
    }
  }
  disposeAt(g,time+.3); disposeAt(pn,time+.3);
}

/* ---- ジャズ / ボッサ回路の発音 (D-9) ----
   FM のエレピ。変調指数を落としながら鳴らすと鍵盤らしい減衰になる */
/* Juno-106 のような、みずみずしい矩形波の音 (D-40)。
   パルス波 (鋸とその遅延の差) にパルス幅変調を掛け、鋸と1オクターブ下の
   サブ矩形を足す。2段のローパスを包絡で開いて閉じる。
   後段のコーラスで厚みを作るので、ここでは素のまま出す */
function epNote(time,midi,vel,dec){
  const f=mtof(midi);
  const sum=ctx.createGain(); sum.gain.value=.42;
  const pn=ctx.createStereoPanner(); pn.pan.value=rand(-.15,.15);
  const nodes=[sum,pn];

  // DCO: パルス波。遅延の長さがパルス幅になり、そこを LFO で揺らす
  const a=ctx.createOscillator(), b=ctx.createOscillator();
  for(const o of [a,b]){ o.type='sawtooth'; o.frequency.value=f; }
  const d=ctx.createDelay(.05), inv=ctx.createGain(); inv.gain.value=-1;
  const half=.5/f;
  d.delayTime.value=half*rand(.62,1);
  const plfo=ctx.createOscillator(), pg=ctx.createGain();
  plfo.type='sine'; plfo.frequency.value=rand(.25,.8); pg.gain.value=half*.38;
  plfo.connect(pg).connect(d.delayTime);
  a.connect(sum); b.connect(d).connect(inv).connect(sum);
  nodes.push(a,b,d,inv,plfo,pg);

  // 鋸を薄く重ねて芯を出す
  const saw=ctx.createOscillator(), sawG=ctx.createGain();
  saw.type='sawtooth'; saw.frequency.value=f; saw.detune.value=rand(-6,6);
  sawG.gain.value=.34; saw.connect(sawG).connect(sum);
  nodes.push(saw,sawG);

  // サブ。1オクターブ下の矩形 (D-27)
  const sub=ctx.createOscillator(), subG=ctx.createGain();
  sub.type='square'; sub.frequency.value=f/2;
  subG.gain.value=.58; sub.connect(subG).connect(sum);
  nodes.push(sub,subG);

  // 立ち下がりの長さ。短く切って歯切れを出す (D-41)
  const fall=Math.min(dec*.18,.11);

  // VCF: 24dB 相当に2段。VCA と同じ速さで閉じる
  const f1=ctx.createBiquadFilter(), f2=ctx.createBiquadFilter();
  f1.type='lowpass'; f2.type='lowpass'; f1.Q.value=3.4; f2.Q.value=.7;
  const base=Math.min(f*1.9+260,3000), peak=Math.min(base*3.6,9500);
  for(const fl of [f1,f2]){
    fl.frequency.setValueAtTime(peak,time);
    fl.frequency.exponentialRampToValueAtTime(base,time+fall);
    // 音が消えるのと同時に閉じきる。ここが開いたままだと歯切れが出ない
    fl.frequency.exponentialRampToValueAtTime(Math.max(base*.28,180),time+fall+.02);
  }
  nodes.push(f1,f2);

  // VCA: 立ち上がりは速く、短いディケイで落として最後は直線で切る
  const amp=ctx.createGain();
  amp.gain.setValueAtTime(.0001,time);
  amp.gain.exponentialRampToValueAtTime(Math.max(vel*.26,.0002),time+.006);
  amp.gain.exponentialRampToValueAtTime(Math.max(vel*.02,.0002),time+fall);
  amp.gain.linearRampToValueAtTime(0,time+fall+.02);   // 立ち下がりを鋭く
  nodes.push(amp);

  sum.connect(f1).connect(f2).connect(amp).connect(pn).connect(epBus);
  for(const o of [a,b,saw,sub,plfo]){ o.start(time); o.stop(time+dec+.06); }
  for(const n of nodes) disposeAt(n,time+dec+.14);
}

function epChord(time,vel){
  const notes=rootlessNotes(60);
  // 伸ばさず歯切れよく切る (D-41)
  notes.forEach((n,i)=>epNote(time+i*.006,n,vel*(i===0?1:.8),.30));
}

/* ============================================================
   ドラム音源 (D-10)
   すべて TR-808 の作り方に倣った合成。サンプルは持たない。
   各関数は「その時刻に鳴らして、鳴り終わったら片付ける」だけを行う。
   ============================================================ */
// 打点の接続先。DJ ミックス風の遷移の間だけ2本目へ向ける
let curDrumBus=null;
function drumOut(pan){
  const p=ctx.createStereoPanner(); p.pan.value=pan||0;
  p.connect(curDrumBus||drumBus);
  return p;
}
function decayTo(gain,t,peak,dec,atk){
  const a=atk||.001;
  gain.setValueAtTime(0.0001,t);
  gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);
  gain.exponentialRampToValueAtTime(.0001,t+a+dec);
}

// バスドラム: 正弦波のピッチ落ち + 冒頭の短いクリック
function bd(t,v){
  const k=kit().bd, w=current.weight;
  const o=ctx.createOscillator(), g=ctx.createGain(), p=drumOut(0);
  o.type='sine';
  const f0=k.f0*(1-w*.18), f1=k.f1*(1-w*.16);
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f1,t+k.pd);
  const dec=k.dec*(.8+w*.5);
  decayTo(g.gain,t,v*k.gain*(.55+w*.6),dec);
  o.connect(g).connect(p);
  o.start(t); o.stop(t+dec+.05);
  if(k.click>.02){
    const c=ctx.createBufferSource(), cg=ctx.createGain(), hp=ctx.createBiquadFilter();
    c.buffer=noiseBuf; c.loop=true; hp.type='highpass'; hp.frequency.value=1800;
    decayTo(cg.gain,t,v*k.click*.5,.012);
    c.connect(hp).connect(cg).connect(p);
    c.start(t); c.stop(t+.05);
    disposeAt(c,t+.1); disposeAt(hp,t+.1); disposeAt(cg,t+.1);
  }
  disposeAt(o,t+dec+.1); disposeAt(g,t+dec+.1); disposeAt(p,t+dec+.1);
}

// スネア: 正弦波2基 + ノイズ
function sd(t,v){
  const k=kit().sd, p=drumOut(-.05);
  for(const [f,amp] of [[k.tone,.6],[k.tone*1.62,.4]]){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f,t);
    o.frequency.exponentialRampToValueAtTime(f*.82,t+.08);
    decayTo(g.gain,t,v*amp*.5,.10);
    o.connect(g).connect(p); o.start(t); o.stop(t+.2);
    disposeAt(o,t+.25); disposeAt(g,t+.25);
  }
  const n=ctx.createBufferSource(), ng=ctx.createGain(), bp=ctx.createBiquadFilter();
  n.buffer=noiseBuf; n.loop=true; bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=.7;
  decayTo(ng.gain,t,v*k.noise*.5,k.dec);
  n.connect(bp).connect(ng).connect(p);
  n.start(t); n.stop(t+k.dec+.05);
  disposeAt(n,t+k.dec+.1); disposeAt(bp,t+k.dec+.1); disposeAt(ng,t+k.dec+.1); disposeAt(p,t+k.dec+.15);
}

// クラップ: 短いノイズを数回連射してから尾を引かせる
function cp(t,v){
  const p=drumOut(.12), bp=ctx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=1250; bp.Q.value=1.1; bp.connect(p);
  for(let i=0;i<3;i++){
    const n=ctx.createBufferSource(), g=ctx.createGain();
    n.buffer=noiseBuf; n.loop=true;
    const at=t+i*.011;
    decayTo(g.gain,at,v*.42,.016);
    n.connect(g).connect(bp); n.start(at); n.stop(at+.05);
    disposeAt(n,at+.1); disposeAt(g,at+.1);
  }
  const n=ctx.createBufferSource(), g=ctx.createGain();
  n.buffer=noiseBuf; n.loop=true;
  decayTo(g.gain,t+.033,v*.30,.16);
  n.connect(g).connect(bp); n.start(t+.033); n.stop(t+.25);
  disposeAt(n,t+.3); disposeAt(g,t+.3); disposeAt(bp,t+.35); disposeAt(p,t+.35);
}

// ハイハット: 焼いておいた矩形波6基の倍音列をハイパスで削って包絡をかける
function hh(t,v,open){
  const k=kit(), dec = open ? k.oh.dec : k.hh.dec;
  const n=ctx.createBufferSource(), hp=ctx.createBiquadFilter(), g=ctx.createGain(),
        p=drumOut(open?.18:.10);
  n.buffer=metalBuf; n.loop=true;
  n.playbackRate.value=rand(.97,1.03);   // 打点ごとにわずかに揺らす
  hp.type='highpass'; hp.frequency.value=k.hh.hp;
  decayTo(g.gain,t,v*k.hh.gain*(open?.85:1),dec);
  n.connect(hp).connect(g).connect(p);
  n.start(t+rand(0,.004)); n.stop(t+dec+.05);
  disposeAt(n,t+dec+.1); disposeAt(hp,t+dec+.1); disposeAt(g,t+dec+.1); disposeAt(p,t+dec+.15);
}

// シンバル: ハイハットと同じ源を低めのバンドパスで長く伸ばす
function cy(t,v){
  const n=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain(), p=drumOut(-.3);
  n.buffer=metalBuf; n.loop=true;
  bp.type='bandpass'; bp.frequency.value=5200; bp.Q.value=.5;
  decayTo(g.gain,t,v*.30,1.25);
  n.connect(bp).connect(g).connect(p);
  n.start(t); n.stop(t+1.4);
  disposeAt(n,t+1.5); disposeAt(bp,t+1.5); disposeAt(g,t+1.5); disposeAt(p,t+1.55);
}

// カウベル: 矩形波2基。electro のキットだけが使う
function cb(t,v){
  const p=drumOut(.3), bp=ctx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=2640; bp.Q.value=1.4; bp.connect(p);
  for(const f of [540,800]){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='square'; o.frequency.value=f;
    decayTo(g.gain,t,v*.20,.34);
    o.connect(g).connect(bp); o.start(t); o.stop(t+.4);
    disposeAt(o,t+.45); disposeAt(g,t+.45);
  }
  disposeAt(bp,t+.5); disposeAt(p,t+.5);
}

// タム: 正弦波のピッチ落ち。オカズで音程を下げながら並べる
function tom(t,v,tone){
  const o=ctx.createOscillator(), g=ctx.createGain(), p=drumOut(rand(-.6,.6));
  const f=110*Math.pow(2,tone);
  o.type='sine';
  o.frequency.setValueAtTime(f,t);
  o.frequency.exponentialRampToValueAtTime(f*.62,t+.16);
  decayTo(g.gain,t,v*.42,.30);
  o.connect(g).connect(p); o.start(t); o.stop(t+.4);
  disposeAt(o,t+.45); disposeAt(g,t+.45); disposeAt(p,t+.45);
}

// リム: ごく短い矩形波の打点
function rim(t,v,pan){
  const o=ctx.createOscillator(), g=ctx.createGain(), p=drumOut(pan);
  o.type='square'; o.frequency.value=rand(1500,1900);
  decayTo(g.gain,t,v*.20,.028);
  o.connect(g).connect(p); o.start(t); o.stop(t+.06);
  disposeAt(o,t+.1); disposeAt(g,t+.1); disposeAt(p,t+.1);
}

// パーカッション。キットに応じて3通りに作り分ける (D-3 の「FM も有効」はここ)
function perc(t,v,pan,tone){
  const k=kit();
  if(k.perc==='fm'){
    const car=ctx.createOscillator(), mod=ctx.createOscillator(),
          md=ctx.createGain(), g=ctx.createGain(), p=drumOut(pan);
    car.type='sine'; mod.type='sine';
    const f=220*Math.pow(2,tone);
    car.frequency.value=f; mod.frequency.value=f*2.47;
    md.gain.value=f*3.2;
    mod.connect(md).connect(car.frequency);
    decayTo(g.gain,t,v*k.percGain*.5,.18);
    car.connect(g).connect(p);
    car.start(t); mod.start(t); car.stop(t+.3); mod.stop(t+.3);
    disposeAt(car,t+.35); disposeAt(mod,t+.35); disposeAt(md,t+.35);
    disposeAt(g,t+.35); disposeAt(p,t+.35);
    return;
  }
  const n=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(), p=drumOut(pan);
  n.buffer = k.perc==='metal' ? metalBuf : noiseBuf; n.loop=true;
  n.playbackRate.value=Math.pow(2,tone);
  f.type='bandpass'; f.frequency.value=800*Math.pow(2,tone+1); f.Q.value=k.perc==='metal'?2.2:1.0;
  const dec = k.perc==='metal' ? .12 : .09;
  decayTo(g.gain,t,v*k.percGain*.45,dec);
  n.connect(f).connect(g).connect(p);
  n.start(t); n.stop(t+dec+.05);
  disposeAt(n,t+dec+.1); disposeAt(f,t+dec+.1); disposeAt(g,t+dec+.1); disposeAt(p,t+dec+.15);
}

/* ---- 現在値をオーディオに反映 ---- */
function apply(){
  if(!ctx || !ready) return;
  const tm=ctx.currentTime, T=.25, c=current;
  master.gain.setTargetAtTime(running ? volume/100 : 0, tm, T);

  // 押し出し: 飽和段の入りを持ち上げ、そのぶんを後段で戻す
  const drive=.55+c.drive*1.5;
  drumBus.gain.setTargetAtTime(drive,tm,T);
  build.drumPost.gain.setTargetAtTime(1/(.7+c.drive*.9),tm,T);

  // 空間: リバーブとディレイの量。ディレイはテンポに同期させる
  revGain.gain.setTargetAtTime(.12+c.space*.55,tm,T);
  const sd=stepDur();
  delayNodes.tapL.d.delayTime.setTargetAtTime(sd*3,tm,1.2);    // 付点8分
  // 右は16分5つ。3と5はどちらも16分のグリッドに乗り、互いに素なので
  // 返しが拍とずれ続けて dub 的な絡みになる。グリッドから外すと打点が濁る
  delayNodes.tapR.d.delayTime.setTargetAtTime(sd*5,tm,1.2);
  const dubbing = phrase==='dubout';
  if(tm>evDelayUntil){
    delayNodes.tapL.fb.gain.setTargetAtTime(.28+c.space*.34+(dubbing?.22:0),tm,T);
    delayNodes.tapR.fb.gain.setTargetAtTime(.24+c.space*.32+(dubbing?.22:0),tm,T);
  }
  delayNodes.tapL.o.gain.setTargetAtTime(.18+c.space*.5,tm,T);
  delayNodes.tapR.o.gain.setTargetAtTime(.16+c.space*.45,tm,T);
  build.drumSends.dly.gain.setTargetAtTime(.12+c.space*.35+(dubbing?.35:0),tm,T);
  build.drumSends.rev.gain.setTargetAtTime(.15+c.space*.5,tm,T);

  // ドラムのフィルタはフレーズ型で開き具合が変わる。
  // sweep イベントが動かしている間は触らない (取り合いになるため)
  if(tm>evFilterUntil){
    drumFilter.frequency.setTargetAtTime(phraseCutoff(),tm,T*2);
    drumFilter.Q.setTargetAtTime(1.0,tm,T);
  }
  if(tm>evMasterUntil) mixFilter.frequency.setTargetAtTime(20000,tm,T);

  // ベース (D-10)。押し出しが飽和の入りとレゾナンスを、重さが量と音域を決める
  if(bassReady){
    bassPre.gain.setTargetAtTime(.6+c.drive*1.9,tm,T);
    // 疎な小節はフェーザーを掛け、そのぶん量を1割下げる (D-39)
    const sparse=bassSparse();
    bassBus.gain.setTargetAtTime((phrase==='break'?.15:1)*(.36+c.weight*.42)*(sparse?.9:1),tm,T);
    bassPhWet.gain.setTargetAtTime(sparse?.55:0,tm,T*3);
    const res=bassResParam();
    // 揺らしている間は1音ごとに書くので、こちらからは触らない (D-42)
    if(res && !bassWobble) res.setTargetAtTime(1.1+c.drive*1.5,tm,T);
    // Ladder 自身の入力も持ち上げる。各段の tanh が効きはじめ、倍音が増える
    const drv=bassDrvParam();
    if(drv) drv.setTargetAtTime(.9+c.drive*3.2,tm,T);
    bassComp.threshold.setTargetAtTime(-18-c.drive*12,tm,T);
    // うねりの速さと深さ。密度が上がるほど速く、陽へ寄るほど深く振れる
    bassLfo.osc.frequency.setTargetAtTime(.035+c.density*.14,tm,T);
    bassLfo.gain.gain.setTargetAtTime(
      bassCutoffBase()*(bassWobble?(.9+c.yy*1.3):(.25+c.yy*.5)),tm,T);
    build.bassSends.dly.gain.setTargetAtTime(.05+c.space*.22+(dubbing?.2:0),tm,T);
    build.bassSends.rev.gain.setTargetAtTime(.04+c.space*.14,tm,T);
  }

  // ハーモニー3回路。鳴らすのは基本的にどれかひとつ (D-8)
  if(padBus){
    const cir=circuit(), L=padLayers();
    padBus.gain.setTargetAtTime((cir==='sustain'?.62:cir==='funk'?.28:0)*(.5+c.density*.5),tm,T*3);
    for(let i=0;i<4;i++){
      // 上の層ほど遅れて出る。剥がすときは速く落とす。
      // 連打のときは、持続音にあたる下2層を止めて代わりに連打が鳴る (D-34)
      const on = i<L && !(padChop && i<2);
      // 下2層が持続音、上2層がアルペジオと高域リフ。
      // 持続音は前に出すぎるので、上の層より低く敷く
      padLayer[i].gain.setTargetAtTime(on?(i<2?.55:.7):0, tm, on?T*4:T);
    }
    // 連打の量とディレイ。ディレイはテンポに同期させ、左右で16分3つと5つ
    chopBus.gain.setTargetAtTime(padChop?(.7*(.6+c.density*.5)):0,tm,T*2);
    noiseBus.gain.setTargetAtTime(noiseOn?(.95+c.density*.6)*(phrase==='break'?.2:1):0,tm,T*2);
    build.noiseSends.dly.gain.setTargetAtTime(.1+c.space*.35,tm,T);
    chopDly.gain.setTargetAtTime(.45+c.space*.6,tm,T*2);
    chopTaps.l.d.delayTime.setTargetAtTime(sd*3,tm,1.2);
    chopTaps.r.d.delayTime.setTargetAtTime(sd*5,tm,1.2);
    padFilter.frequency.setTargetAtTime(700+c.yy*4200+(phrase==='build'?2200:0),tm,T*3);
    stabBus.gain.setTargetAtTime(cir==='stab'?(phrase==='break'?.16:.78):0,tm,T*2);
    stabFilter.frequency.setTargetAtTime(1200+c.yy*2600,tm,T*2);
    epBus.gain.setTargetAtTime((cir==='jazz'||epGuest)?.42:0,tm,T*2);
    build.harmSends.stab.dly.gain.setTargetAtTime(.5+c.space*.6,tm,T);
    build.harmSends.pad.rev.gain.setTargetAtTime(.15+c.space*.4,tm,T);

    // 16分のシーケンス。盛り上げる局面ではステレオディレイを深くする (D-21)
    leadBus.gain.setTargetAtTime(phrase==='break'?.08:(.34+c.density*.3),tm,T*2);
    // フィルタは普段はゆっくり開き気味。イベントが動かしている間は触らない (D-29)
    if(tm>evLeadUntil){
      leadFilt.frequency.setTargetAtTime(leadCutoffBase(),tm,T*4);
      leadFilt.Q.setTargetAtTime(1,tm,T*2);
    }
    const lift = phrase==='build' ? .55 : phrase==='drop' ? .40 : phrase==='dubout' ? .30 : .10;
    leadDly.gain.setTargetAtTime(lift*(.5+c.space*.9),tm,T*3);
    const sd2=stepDur();
    leadTaps.l.d.delayTime.setTargetAtTime(sd2*3,tm,1.2);
    leadTaps.r.d.delayTime.setTargetAtTime(sd2*5,tm,1.2);
    for(const tp of [leadTaps.l,leadTaps.r])
      tp.fb.gain.setTargetAtTime(.30+lift*.35,tm,T*2);
  }
}

// 持続回路の層の数。build で1層ずつ積み上がり、drop で天井に達してから剥がれる (D-9)
function padLayers(){
  const c=circuit();
  if(c!=='sustain' && c!=='funk') return 0;
  if(phrase==='break') return 0;
  if(c==='funk') return 1;                     // funk では薄く敷くだけ (D-3)
  const u=clamp((barCount-phraseStartBar)/PHRASE_BARS);
  switch(phrase){
    case 'build':  return 1+Math.floor(u*3.99);
    case 'drop':   return 4;
    case 'dubout': return 1;
    default:       return 2;
  }
}

// フレーズ型ごとのドラムの開き具合。build は16小節かけて開いていく (D-9 のレイヤー累積に対応)
function phraseCutoff(){
  const u=clamp((barCount-phraseStartBar)/PHRASE_BARS);
  switch(phrase){
    case 'build':  return 900*Math.pow(20000/900,u);
    case 'break':  return 2600;
    case 'drop':   return 18000;
    case 'dubout': return 4200;
    default:       return 11000;
  }
}

/* ============================================================
   進行 — 第1層 シーン (D-4 / D-12 / D-13)
   ============================================================ */
let sceneIdx=0;          // いま鳴っているシーン
let pendingScene=-1;     // 遷移中の行き先
let transitionEndBar=-1;
let transitionMode='break';   // 'break' | 'morph' | 'mix' (D-5 の3方式)
/* 開発用。?transition=mix のように付けると遷移方式を固定できる。
   方式2と3は自動では数分に一度しか起きないので、手元での確認とテストに要る */
const forcedMode=(()=>{
  const v=new URLSearchParams(location.search).get('transition');
  return ['break','morph','mix'].includes(v) ? v : null;
})();
let seqB=null, patSeedB=1;    // ミックス中に重ねる、新シーンぶんの並び
let sceneStartBar=0;     // そのシーンが始まった小節
let sceneBars=0;         // このシーンを何小節続けるか
let recent=[];           // 直近に出たシーン。同じものを続けて引かないため

// 陰陽の波。陰 → 陽 → 陰 を 20〜40 分かけて往復する (D-13)
let wavePos=0;           // 0〜1 の位相
let wavePeriod=1800;     // 秒。1周期。揺らぎを持たせて毎回同じ形にはしない
const waveYY = pos => .5 - .5*Math.cos(pos*Math.PI*2);

function newWavePeriod(){ wavePeriod=rand(1200,2400); }

// 波の位置から次のシーンを選ぶ。直近に出たものは避ける
function chooseScene(){
  const yy=waveYY(wavePos);
  const cand=SCENES.map((s,i)=>({i,d:Math.abs(s.yy-yy)}))
    .filter(c=>!recent.includes(c.i))
    .sort((a,b)=>a.d-b.d);
  const pool=cand.slice(0,3);   // 最も近い3つから引き、同じ道を辿らせない
  return pool.length ? pick(pool).i : Math.floor(Math.random()*SCENES.length);
}

// evolution が高いほどシーンは短い。2〜5分 (D-12) を小節数に直す
function sceneLengthBars(){
  const sec=lerp(300,120,current.evolution)*rand(.85,1.15);
  // 16小節の倍数に丸める。末尾の8小節は遷移のブレイクに使うので、最低でも32小節取る
  return Math.max(32, Math.round(sec/(60/bpmNow()*4)/16)*16);
}

function enterScene(idx,{manual=false,keepKey=false}={}){
  sceneIdx=idx;
  if(manual){ pendingScene=-1; transitionEndBar=-1; }   // 手で選んだら遷移は打ち切る
  if(!keepKey) moveKey();   // キーはシーンごとに五度圏で近い調へ移る (D-9)
  reseedPattern();    // 並びも引き直す。前のシーンの模様を持ち越さない
  pickProg();         // 回路が変わるので和音の進行も選び直す
  // 陽と electro funk では刻む音になりやすく、陰では持続する音になりやすい
  bassTight = Math.random() < .5;   // 持続する音色とタイトな音色を半々で引く (D-25)
  rollNoise(SCENES[idx].group);     // インダストリアル・ノイズを出すかどうか (D-38)
  // コード弾きを持続音にするか連打にするか (D-34)。出やすさはシーンごとに持つ
  padChop = Math.random() < (SCENES[idx].chop||0);
  chordAt=-999;       // 次の小節で必ず和音を組み直す
  sceneStartBar=barCount;
  sceneBars=sceneLengthBars();
  recent.push(idx); if(recent.length>3) recent.shift();
  // 手で選ばれた場合は、そのシーンの陰陽へ波の位置を移してから続きを進める (D-13)
  if(manual) wavePos=yyToWavePos(SCENES[idx].yy);
  target.yy=SCENES[idx].yy;
  sceneEdited=false;
  updateScene();
  highlightScene();
  showProgress();   // 調と和音の表示も同時に追随させる。次の小節まで古い値を出さない
  ytSceneId=null;   // 背景の動画はシーン名で探すので、一覧を引き直す
}

// 陰陽値から波の位相を逆に引く。いまが上り坂なら上り側、下り坂なら下り側を返す
function yyToWavePos(yy){
  const a=Math.acos(clamp(1-2*yy,-1,1))/(Math.PI*2);   // 0〜.5 (上り)
  const rising = (wavePos%1) < .5;
  return rising ? a : 1-a;
}

/* ---- 第2層 フレーズ (16小節) ---- */
const PHRASE_BARS=16;
const BREAK_BARS=1;        // ブレイクは長くて1小節。それ以上続けると間延びする (D-24)
const TRANSITION_BARS=8;   // 遷移に充てる長さ (D-5 方式1)。ブレイクになるのは最後の1小節だけ
let phrase='plateau', phraseStartBar=0, phraseLen=PHRASE_BARS;

function choosePhrase(){
  const w=SCENES[sceneIdx].w;
  let sum=0; for(const k of PHRASES) sum+=w[k]||0;
  if(sum<=0) return 'plateau';
  let r=Math.random()*sum;
  for(const k of PHRASES){ r-=(w[k]||0); if(r<=0) return k; }
  return 'plateau';
}

// build が続いたあとは drop で剥がす、といった並びの制約はここに置く (D-9)
function nextPhrase(){
  const prev=phrase;
  let p=choosePhrase();
  if(prev==='build' && p==='build' && Math.random()<.6) p='drop';
  if(prev==='break' && p==='break') p='drop';
  phrase=p; phraseStartBar=barCount;
  phraseLen = p==='break' ? BREAK_BARS : PHRASE_BARS;   // ブレイクだけは1小節で抜ける
  reseedPattern();
  // ジャズ / ボッサ回路は主役シーンだけでなく、他のシーンへも短く差し込む (D-9)
  epGuest = circuit()!=='jazz' && phrase!=='break' && Math.random()<.18;
  showProgress();
}

/* ---- 第3層 イベント (4 / 8 小節の節目) ---- */
let lastEvent='—', lastEventBar=-99;

function maybeEvent(bar,time){
  const sc=SCENES[sceneIdx];
  // ブレイク中と定常では起きやすさが違う。build の途中は仕掛けを増やす
  const base = phrase==='build' ? .55 : phrase==='plateau' ? .30 : .40;
  if(Math.random()>base) return;
  const weights=EVENTS.map(e=>{
    if(!e.glitchy) return e.p;
    return e.p*(0.2+current.glitch*1.6)*(0.4+sc.glitch*1.2);   // グリッチ系だけ二重に重み付ける
  });
  let sum=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*sum;
  for(let i=0;i<EVENTS.length;i++){
    r-=weights[i];
    if(r<=0){ lastEvent=EVENTS[i].id; lastEventBar=bar; fireEvent(lastEvent,bar,time); break; }
  }
  showProgress();
}

/* ============================================================
   リズム生成 (D-7)
   ------------------------------------------------------------
   トラックごとに別の方式で作る。一律に確率を回すと、土台が崩れるか
   ハットがベタになるかのどちらかに落ちるため。
   各トラックは16個の強さ (0 なら鳴らさない) を持つ。
   ============================================================ */
const seq={kick:[],snare:[],clap:[],hat:[],ohat:[],perc1:[],perc2:[],rim:[],bass:[],
           stab:[],ep:[],arp:[],riff:[],fill:[],lead:[],chop:[]};
let leadType='sawtooth';   // 16分シーケンスの音色。小節ごとに引き直す
// オカズが次の小節へはみ出したぶん。次の小節の頭に足される
let pendingSpill=null;
// ジャズ回路を他のシーンへ短く差し込んでいる間だけ立つ (D-9)
let epGuest=false;
let hatRot=0, percPer=[3,5], percOff=[0,0], kickVariant=null;

/* 並びは毎小節引き直すが、種が同じなら同じ並びが出る。
   種が変わるのはシーン・フレーズが切り替わったときと、変異が当たったときだけ。
   こうしないとミニマルに要る反復が出ず、小節ごとにばらばらの並びになってしまう */
let patSeed=1234;
function rng(seed){
  let a=seed>>>0;
  return ()=>{
    a+=0x6D2B79F5;
    let t=a;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function reseedPattern(){ patSeed=(Math.random()*1e9)|0; }

// ユークリッドリズム E(k,n)。k個を n個の枠へ均した位置に置く。
// Bjorklund の厳密な手続きではないが、等間隔に散る点は同じで、定型から外れた並びが得られる
function euclid(k,n){
  const out=new Array(n).fill(false);
  if(k<=0) return out;
  for(let i=0;i<k;i++) out[Math.floor(i*n/k)%n]=true;
  return out;
}

// electro funk 局面のキック。4つ打ちを離れてシンコペーションへ寄る (D-3 の B 要素)
const FUNK_KICK=[
  [0,3,6,10],
  [0,6,10,12],
  [0,4,7,10,14],
  [0,3,8,11],
];
// キックの変形演算子。節目でだけ呼ばれる (D-7)
const KICK_OPS=['skip','push','double','ghost'];

function applyKickOp(k,op){
  switch(op){
    case 'skip':   k[12]=0; break;                       // 4拍目を抜く
    case 'push':   k[12]=0; k[11]=1; break;              // 4拍目を食う
    case 'double': k[10]=Math.max(k[10],.85); break;     // 8分の裏を足す
    case 'ghost':  k[14]=Math.max(k[14],.45); break;     // 小さく差し込む
  }
}

/* ---- ベースの並び (D-7) ----
   音の並びより「フィルタがどう動くか」で性格が決まるトラックなので、
   位置と音価をシーンの陰陽から決め、度数は重み表から引く */
const BASS_GRIDS={
  slow:   [0,8],
  mid:    [0,6,8,14],
  eighth: [0,2,4,6,8,10,12,14],
  funk:   [0,3,6,8,11,14],
  busy:   [0,2,3,6,8,10,11,14],
};
/* 度数の重み。いま鳴っている和音の構成音から引く。
   ルート音を鳴らすのが基本で、5度がそれに次ぐ (D-17)。
   ときどき音階側の音へ逸れるが、それは例外として扱う */
const CHORD_DEG_W=[6,1.4,3,1.2,1,1];
// 明るい響きの品質。ベースの動き方をここで分ける (D-26)
const BRIGHT_QUAL=['maj9','add9','sus2','x13'];
const OFF_CHORD_P=.12;   // 和音から逸れる確率

function bassBar(bar,R,kickPat,scIdx,phr){
  const sc=SCENES[scIdx];
  // 陰陽と密度は少しずつ動き続けるので、そのまま判定に使うと小節ごとに旋律が変わる。
  // 0.1 刻みに丸めて、値がひと目盛り動くまでは同じ旋律を保つ (D-30)
  const yy=Math.round(current.yy*10)/10, d=Math.round(current.density*10)/10;
  const sl=scale();
  const out=new Array(16).fill(null);
  if(phr==='break') return out;   // ブレイクではベースも抜く

  // 和音のルートに合わせる。基準は C (midi 24) から数える。
  // ここを12の倍数にしておかないと、鳴る音名が調とずれる
  let root=24+keyPc+(chordDeg%12);
  while(root<31) root+=12;   // 低すぎると芯が消えるので、音域は 31〜42 に収める
  while(root>42) root-=12;
  const iv=QUALITIES[chordQual]||QUALITIES.m9;

  const grid = sc.group==='funk' ? (R()<.5?BASS_GRIDS.funk:BASS_GRIDS.busy)
             : yy<.32 ? BASS_GRIDS.slow
             : yy<.55 ? BASS_GRIDS.mid
             : (R()<.5?BASS_GRIDS.eighth:BASS_GRIDS.mid);
  const busy=clamp(.35+yy*.45+d*.2);
  const legato = yy<.4 ? .95 : .6;   // 陰は音価が長く、陽は短く刻む

  const hits=[];
  for(const i of grid){ if(i===0 || R()<busy) hits.push(i); }
  if(!hits.length) hits.push(0);

  // ルート以外の音は1小節にひとつだけ選び、それを使い回す。
  // 打点ごとに引き直すと旋律が動きすぎる (D-19)
  const sumW=iv.reduce((a,_,k)=>a+(CHORD_DEG_W[k]||1),0);
  let alt=0;
  {
    let r=R()*sumW;
    for(let k=0;k<iv.length;k++){
      r-=(CHORD_DEG_W[k]||1);
      if(r<=0){ alt=iv[k]%12; break; }   // 9th などは1オクターブ下げて低音域に置く
    }
  }
  // ルートから離れる頻度。陰では動かず、陽と funk で少し動く。
  // さらに、明るい和音では動かさず、暗い和音では動かす (D-26)。
  // 明るい響きはルートを踏み続けたほうが伸びるが、暗い響きは動いたほうが陰影が出る
  const bright=BRIGHT_QUAL.includes(chordQual);
  const moveP=clamp((.10+yy*.18+(sc.group==='funk'?.12:0))*(bright?.45:1.5));
  const lastHit=hits[hits.length-1];

  for(let n=0;n<hits.length;n++){
    const i=hits[n];
    let deg=0;
    if(i!==0 && R()<moveP){
      // 和音から逸れることもあるが、音階の中から選ぶので調からは外れない
      deg = R()<OFF_CHORD_P ? sl[Math.floor(R()*sl.length)] : alt;
    }
    // オクターブ上げは小節の最後の打点だけ。ここも動きの元になるので控える
    const oct = (i===lastHit && i!==0 && yy>.6 && R()<.12) ? 12 : 0;
    const next = n+1<hits.length ? hits[n+1] : 16;
    const steps=Math.max(1,(next-i)*legato);
    // キックと同じ位置はアクセント。フィルタの叩き方が変わる
    const acc = (kickPat[i]||0)>0 ? .85 : .3;
    out[i]={midi:root+deg+oct, steps, vel:.55+acc*.35, accent:acc};
  }
  return out;
}

/* 小節ぶんの並びを作る。
   どのシーンとして作るかを引数で受けるので、DJ ミックス風の遷移 (D-5 方式3) では
   旧シーンと新シーンの2つ分を同じ小節に対して作れる */
function buildBar(bar,scIdx,phr,seed,fillBar){
  const sc=SCENES[scIdx], d=current.density;
  const funk = sc.group==='funk';
  const quiet = phr==='break', dub = phr==='dubout';
  const out={};

  // 2小節でひと組。偶数小節と奇数小節で別の顔を持たせる
  const R=rng(seed+(bar%2)*7919);

  if(R()<.5) hatRot=Math.floor(R()*16);
  percPer=[[3,5,7][Math.floor(R()*3)],[5,7,11][Math.floor(R()*3)]];
  percOff=[Math.floor(R()*16),Math.floor(R()*16)];

  // --- キック: 4つ打ちを基本堅持。節目でだけ崩す
  const k=new Array(16).fill(0);
  if(funk && !quiet){
    for(const i of FUNK_KICK[Math.floor(R()*FUNK_KICK.length)]) k[i]=1;
  }else{
    for(const i of [0,4,8,12]) k[i]=1;
  }
  if(dub){ k[4]=0; k[12]=0; }               // dub 局面は2拍ぶんだけ残す
  // 8小節の終わりでのみ変形する。それ以外の小節は素のまま
  const edge = (bar%8===7);
  kickVariant = edge ? KICK_OPS[Math.floor(Math.random()*KICK_OPS.length)] : null;
  if(kickVariant) applyKickOp(k,kickVariant);
  if(quiet) k.fill(0);
  k[0]=quiet?0:Math.max(k[0],1);            // 小節頭は変異させない (ブレイク中を除く)
  out.kick=k;

  // --- スネア / クラップ: 2・4拍が基本。funk ではゴーストを足す
  const sn=new Array(16).fill(0), cl=new Array(16).fill(0);
  if(!quiet && !dub){
    if(sc.kit==='electro' || funk){ cl[4]=1; cl[12]=1; }
    else { sn[4]=1; sn[12]=1; }
    if(funk){
      if(R()<.6) sn[7]=.35;
      if(R()<.4) sn[14]=.3;
    }
    if(edge && Math.random()<.5) sn[15]=.5;   // 小節をまたぐ手前の合図
  }
  out.snare=sn; out.clap=cl;

  // --- ハット: ユークリッドを主軸に、密度で間引き、拍で強弱を付ける
  const e=euclid(sc.hatK,16);
  const hat=new Array(16).fill(0), oh=new Array(16).fill(0);
  for(let i=0;i<16;i++){
    if(!e[(i+hatRot)%16]) continue;
    if(R()>0.45+d*.55) continue;               // 密度が低いと抜ける
    hat[i]=(i%4===0?.9:i%2===0?.7:.55)*(.85+R()*.27);
  }
  if(!quiet && R()<.55){
    // オープンハットは裏拍にひとつだけ。定型を避けるため位置は種ごとに引き直す
    const cand=[2,6,10,14].filter(i=>hat[i]>0 || R()<.4);
    if(cand.length){ const i=cand[Math.floor(R()*cand.length)]; oh[i]=.8; hat[i]=0; }
  }
  out.hat=hat; out.ohat=oh;

  // --- パーカッション: 互いに素な周期を回してポリリズムを作る (D-7)。
  // 小節をまたいで模様が変わっていくよう、位置は通し番号で決める
  const p1=new Array(16).fill(0), p2=new Array(16).fill(0);
  for(let i=0;i<16;i++){
    const g=bar*16+i;
    if(g%percPer[0]===percOff[0]%percPer[0] && R()<.35+d*.5) p1[i]=.5+R()*.4;
    if(g%percPer[1]===percOff[1]%percPer[1] && R()<.25+d*.45) p2[i]=.4+R()*.4;
  }
  out.perc1=p1; out.perc2=p2;

  // --- リム: 陰のキットだけ、まばらに
  const rm=new Array(16).fill(0);
  if(sc.kit==='deep' || dub){
    for(let i=0;i<16;i++) if(R()<.06+d*.10) rm[i]=.4+R()*.4;
  }
  out.rim=rm;

  /* --- ベース ---
     小節ごとに引き直さない。種が変わるまでは同じ旋律が続くので、
     少なくとも2小節、実際にはフレーズのあいだ同じ形が繰り返される (D-30)。
     オカズの小節だけは例外で、そこは動いてよい */
  const Rb=rng(seed+4242+(fillBar?bar*97:0));
  out.bass=bassBar(bar,Rb,k,scIdx,phr);

  // --- ハーモニー。鳴らす回路はシーンが決める (D-8)
  const cir=sc.group;
  const stab=new Array(16).fill(0), ep=new Array(16).fill(0),
        arp=new Array(16).fill(0), riff=new Array(16).fill(0);
  if(cir==='stab' && !quiet){
    // 裏拍に短く刺す。位置は種ごとに引き直す
    for(const i of [2,6,10,14]) if(R()<.62) stab[i]=.7+R()*.3;
    if(R()<.3) stab[7]=.5;
  }
  if((cir==='jazz'||epGuest) && !quiet){
    const pr = cir==='jazz' ? .45 : .22;
    for(const i of [0,3,6,10,11,14]) if(R()<pr) ep[i]=.6+R()*.4;
  }
  // 持続回路の上2層。実際に出るかは padLayers() が決める
  for(let i=0;i<16;i++){
    if(i%2===0 && R()<.85) arp[i]=.5+R()*.3;
    if((i===0||i===3||i===6||i===11) && R()<.55) riff[i]=.5+R()*.4;
  }
  /* 連打の並び (D-34)。8分を基本に、たまに16分の返しを足す。
     持続音の代わりなので、層の数が増えるほど詰まる */
  const chop=new Array(16).fill(0);
  if(padChop && !quiet && (cir==='sustain'||cir==='funk')){
    const dens=clamp(.45+d*.35+(phr==='build'?.2:0));
    for(let i=0;i<16;i+=2){
      if(R()>dens) continue;
      chop[i]=(i%4===0?.95:.7)*(.85+R()*.3);
      if(R()<.28) chop[i+1]=.5;   // 16分の返し
    }
  }
  out.chop=chop;

  out.stab=stab; out.ep=ep; out.arp=arp; out.riff=riff;

  /* --- 16分のシーケンス (D-21) ---
     ベースと同じく動きすぎないよう、1小節で使う音は2〜3個に絞り、
     和音の構成音から引く */
  const lead=new Array(16).fill(null);
  if(!quiet){
    const iv2=QUALITIES[chordQual]||QUALITIES.m9;
    let lroot=48+keyPc+(chordDeg%12);
    while(lroot<60) lroot+=12;
    while(lroot>71) lroot-=12;
    const palette=[0];
    palette.push(iv2[Math.min(2,iv2.length-1)]%12);              // 5度あたり
    if(R()<.6) palette.push(iv2[Math.min(1,iv2.length-1)]%12);   // 3度あたり
    const gate=clamp(.30+d*.45+(phr==='build'?.15:0));
    let last=0;
    for(let i=0;i<16;i++){
      if(R()>gate) continue;
      // 同じ音を続けるほうが多くなるようにする
      if(R()<.35) last=palette[Math.floor(R()*palette.length)];
      const oc = R()<.12 ? 12 : 0;
      lead[i]={midi:lroot+last+oc, vel:(i%4===0?.95:i%2===0?.8:.62)*(.85+R()*.3)};
    }
  }
  out.lead=lead;
  return out;
}

/* ---- オカズ (D-20) ----
   並びが切り替わる直前の小節に置く。8小節ごとの折り返しと、
   遷移の直前がその対象になる。たまに次の小節へはみ出す */
function isFillBar(bar){
  if(phrase==='break') return false;
  if(pendingScene>=0 && bar===transitionEndBar-1) return true;
  return (bar-phraseStartBar+1)%8===0;
}

function makeFill(bar){
  const R=rng(patSeed+bar*131);
  const len=[4,6,8][Math.floor(R()*3)];      // 小節の終わりから何ステップぶん使うか
  const start=16-len;
  const kind=R()<.55?'tom':'snare';
  const fill=seq.fill;
  for(let n=0;n<len;n++){
    const i=start+n;
    if(kind==='tom' && R()<.2) continue;      // タムは少し隙間を空ける
    const u=n/(len-1||1);
    const vel=.45+u*.5;                        // 終わりに向かって強くする
    fill[i] = kind==='tom'
      ? {v:'tom', vel, tone:.55-u*.9}          // 音程を下げながら並べる
      : {v:'sd',  vel};
    if(kind==='snare'){ seq.hat[i]=0; seq.ohat[i]=0; }   // 場所を譲る
  }
  // はみ出し。次の小節の頭にひと打ちかふた打ち残す
  pendingSpill = R()<.35
    ? Array.from({length:1+Math.floor(R()*2)},(_,n)=>({
        i:n, v:kind==='tom'?'tom':'sd', vel:.9-n*.2, tone:-.45-n*.2 }))
    : null;
  // 折り返しの頭にはシンバルを置く
  if(R()<.6) pendingSpill=(pendingSpill||[]).concat([{i:0,v:'cy',vel:.7}]);
}

// いま鳴っているシーンぶんを引き直す。onBar() の頭で呼ぶ
function regenerate(bar){
  // 変異 (D-7)。当たったときだけ種を引き直し、それまでは同じ並びを繰り返す
  if(Math.random()<current.mutate*.5) reseedPattern();
  const fillBar=isFillBar(bar);
  Object.assign(seq, buildBar(bar,sceneIdx,phrase,patSeed,fillBar));
  // 疎な小節はフェーザーで補う (D-39)。その判断に使う
  bassNotes = seq.bass.filter(Boolean).length;
  // 音程がほとんど動かない小節は、1音ごとにフィルタを揺らして単調さを補う (D-42)
  bassWobble = new Set(seq.bass.filter(Boolean).map(b=>b.midi)).size<=2;
  seq.fill=new Array(16).fill(null);
  // 音色はときどき差し替える。基本は鋸波で、たまに別の波形になる
  if(Math.random()<.25) leadType = Math.random()<.5 ? 'sawtooth' : pick(LEAD_TYPES);
  // 前の小節からはみ出したぶんを先に置く
  if(pendingSpill){
    for(const sp of pendingSpill) seq.fill[sp.i]={v:sp.v, vel:sp.vel, tone:sp.tone};
    pendingSpill=null;
  }
  if(fillBar) makeFill(bar);
}

/* ============================================================
   第3層イベントの実行
   maybeEvent() が選んだ仕掛けを、実際に音へ効かせる。
   小節をまたぐものは「いつまで効いているか」を音声時計で持つ。
   ============================================================ */
let evFilterUntil=0, evMasterUntil=0, evDelayUntil=0, evLeadUntil=0;
let muteHatUntilBar=-1, muteKickUntilBar=-1, glitchBar=-1;

function fireEvent(id,bar,time){
  const barSec=stepDur()*16;
  switch(id){
    case 'sweep':{
      // ドラムだけを閉じてから開き直す。2小節かけて戻る
      const f=drumFilter.frequency;
      f.cancelScheduledValues(time);
      f.setValueAtTime(Math.max(400,phraseCutoff()*.06),time);
      f.exponentialRampToValueAtTime(Math.max(800,phraseCutoff()),time+barSec*2);
      drumFilter.Q.setValueAtTime(3.5,time);
      drumFilter.Q.linearRampToValueAtTime(1.0,time+barSec*2);
      evFilterUntil=time+barSec*2;
      break;
    }
    case 'masterfilter':{
      const f=mixFilter.frequency;
      f.cancelScheduledValues(time);
      f.setValueAtTime(700,time);
      f.exponentialRampToValueAtTime(20000,time+barSec*2);
      evMasterUntil=time+barSec*2;
      break;
    }
    case 'hatdrop':  muteHatUntilBar=bar+1; break;
    case 'kickdrop': muteKickUntilBar=bar+1; break;
    case 'glitch':   glitchBar=bar; break;
    case 'feedback':{
      // ディレイのフィードバックを跳ね上げ、2小節かけて戻す
      for(const tap of [delayNodes.tapL,delayNodes.tapR]){
        tap.fb.gain.cancelScheduledValues(time);
        tap.fb.gain.setValueAtTime(.86,time);
        tap.fb.gain.linearRampToValueAtTime(.4,time+barSec*2);
      }
      evDelayUntil=time+barSec*2;
      break;
    }
    case 'phaser':{
      // 4小節かけて深さを出し、そのまま引く (D-28)
      const w=phaserWet.gain, dep=phaserLfo.depth.gain;
      w.cancelScheduledValues(time);
      w.setValueAtTime(0,time);
      w.linearRampToValueAtTime(.55,time+barSec);
      w.setValueAtTime(.55,time+barSec*3);
      w.linearRampToValueAtTime(0,time+barSec*4);
      dep.cancelScheduledValues(time);
      dep.setValueAtTime(900,time);
      phaserLfo.osc.frequency.setValueAtTime(rand(.12,.7),time);
      break;
    }
    case 'leadsweep':{
      // シーケンスのフィルタを上げ下げする。たまにレゾナンスを上げて発振させる (D-29)
      const f=leadFilt.frequency, q=leadFilt.Q;
      const ring=Math.random()<.35;
      f.cancelScheduledValues(time); q.cancelScheduledValues(time);
      f.setValueAtTime(Math.max(240,leadCutoffBase()*.14),time);
      f.exponentialRampToValueAtTime(leadCutoffBase(),time+barSec*2);
      f.exponentialRampToValueAtTime(Math.max(240,leadCutoffBase()*.2),time+barSec*4);
      q.setValueAtTime(ring?18:6,time);
      q.linearRampToValueAtTime(1,time+barSec*4);
      evLeadUntil=time+barSec*4;
      break;
    }
    case 'reverse':{
      // 逆再生風の立ち上がり。次の小節の頭へ向けて膨らむ
      const n=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
      n.buffer=noiseBuf; n.loop=true;
      bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=.9;
      bp.frequency.linearRampToValueAtTime(5200,time+barSec);
      g.gain.setValueAtTime(.0001,time);
      g.gain.exponentialRampToValueAtTime(.22,time+barSec*.98);
      g.gain.exponentialRampToValueAtTime(.0001,time+barSec*1.02);
      n.connect(bp).connect(g).connect(drumBus);
      n.start(time); n.stop(time+barSec*1.1);
      disposeAt(n,time+barSec*1.2); disposeAt(bp,time+barSec*1.2); disposeAt(g,time+barSec*1.2);
      break;
    }
  }
}

/* ============================================================
   クロック
   小節と16分ステップを ctx.currentTime 基準で進める。
   setTimeout はバックグラウンドで絞られるが、音声時計は絞られない。
   ============================================================ */
let stepIdx=0, barCount=0, nextStepTime=0, uiStep=-1, arpPos=0;
const uiSteps=[];   // 表示の予定。遅れて届いた分は最新だけ描く

// シーンの bpm を、BPM スライダーの中心値のぶんだけ平行移動する (D-11)。
// 遷移中は次のシーンの値を目標にして、ブレイクの間に寄せていく (D-6)
function bpmTarget(){
  const sc = pendingScene>=0 ? SCENES[pendingScene] : SCENES[sceneIdx];
  return clamp(sc.bpm + (bpmCenter-125), 100, 150);
}
let bpmCur=125;
function bpmNow(){ return bpmCur; }
function stepDur(){ return 60/bpmNow()/4; }   // 16分音符

// 入ってくるシーンのドラムだけを2本目の経路へ流す。
// ベースと和音まで重ねると音がぶつかるので、DJ が次の曲のビートを差し込むのと同じ範囲に留める
function playStepB(i,time){
  curDrumBus=drumBusB;
  kitOverride=pendingScene;
  if(seqB.kick[i])  bd(time,seqB.kick[i]);
  if(seqB.snare[i]) sd(time,seqB.snare[i]);
  if(seqB.clap[i])  cp(time,seqB.clap[i]);
  if(seqB.hat[i])   hh(time+rand(-.002,.003),seqB.hat[i],false);
  if(seqB.ohat[i])  hh(time,seqB.ohat[i],true);
  if(seqB.perc1[i]) perc(time,seqB.perc1[i],-.45,.2);
  if(seqB.perc2[i]) perc(time,seqB.perc2[i], .50,1.1);
  curDrumBus=drumBus;
  kitOverride=null;
}

// 1ステップぶんの予約。並びに従ってドラムを鳴らす
function playStep(i,time){
  showStepAt(i,time);
  if(!ready) return;
  const sw=stepDur(), k=kit();
  if(seqB) playStepB(i,time);
  const hatOff  = barCount<=muteHatUntilBar;
  const kickOff = barCount<=muteKickUntilBar;

  if(seq.kick[i]  && !kickOff) bd(time,seq.kick[i]);
  if(seq.snare[i]) sd(time,seq.snare[i]);
  if(seq.clap[i])  cp(time,seq.clap[i]);
  if(!hatOff){
    // ハットだけは打点をわずかにずらす。機械的に揃いすぎるのを避ける (D-7)
    if(seq.hat[i])  hh(time+rand(-.002,.003),seq.hat[i],false);
    if(seq.ohat[i]) hh(time,seq.ohat[i],true);
  }
  const b=seq.bass[i];
  if(b) bassNote(time,b.midi,b.steps*sw,b.vel,b.accent);
  if(seq.perc1[i]) perc(time,seq.perc1[i],-.45,.2);
  if(seq.perc2[i]) perc(time,seq.perc2[i], .50,1.1);
  if(seq.rim[i])   rim(time,seq.rim[i],rand(-.6,.6));
  if(k.cowbell && i===6 && Math.random()<.22) cb(time,.7);
  if(i===0 && phrase==='drop') cy(time,.8);   // 戻しの頭にシンバル

  // --- 16分のシーケンス (D-21)
  const ld=seq.lead[i];
  if(ld) leadNote(time,ld.midi,ld.vel,Math.min(sw*1.6,.16),leadType);

  // --- オカズ (D-20)
  const fl=seq.fill[i];
  if(fl){
    if(fl.v==='tom') tom(time,fl.vel,fl.tone??0);
    else if(fl.v==='sd') sd(time,fl.vel);
    else if(fl.v==='cy') cy(time,fl.vel);
  }

  // --- ハーモニー
  if(seq.stab[i]) stabHit(time,seq.stab[i]);
  if(seq.ep[i])   epChord(time,seq.ep[i]);
  // インダストリアル・ノイズ。小節ではなく通し番号で回すのでポリリズムになる (D-38)
  if(noiseOn && phrase!=='break'){
    const g0=barCount*16+i;
    for(const gen of noiseGens){
      const e=gen.pat[((g0%gen.len)+gen.len)%gen.len];
      if(e) industrialHit(time,e.vel,gen.pan);
    }
  }

  if(seq.chop[i]) chordChop(time,seq.chop[i]);
  const L=padLayers();
  if(L>=3 && seq.arp[i]){
    // アルペジオは和音の構成音を順に上る
    const tones=chordNotes(60);
    padPluck(time,tones[arpPos++%tones.length],2,'sawtooth',.22,seq.arp[i]);
  }
  if(L>=4 && seq.riff[i]){
    const tones=chordNotes(72);
    padPluck(time,tones[(i*3)%tones.length],3,'square',.16,seq.riff[i]*.8);
  }

  // グリッチ: その小節の終盤だけ32分で刻み直す (D-3 の C 要素)
  if(barCount===glitchBar && i>=12){
    perc(time+sw*.5,.55,rand(-.6,.6),rand(.5,1.6));
    if(i===15) hh(time+sw*.75,.5,false);
  }
}

function showStepAt(idx,at){ uiSteps.push({idx,at}); }
function flushSteps(){ uiSteps.length=0; }
function runStepUI(now){
  let bestAt=-1,bestIdx=-1;
  for(let i=uiSteps.length-1;i>=0;i--){
    if(uiSteps[i].at>now) continue;
    if(uiSteps[i].at>bestAt){ bestAt=uiSteps[i].at; bestIdx=uiSteps[i].idx; }
    uiSteps.splice(i,1);
  }
  if(bestIdx>=0 && bestIdx!==uiStep){ uiStep=bestIdx; renderSteps(); }
}

// 遷移を始める。ブレイクを置き、その中でキット・和音・編成・BPM を乗り換える (D-5 方式1)。
// 自動の切り替えと「次へ」の両方がここを通る
function startTransition(bar,bars,time,{force=null}={}){
  newWavePeriod();
  pendingScene=chooseScene();
  transitionMode=forcedMode || force || chooseTransitionMode();
  epGuest=false;

  if(transitionMode==='break'){
    // 乗り換えの直前1小節だけをブレイクにする。それまでは今の並びのまま進む (D-24)
    transitionEndBar=bar+bars;
    reseedPattern();
  }else{
    // 連続変形とミックスはどちらも16小節かける。ブレイクは挟まない
    transitionEndBar=bar+PHRASE_BARS;
    if(transitionMode==='mix'){
      patSeedB=(Math.random()*1e9)|0;
      seqB=null;
      scheduleMixFades(bar,time);
    }
  }
  showProgress();
}

// 方式の選び方 (D-5)。連続変形は、離散的な入れ替わりが起きない相手にだけ使う。
// 回路もキットも同じなら、値を滑らかに移すだけで乗り換えが成立する
function chooseTransitionMode(){
  const sc=SCENES[sceneIdx], nx=SCENES[pendingScene];
  const canMorph = nx.group===sc.group && nx.kit===sc.kit;
  const r=Math.random();
  if(canMorph && r<.35) return 'morph';
  return r<.7 ? 'mix' : 'break';
}

// ミックスの音量とフィルタを予約する。
// 入ってくる側はハイパスを下げながら量を上げ、出ていく側は後半で引く
function scheduleMixFades(bar,time){
  if(!drumMixB) return;
  const barSec=stepDur()*16, span=barSec*PHRASE_BARS;
  drumMixB.gain.cancelScheduledValues(time);
  drumMixB.gain.setValueAtTime(.0001,time);
  drumMixB.gain.linearRampToValueAtTime(1,time+span*.85);
  drumFilterB.frequency.cancelScheduledValues(time);
  drumFilterB.frequency.setValueAtTime(1400,time);
  drumFilterB.frequency.exponentialRampToValueAtTime(28,time+span*.8);
  drumMix.gain.cancelScheduledValues(time);
  drumMix.gain.setValueAtTime(1,time);
  drumMix.gain.setValueAtTime(1,time+span*.4);
  drumMix.gain.linearRampToValueAtTime(.0001,time+span);
}
// 乗り換えが済んだら経路を元に戻す
function endMixFades(time){
  if(!drumMixB) return;
  for(const [g,v] of [[drumMix.gain,1],[drumMixB.gain,.0001]]){
    g.cancelScheduledValues(time); g.setValueAtTime(v,time);
  }
  drumFilterB.frequency.cancelScheduledValues(time);
  drumFilterB.frequency.setValueAtTime(1400,time);
  seqB=null;
}

// 小節の頭で3階層を進める。ここが進行の中心。
// フレーズとシーンを先に決めてから並びを引き直す (両者が並びの前提になるため)
function onBar(bar,time){
  // ---- シーン遷移 (D-5 方式1: ブレイクを挟む) ----
  // 終わりの8小節をブレイクに充て、その間にキット・和音・編成・BPM を乗り換える
  if(pendingScene<0 && bar-sceneStartBar>=sceneBars-TRANSITION_BARS && (bar-phraseStartBar)%8===0){
    startTransition(bar,TRANSITION_BARS,time);
  }
  // ブレイク方式の遷移では、終わりの1小節だけ音を抜く
  if(pendingScene>=0 && transitionMode==='break' && bar===transitionEndBar-1 && phrase!=='break'){
    phrase='break'; phraseStartBar=bar; phraseLen=BREAK_BARS;
    reseedPattern();
  }
  if(pendingScene>=0 && bar>=transitionEndBar){
    const nxt=pendingScene, mode=transitionMode;
    pendingScene=-1;
    if(mode==='mix') endMixFades(time);
    // 連続変形では調も持ち越す。ここで転調すると継ぎ目が出てしまう
    enterScene(nxt,{keepKey:mode==='morph'});
    if(mode!=='morph') nextPhrase();
  }
  // フレーズは16小節がひと区切り。「展開」を上げると、8小節の折り返しでも
  // 切り替わることがあり、移り変わりが早くなる (D-11)
  const inPhrase=bar-phraseStartBar;
  const early = phraseLen>BREAK_BARS && inPhrase>=8 && inPhrase%8===0
                && Math.random()<current.evolution*.4;
  if((inPhrase>=phraseLen || early) && pendingScene<0) nextPhrase();
  // 和音を進める。間隔は回路ごとに違い、スタブはほとんど動かない (D-9)
  if(bar-chordAt>=CHORD_BARS[circuit()]){
    // シーンに入った直後は進行の1つ目から始める。そこで進めると頭を飛ばしてしまう
    if(chordAt>-900) progPos++;
    setChord(); chordAt=bar;
    padRebuild(time);
  }
  regenerate(bar);
  // DJ ミックス風の遷移では、同じ小節に対して新シーンぶんの並びも作る (D-5 方式3)
  seqB = (pendingScene>=0 && transitionMode==='mix')
    ? buildBar(bar,pendingScene,'plateau',patSeedB,false) : null;
  if(bar>0 && bar%4===0) maybeEvent(bar,time);   // 開始直後の1小節目にいきなり仕掛けを出さない
  if(bar%4===0) ytSwap();                       // 背景の動画も4小節ごとに差し替える (D-32)
  showProgress();
}

function seqTick(){
  const now=ctx.currentTime;
  const ahead=.12;   // 先読み。これより先の予約はしない
  while(nextStepTime < now+ahead){
    if(stepIdx===0) onBar(barCount,nextStepTime);
    playStep(stepIdx,nextStepTime);
    nextStepTime += stepDur();
    stepIdx++;
    if(stepIdx>=16){ stepIdx=0; barCount++; }
  }
}

/* ============================================================
   平滑化ループ
   ============================================================ */
let last=performance.now(), smoothAt=0;
function smooth(){
  const now=performance.now();
  const dt=Math.min(.5,(now-last)/1000); last=now;   // 復帰直後の巨大なdtで値が飛ばないように抑える
  smoothAt=now;
  const tau=Math.max(1,glide)/3;
  const k=1-Math.exp(-dt/tau);
  for(const key in P) current[key]+=(target[key]-current[key])*k;
  // BPM は推移時間とは別に、常に一定の速さで寄せる。急に変わると拍が飛ぶ
  bpmCur += (bpmTarget()-bpmCur)*(1-Math.exp(-dt/6));

  // 波を進め、手で触られていない限り陰陽の目標を波に従わせる (D-13)
  if(running && !dragging){
    wavePos=(wavePos+dt/wavePeriod)%1;
    // 連続変形の最中は、行き先のシーンの陰陽へまっすぐ寄せる (D-5 方式2)
    const goal = (pendingScene>=0 && transitionMode==='morph')
      ? SCENES[pendingScene].yy : waveYY(wavePos);
    if(!sceneEdited) target.yy=lerp(target.yy, goal, Math.min(1,dt*.5));
  }
  apply();
  readout();
}
// 音声時計が止まっている間 (発音前、AudioContextの中断中) の受け皿
setInterval(()=>{ if(performance.now()-smoothAt>=250) smooth(); }, 100);

/* ============================================================
   UI
