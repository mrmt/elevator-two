<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: 指定しないと iOS はページ全体をセーフエリア内に押し込むため、
     landscape で上下左右に余白が出る。余白の回避は body の padding で行う -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELEVATOR TWO</title>
<style>
  :root{
    /* one の海の色に対し、two はより暗く青い夜の側へ寄せる */
    --sea-top:#1A2430;
    --sea-mid:#131C27;
    --sea-bot:#0B121B;
    --panel:rgba(255,255,255,.055);
    --panel-hi:rgba(255,255,255,.11);
    --line:rgba(226,236,242,.19);
    --ink:#E7E2CE;
    --dim:rgba(214,226,232,.62);
    --amber:#D8A340;
    --scope:rgba(216,163,64,.7);
    --disp:'Futura','Avenir Next Condensed','Helvetica Neue',sans-serif;
    --data:'Menlo','Monaco',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--sea-mid);
    background-image:linear-gradient(180deg,var(--sea-top) 0%,var(--sea-mid) var(--sea-split,52%),var(--sea-bot) 100%);
    color:var(--ink);
    font-family:var(--disp);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---- header ---- */
  header{
    display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
    padding:.8rem 1.2rem .7rem;
    background:rgba(0,0,0,.21);
    border-bottom:1px solid var(--line);
  }
  .mark{font-size:.95rem;letter-spacing:.42em;text-transform:uppercase}
  .sub{font-size:.68rem;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
  .ver{opacity:.6}
  /* 現在のシーン名。one の mood 表示と同じ役割 */
  .scene{color:var(--amber);opacity:.85}
  .transport{margin-left:auto;display:flex;gap:.55rem;align-items:center;flex-shrink:0}
  .tbtn{
    border:1px solid var(--line);
    padding:.5rem 1.1rem;
    font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;
    white-space:nowrap;
    background:var(--panel);
    transition:background .18s,border-color .18s,color .18s;
  }
  .tbtn:hover{background:var(--panel-hi)}
  .tbtn[data-on="1"]{background:var(--amber);color:#101A22;border-color:var(--amber)}
  .sub.lang{padding:0;opacity:.6;transition:color .18s,opacity .18s}
  .sub.lang:hover{color:var(--amber);opacity:1}
  /* 再生 / 一時停止。ロック画面と同じ並びで、現在の状態の側が点灯する */
  .tbtn.xport{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;padding:0}
  .tbtn.xport .ico{width:.7rem;height:.7rem;fill:currentColor;flex-shrink:0}

  /* ---- タブ (狭幅時のみ表示) ---- */
  .tabs{display:none}
  .tab{
    flex:1;padding:.62rem .4rem;
    font-size:.72rem;letter-spacing:.2em;
    color:var(--dim);border-bottom:2px solid transparent;
    transition:color .16s,border-color .16s,background .16s;
  }
  .tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber);background:rgba(0,0,0,.16)}

  /* ---- main grid ---- */
  main{
    flex:1;min-height:0;display:grid;
    grid-template-columns:minmax(128px,166px) minmax(0,1fr) minmax(184px,222px);
    gap:1px;background:var(--line);
    border-bottom:1px solid var(--line);
  }
  section{
    background:rgba(0,0,0,.21);padding:.9rem 1rem 1rem;
    min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  section::-webkit-scrollbar{width:7px}
  section::-webkit-scrollbar-thumb{background:var(--line)}
  section::-webkit-scrollbar-track{background:transparent}
  .eyebrow{
    font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--dim);margin-bottom:.85rem;
  }

  /* ---- シーン一覧 ---- */
  .scenebtn{
    display:block;width:100%;text-align:left;cursor:pointer;
    padding:.32rem .6rem;margin-bottom:.1rem;
    font-size:.9rem;letter-spacing:.14em;
    border-left:2px solid transparent;color:var(--dim);
    transition:color .16s,background .16s,border-color .16s;
  }
  .scenebtn:hover{color:var(--ink);background:var(--panel)}
  .scenebtn[aria-pressed="true"]{color:var(--amber);border-left-color:var(--amber);background:var(--panel)}
  .scenebtn small{display:block;font-size:.56rem;letter-spacing:.12em;color:var(--dim);margin-top:.12rem}
  html[lang="en"] .scenebtn small{display:none}
  /* 群の見出し。シーンは主回路ごとに固まって並ぶ */
  .group{
    font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;
    color:rgba(214,226,232,.4);margin:.7rem 0 .3rem;
  }
  .group:first-child{margin-top:0}

  /* ---- plane ---- */
  .plane-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
  .plane{
    position:relative;flex:1;min-height:96px;
    border:1px solid var(--line);background:rgba(0,0,0,.30);
    touch-action:none;cursor:crosshair;
    container-type:size;container-name:pad;
  }
  .plane canvas{display:block;width:100%;height:100%;position:relative;z-index:1}

  /* ---- 背景の動画 (D-32) ----
     2枚を重ねておき、差し替えるときに不透明度でクロスフェードする */
  #bg{position:absolute;inset:0;overflow:hidden;background:#0B121B}
  #bg .vid{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  #bg .vid.on{opacity:1}
  #bg iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:0;pointer-events:none}
  /* CC BY は表示義務があるので、題名と制作者を必ず出す */
  .vcap{
    position:absolute;left:.5rem;bottom:.45rem;z-index:3;max-width:min(60%,26rem);
    font-family:var(--data);font-size:.56rem;line-height:1.5;letter-spacing:.02em;
    color:rgba(231,226,206,.62);text-shadow:0 1px 6px rgba(0,0,0,.8);
    pointer-events:none;
  }
  .vcap:empty{display:none}
  .axis{
    display:flex;justify-content:space-between;
    font-size:.58rem;letter-spacing:.22em;color:var(--dim);
    text-transform:uppercase;margin-top:.5rem;
  }
  .plane-outer{position:relative;flex:1;min-height:0;display:flex;gap:.5rem}
  .axis-v{
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;
    width:1.05rem;flex:none;
    font-size:.58rem;letter-spacing:.22em;color:var(--dim);
  }
  .axis-v span{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.1em}
  html[lang="en"] .axis-v span{text-orientation:mixed;letter-spacing:.22em}
  .axis-v .mid{color:var(--ink)}

  /* ---- pad overlay readout ---- */
  .overlay{
    /* canvas に z-index を与えてあるので、こちらにも積み順を明示しないと潜る */
    position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    gap:clamp(0rem,.7vh,.5rem);padding:.4rem;text-align:center;
    font-family:'Helvetica Neue','Avenir Next','Hiragino Sans',system-ui,sans-serif;
    text-shadow:0 1px 16px rgba(0,0,0,.34);
  }
  .overlay .k{
    display:block;font-size:clamp(.6rem,1.5vh,.82rem);letter-spacing:.34em;
    color:rgba(233,242,246,.34);margin-bottom:.02em;
  }
  .overlay b{
    display:block;font-weight:500;
    font-size:clamp(1.65rem,7.05vh,4.2rem);line-height:1.0;
    letter-spacing:.005em;font-variant-numeric:tabular-nums;
    color:rgba(233,242,246,.26);
  }
  @container pad (min-aspect-ratio: 2/1){
    .overlay{flex-flow:row wrap;align-content:center;column-gap:6%}
    .overlay>div{width:40%}
    .overlay b{font-size:clamp(1.65rem,11vh,4.2rem)}
    .overlay .k{font-size:clamp(.6rem,2.2vh,.82rem)}
  }

  /* ---- 大きな再生ボタン (Issue #1) ----
     右上の小さなボタンだけでは、まず押さないと鳴らないことに気づけない。
     YouTube と同じく、面の中央に大きく置く */
  #bigplay{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:4;display:flex;align-items:center;justify-content:center;
    width:clamp(64px,14vmin,104px);height:clamp(64px,14vmin,104px);
    border-radius:50%;
    background:rgba(0,0,0,.42);
    border:2px solid var(--amber);
    color:var(--amber);
    box-shadow:0 0 0 0 rgba(216,163,64,.45);
    transition:background .18s,color .18s,transform .18s,box-shadow .6s;
    animation:bigpulse 2.6s ease-out infinite;
  }
  #bigplay[hidden]{display:none}
  #bigplay svg{width:44%;height:44%;fill:currentColor;margin-left:8%}
  #bigplay:hover{background:var(--amber);color:#101A22;transform:translate(-50%,-50%) scale(1.06)}
  /* 気づいてもらうための呼吸。控えめに一度ずつ広がる */
  @keyframes bigpulse{
    0%{box-shadow:0 0 0 0 rgba(216,163,64,.45)}
    70%{box-shadow:0 0 0 18px rgba(216,163,64,0)}
    100%{box-shadow:0 0 0 0 rgba(216,163,64,0)}
  }
  @media (prefers-reduced-motion:reduce){
    #bigplay{animation:none}
  }

  /* ---- tooltip ---- */
  #tip{
    position:fixed;z-index:60;max-width:15rem;pointer-events:none;
    background:#16222C;border:1px solid var(--line);
    color:var(--ink);font-size:.68rem;line-height:1.6;letter-spacing:.05em;
    padding:.45rem .65rem;opacity:0;transition:opacity .12s;
  }
  #tip.on{opacity:1}
  #tip.fade{transition:opacity .9s}

  /* ---- params ---- */
  .param{margin-bottom:.62rem}
  .param label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:.72rem;letter-spacing:.16em;margin-bottom:.18rem;
  }
  .param .val{font-family:var(--data);font-size:.65rem;color:var(--amber);letter-spacing:.04em}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:9px;height:14px;margin-top:-7px;
    background:var(--ink);border:none;border-radius:0;
  }
  input[type=range]:hover::-webkit-slider-thumb{background:var(--amber)}
  input[type=range]::-moz-range-track{height:1px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:9px;height:14px;background:var(--ink);border:none;border-radius:0}

  .toggle{
    display:flex;align-items:center;gap:.5rem;
    font-size:.72rem;letter-spacing:.16em;
    border:1px solid var(--line);padding:.45rem .6rem;width:100%;
    justify-content:space-between;background:var(--panel);
  }
  .lamp{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s,box-shadow .2s}
  .toggle[aria-pressed="true"] .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber)}

  /* ---- ステップ列 ----
     16ステップ = 1小節。4拍目ごとに区切りを入れ、いま鳴っている位置を琥珀で示す */
  .steps{
    display:grid;grid-template-columns:repeat(16,1fr);gap:2px;
    height:30px;align-items:end;margin-top:.65rem;
    border-bottom:1px solid var(--line);padding-bottom:2px;
  }
  .steps i{display:block;background:var(--line);height:22%;transition:background .1s,box-shadow .1s}
  .steps i.beat{height:44%}
  /* 何が鳴る位置かを高さと色で示す。on = キックやスネア、hat = ハット */
  .steps i.hat{background:#4D5A63;height:34%}
  .steps i.on{background:#707C5D;height:66%}
  .steps i.now{background:var(--amber);box-shadow:0 0 7px rgba(216,163,64,.65)}
  .seqhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.4rem}

  /* ---- 進行の表示 ----
     フレーズ型とイベントは音がまだ無いので、当面ここだけが確認手段になる */
  .prog{
    font-family:var(--data);font-size:.62rem;letter-spacing:.02em;
    color:var(--dim);margin-top:.55rem;display:grid;gap:.18rem;
  }
  .prog b{color:var(--ink);font-weight:400}
  .prog .ev{color:var(--amber)}

  /* ---- readout ---- */
  footer{
    padding:.5rem 1.2rem;font-family:var(--data);
    background:rgba(0,0,0,.21);
    font-size:.62rem;letter-spacing:.02em;color:var(--dim);
    display:flex;gap:1.4rem;flex-wrap:wrap;align-items:center;flex:none;
  }
  footer b{color:var(--ink);font-weight:400}
  .note{margin-left:auto;color:var(--dim)}

  @media (max-width:900px){
    body{overscroll-behavior:none}
    header{gap:.6rem;padding:.6rem .8rem .55rem}
    header .tagline{display:none}
    .ver,.lang,.scene{font-size:.6rem;letter-spacing:.12em}
    .transport{gap:.4rem}
    .tbtn{padding:.5rem .8rem}
    .tbtn.xport{width:1.8rem;height:1.8rem}
    .tabs{display:flex;background:rgba(0,0,0,.21);border-bottom:1px solid var(--line);flex:none}
    main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
    main[data-tab]>section{display:none}
    main[data-tab="scene"] #tab-scene,
    main[data-tab="sound"] #tab-sound{display:block}
    main[data-tab="pad"] #tab-pad{display:flex;flex-direction:column}
    #tab-pad>.eyebrow{display:none}
    .overlay{font-size:1rem;padding:0 1rem}
    footer{padding:.42rem .8rem}
    footer .note{display:none}
  }
  @media (min-width:901px) and (max-height:720px){
    .scenebtn small{display:none}
    .scenebtn{padding:.24rem .6rem}
    .param{margin-bottom:.44rem}
    .steps{height:22px;margin-top:.45rem}
    .eyebrow{margin-bottom:.55rem}
    .seqhead{margin-top:.9rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }

  /* ============================================================
     テーマ (D-37)
     既定は elevator-one から引き継いだ海の色。
     以下の3つは色と字面、それに各テーマ固有の作り込みを重ねる。
     ============================================================ */

  /* ---- TE: ミニマル & インダストリアル ----
     アルミ削り出しの筐体。等間隔グリッドと極細の罫線、
     工業用の字面に原色のアクセントを要所だけ */
  html[data-theme="te"]{
    --sea-top:#EDECE9; --sea-mid:#E3E2DE; --sea-bot:#D7D6D1;
    --panel:rgba(20,22,24,.035); --panel-hi:rgba(20,22,24,.08);
    --line:rgba(20,22,24,.26);
    --ink:#1B1D1F; --dim:rgba(27,29,31,.58);
    --amber:#F25C05; --accent2:#FFC400; --accent3:#00A6B8;
    --disp:'Menlo','Monaco',monospace;
    --scope:rgba(242,92,5,.85);
    --pad-a:#CFCEC9; --pad-b:#B9B8B2;
  }
  html[data-theme="te"] body{background-image:linear-gradient(180deg,var(--sea-top),var(--sea-bot))}
  /* 等間隔のグリッド。削り出しの面に引いた罫線に見えるよう、ごく薄く */
  html[data-theme="te"] section{
    background:
      repeating-linear-gradient(0deg,transparent 0 23px,rgba(20,22,24,.045) 23px 24px),
      repeating-linear-gradient(90deg,transparent 0 23px,rgba(20,22,24,.045) 23px 24px),
      rgba(255,255,255,.42);
  }
  html[data-theme="te"] header,
  html[data-theme="te"] footer{background:rgba(255,255,255,.5)}
  html[data-theme="te"] .eyebrow{
    color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:.25rem;
    font-weight:600;
  }
  /* 液晶風。表示部だけ階調を落とした面にして、細い横縞を掛ける */
  html[data-theme="te"] .prog,
  html[data-theme="te"] .overlay{
    background-image:repeating-linear-gradient(0deg,rgba(20,22,24,.05) 0 1px,transparent 1px 3px);
  }
  html[data-theme="te"] .prog{
    background-color:rgba(180,186,176,.5);border:1px solid var(--line);padding:.3rem .4rem;
  }
  html[data-theme="te"] .prog b{color:#12240E}
  html[data-theme="te"] .prog .ev{color:var(--amber)}
  html[data-theme="te"] .overlay b{color:rgba(27,29,31,.34)}
  html[data-theme="te"] .overlay .k{color:rgba(27,29,31,.42)}
  html[data-theme="te"] .steps i{background:rgba(20,22,24,.16)}
  html[data-theme="te"] .steps i.hat{background:var(--accent3)}
  html[data-theme="te"] .steps i.on{background:var(--accent2)}
  html[data-theme="te"] .steps i.now{background:var(--amber);box-shadow:none}
  html[data-theme="te"] .toggle[aria-pressed="true"] .lamp{background:var(--amber);box-shadow:none}
  html[data-theme="te"] input[type=range]::-webkit-slider-thumb{background:var(--ink)}
  html[data-theme="te"] input[type=range]:hover::-webkit-slider-thumb{background:var(--amber)}
  html[data-theme="te"] .scenebtn[aria-pressed="true"]{color:var(--amber);border-left-color:var(--amber)}
  html[data-theme="te"] #tip{background:#F2F1EE;color:var(--ink)}
  html[data-theme="te"] .vcap{color:rgba(27,29,31,.7);text-shadow:0 1px 6px rgba(255,255,255,.8)}

  /* ---- EK: ダーク & サイバネティクス ----
     漆黒の筐体に単色の高輝度表示。16個のキースイッチ、
     シルク印刷のように囲まれた機能ブロック */
  html[data-theme="ek"]{
    --sea-top:#0A0A0B; --sea-mid:#08080A; --sea-bot:#050506;
    --panel:rgba(255,255,255,.045); --panel-hi:rgba(255,255,255,.1);
    --line:rgba(255,255,255,.16);
    --ink:#F4F4EE; --dim:rgba(244,244,238,.5);
    --amber:#FFE20A; --accent2:#FFE20A; --accent3:#FFFFFF;
    --disp:'Helvetica Neue','Arial Narrow',sans-serif;
    --scope:rgba(255,226,10,.9);
    --pad-a:#0C0C0E; --pad-b:#000000;
  }
  html[data-theme="ek"] body{background-image:none;background:#08080A}
  html[data-theme="ek"] header,
  html[data-theme="ek"] footer{background:#0B0B0D}
  /* パネルのシルク印刷。各セクションを独立したモジュールとして細い線で囲む */
  html[data-theme="ek"] section{background:#0B0B0D;padding:.7rem .8rem .9rem}
  html[data-theme="ek"] section>.eyebrow{
    border:1px solid var(--line);border-left:3px solid var(--amber);
    padding:.22rem .4rem;font-weight:700;letter-spacing:.24em;color:var(--ink);
  }
  html[data-theme="ek"] .seqhead .eyebrow{border:1px solid var(--line);border-left:3px solid var(--amber);padding:.22rem .4rem}
  html[data-theme="ek"] #params,
  html[data-theme="ek"] #clockparams,
  html[data-theme="ek"] #scenes,
  html[data-theme="ek"] .prog{
    border:1px solid var(--line);padding:.5rem .55rem;margin-top:.5rem;
  }
  /* 16個の正方形キースイッチ。点いている位置はバックライト風に光る */
  html[data-theme="ek"] .steps{
    height:auto;gap:3px;border-bottom:none;padding:2px 0;align-items:stretch;
  }
  html[data-theme="ek"] .steps i{
    height:18px !important;border-radius:2px;
    background:#141416;border:1px solid rgba(255,255,255,.13);
  }
  html[data-theme="ek"] .steps i.hat{background:#1D2226}
  html[data-theme="ek"] .steps i.on{background:#2A2A16;border-color:rgba(255,226,10,.4)}
  html[data-theme="ek"] .steps i.now{
    background:var(--amber);border-color:var(--amber);
    box-shadow:0 0 10px rgba(255,226,10,.75),inset 0 0 6px rgba(255,255,255,.5);
  }
  html[data-theme="ek"] .lamp{border-radius:2px;width:9px;height:9px}
  html[data-theme="ek"] .toggle[aria-pressed="true"] .lamp{box-shadow:0 0 9px var(--amber)}
  html[data-theme="ek"] input[type=range]::-webkit-slider-thumb{background:var(--amber);width:7px;height:16px;margin-top:-8px}
  html[data-theme="ek"] .tbtn[data-on="1"]{background:var(--amber);color:#08080A}
  html[data-theme="ek"] .overlay b{color:rgba(244,244,238,.30)}
  html[data-theme="ek"] .scene{color:var(--amber)}
  html[data-theme="ek"] #tip{background:#101012}

  /* ---- テーマの選択 ---- */
  #themes{display:flex;gap:.3rem;margin-bottom:.2rem}
  .themebtn{
    flex:1;border:1px solid var(--line);background:var(--panel);
    font-size:.62rem;letter-spacing:.16em;padding:.32rem 0;color:var(--dim);
    transition:color .16s,background .16s,border-color .16s;
  }
  .themebtn:hover{color:var(--ink);background:var(--panel-hi)}
  .themebtn[aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
</style>
</head>
<body>

<header>
  <div class="mark">Elevator Two</div>
  <div class="sub tagline">generative electro</div>

let scope=null, scopeBuf=null;   // XYパッドの背景に出す波形 (D-36)
let ctx=null, master=null, comp=null, makeup=null, out=null, streamDest=null,

// 鳴り終わったノードの切り離しは ctx.currentTime 基準の予定として持つ。
// setTimeout に載せると、絞られた環境では発火しないクロージャがノードを掴んだまま溜まる
const disposals=[];
function disposeAt(node,at){ disposals.push({node,at}); }
function runDisposals(now){
  for(let i=disposals.length-1;i>=0;i--){
    if(disposals[i].at>now) continue;
    try{ disposals[i].node.disconnect(); }catch(e){}
    disposals.splice(i,1);
  }
}

/* ---- 音源の素材 ----
   ドラムは D-10 のとおり全て自前合成する。打点ごとにオシレータを立てると数が多くなるので、
   ノイズと金属質の倍音列は起動時に1本ずつ焼いて、打点では読み出しと包絡だけを作る */
function noiseBuffer(sec){
  const n=Math.floor(ctx.sampleRate*sec);
  const buf=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return buf;
}
// TR-808 のハイハットとシンバルは矩形波6基を非整数比で重ねて作る。その源をあらかじめ焼く
function metalBuffer(sec){
  const RATIO=[2.0,3.0,4.16,5.43,6.79,8.21], base=40;
  const n=Math.floor(ctx.sampleRate*sec);
  const buf=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++){
    const tt=i/ctx.sampleRate;
    let v=0;
    for(const r of RATIO) v+=Math.sign(Math.sin(2*Math.PI*base*r*tt));
    d[i]=v/RATIO.length;
  }
  return buf;
}

/* ---- キット (docs/SCENES.md) ----
   合成方式は共通で、パラメータの振り方だけが違う */
const KITS={

};
// 打点が参照するキット。DJ ミックス風の遷移では、入ってくる側だけ新シーンのキットで鳴らす
