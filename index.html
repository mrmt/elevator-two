<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: 指定しないと iOS はページ全体をセーフエリア内に押し込むため、
     landscape で上下左右に余白が出る。余白の回避は body の padding で行う -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELEVATOR TWO</title>
<style>
  :root{
    /* one の海の色に対し、two はより暗く青い夜の側へ寄せる */
    --sea-top:#1A2430;
    --sea-mid:#131C27;
    --sea-bot:#0B121B;
    --panel:rgba(255,255,255,.055);
    --panel-hi:rgba(255,255,255,.11);
    --line:rgba(226,236,242,.19);
    --ink:#E7E2CE;
    --dim:rgba(214,226,232,.62);
    --amber:#D8A340;
    --disp:'Futura','Avenir Next Condensed','Helvetica Neue',sans-serif;
    --data:'Menlo','Monaco',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--sea-mid);
    background-image:linear-gradient(180deg,var(--sea-top) 0%,var(--sea-mid) var(--sea-split,52%),var(--sea-bot) 100%);
    color:var(--ink);
    font-family:var(--disp);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---- header ---- */
  header{
    display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
    padding:.8rem 1.2rem .7rem;
    background:rgba(0,0,0,.21);
    border-bottom:1px solid var(--line);
  }
  .mark{font-size:.95rem;letter-spacing:.42em;text-transform:uppercase}
  .sub{font-size:.68rem;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
  .ver{opacity:.6}
  /* 現在のシーン名。one の mood 表示と同じ役割 */
  .scene{color:var(--amber);opacity:.85}
  .transport{margin-left:auto;display:flex;gap:.55rem;align-items:center;flex-shrink:0}
  .tbtn{
    border:1px solid var(--line);
    padding:.5rem 1.1rem;
    font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;
    white-space:nowrap;
    background:var(--panel);
    transition:background .18s,border-color .18s,color .18s;
  }
  .tbtn:hover{background:var(--panel-hi)}
  .tbtn[data-on="1"]{background:var(--amber);color:#101A22;border-color:var(--amber)}
  .sub.lang{padding:0;opacity:.6;transition:color .18s,opacity .18s}
  .sub.lang:hover{color:var(--amber);opacity:1}
  /* 再生 / 一時停止。ロック画面と同じ並びで、現在の状態の側が点灯する */
  .tbtn.xport{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;padding:0}
  .tbtn.xport .ico{width:.7rem;height:.7rem;fill:currentColor;flex-shrink:0}

  /* ---- タブ (狭幅時のみ表示) ---- */
  .tabs{display:none}
  .tab{
    flex:1;padding:.62rem .4rem;
    font-size:.72rem;letter-spacing:.2em;
    color:var(--dim);border-bottom:2px solid transparent;
    transition:color .16s,border-color .16s,background .16s;
  }
  .tab[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber);background:rgba(0,0,0,.16)}

  /* ---- main grid ---- */
  main{
    flex:1;min-height:0;display:grid;
    grid-template-columns:minmax(128px,166px) minmax(0,1fr) minmax(184px,222px);
    gap:1px;background:var(--line);
    border-bottom:1px solid var(--line);
  }
  section{
    background:rgba(0,0,0,.21);padding:.9rem 1rem 1rem;
    min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  section::-webkit-scrollbar{width:7px}
  section::-webkit-scrollbar-thumb{background:var(--line)}
  section::-webkit-scrollbar-track{background:transparent}
  .eyebrow{
    font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--dim);margin-bottom:.85rem;
  }

  /* ---- シーン一覧 ---- */
  .scenebtn{
    display:block;width:100%;text-align:left;cursor:pointer;
    padding:.32rem .6rem;margin-bottom:.1rem;
    font-size:.9rem;letter-spacing:.14em;
    border-left:2px solid transparent;color:var(--dim);
    transition:color .16s,background .16s,border-color .16s;
  }
  .scenebtn:hover{color:var(--ink);background:var(--panel)}
  .scenebtn[aria-pressed="true"]{color:var(--amber);border-left-color:var(--amber);background:var(--panel)}
  .scenebtn small{display:block;font-size:.56rem;letter-spacing:.12em;color:var(--dim);margin-top:.12rem}
  html[lang="en"] .scenebtn small{display:none}
  /* 群の見出し。シーンは主回路ごとに固まって並ぶ */
  .group{
    font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;
    color:rgba(214,226,232,.4);margin:.7rem 0 .3rem;
  }
  .group:first-child{margin-top:0}

  /* ---- plane ---- */
  .plane-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
  .plane{
    position:relative;flex:1;min-height:96px;
    border:1px solid var(--line);background:rgba(0,0,0,.30);
    touch-action:none;cursor:crosshair;
    container-type:size;container-name:pad;
  }
  .plane canvas{display:block;width:100%;height:100%}
  .axis{
    display:flex;justify-content:space-between;
    font-size:.58rem;letter-spacing:.22em;color:var(--dim);
    text-transform:uppercase;margin-top:.5rem;
  }
  .plane-outer{position:relative;flex:1;min-height:0;display:flex;gap:.5rem}
  .axis-v{
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;
    width:1.05rem;flex:none;
    font-size:.58rem;letter-spacing:.22em;color:var(--dim);
  }
  .axis-v span{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.1em}
  html[lang="en"] .axis-v span{text-orientation:mixed;letter-spacing:.22em}
  .axis-v .mid{color:var(--ink)}

  /* ---- pad overlay readout ---- */
  .overlay{
    position:absolute;inset:0;pointer-events:none;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    gap:clamp(0rem,.7vh,.5rem);padding:.4rem;text-align:center;
    font-family:'Helvetica Neue','Avenir Next','Hiragino Sans',system-ui,sans-serif;
    text-shadow:0 1px 16px rgba(0,0,0,.34);
  }
  .overlay .k{
    display:block;font-size:clamp(.6rem,1.5vh,.82rem);letter-spacing:.34em;
    color:rgba(233,242,246,.34);margin-bottom:.02em;
  }
  .overlay b{
    display:block;font-weight:500;
    font-size:clamp(1.65rem,7.05vh,4.2rem);line-height:1.0;
    letter-spacing:.005em;font-variant-numeric:tabular-nums;
    color:rgba(233,242,246,.26);
  }
  @container pad (min-aspect-ratio: 2/1){
    .overlay{flex-flow:row wrap;align-content:center;column-gap:6%}
    .overlay>div{width:40%}
    .overlay b{font-size:clamp(1.65rem,11vh,4.2rem)}
    .overlay .k{font-size:clamp(.6rem,2.2vh,.82rem)}
  }

  /* ---- tooltip ---- */
  #tip{
    position:fixed;z-index:60;max-width:15rem;pointer-events:none;
    background:#16222C;border:1px solid var(--line);
    color:var(--ink);font-size:.68rem;line-height:1.6;letter-spacing:.05em;
    padding:.45rem .65rem;opacity:0;transition:opacity .12s;
  }
  #tip.on{opacity:1}
  #tip.fade{transition:opacity .9s}

  /* ---- params ---- */
  .param{margin-bottom:.62rem}
  .param label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:.72rem;letter-spacing:.16em;margin-bottom:.18rem;
  }
  .param .val{font-family:var(--data);font-size:.65rem;color:var(--amber);letter-spacing:.04em}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:9px;height:14px;margin-top:-7px;
    background:var(--ink);border:none;border-radius:0;
  }
  input[type=range]:hover::-webkit-slider-thumb{background:var(--amber)}
  input[type=range]::-moz-range-track{height:1px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:9px;height:14px;background:var(--ink);border:none;border-radius:0}

  .toggle{
    display:flex;align-items:center;gap:.5rem;
    font-size:.72rem;letter-spacing:.16em;
    border:1px solid var(--line);padding:.45rem .6rem;width:100%;
    justify-content:space-between;background:var(--panel);
  }
  .lamp{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s,box-shadow .2s}
  .toggle[aria-pressed="true"] .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber)}

  /* ---- ステップ列 ----
     16ステップ = 1小節。4拍目ごとに区切りを入れ、いま鳴っている位置を琥珀で示す */
  .steps{
    display:grid;grid-template-columns:repeat(16,1fr);gap:2px;
    height:30px;align-items:end;margin-top:.65rem;
    border-bottom:1px solid var(--line);padding-bottom:2px;
  }
  .steps i{display:block;background:var(--line);height:22%;transition:background .1s,box-shadow .1s}
  .steps i.beat{height:44%}
  /* 何が鳴る位置かを高さと色で示す。on = キックやスネア、hat = ハット */
  .steps i.hat{background:#4D5A63;height:34%}
  .steps i.on{background:#707C5D;height:66%}
  .steps i.now{background:var(--amber);box-shadow:0 0 7px rgba(216,163,64,.65)}
  .seqhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.4rem}

  /* ---- 進行の表示 ----
     フレーズ型とイベントは音がまだ無いので、当面ここだけが確認手段になる */
  .prog{
    font-family:var(--data);font-size:.62rem;letter-spacing:.02em;
    color:var(--dim);margin-top:.55rem;display:grid;gap:.18rem;
  }
  .prog b{color:var(--ink);font-weight:400}
  .prog .ev{color:var(--amber)}

  /* ---- readout ---- */
  footer{
    padding:.5rem 1.2rem;font-family:var(--data);
    background:rgba(0,0,0,.21);
    font-size:.62rem;letter-spacing:.02em;color:var(--dim);
    display:flex;gap:1.4rem;flex-wrap:wrap;align-items:center;flex:none;
  }
  footer b{color:var(--ink);font-weight:400}
  .note{margin-left:auto;color:var(--dim)}

  @media (max-width:900px){
    body{overscroll-behavior:none}
    header{gap:.6rem;padding:.6rem .8rem .55rem}
    header .tagline{display:none}
    .ver,.lang,.scene{font-size:.6rem;letter-spacing:.12em}
    .transport{gap:.4rem}
    .tbtn{padding:.5rem .8rem}
    .tbtn.xport{width:1.8rem;height:1.8rem}
    .tabs{display:flex;background:rgba(0,0,0,.21);border-bottom:1px solid var(--line);flex:none}
    main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
    main[data-tab]>section{display:none}
    main[data-tab="scene"] #tab-scene,
    main[data-tab="sound"] #tab-sound{display:block}
    main[data-tab="pad"] #tab-pad{display:flex;flex-direction:column}
    #tab-pad>.eyebrow{display:none}
    .overlay{font-size:1rem;padding:0 1rem}
    footer{padding:.42rem .8rem}
    footer .note{display:none}
  }
  @media (min-width:901px) and (max-height:720px){
    .scenebtn small{display:none}
    .scenebtn{padding:.24rem .6rem}
    .param{margin-bottom:.44rem}
    .steps{height:22px;margin-top:.45rem}
    .eyebrow{margin-bottom:.55rem}
    .seqhead{margin-top:.9rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<header>
  <div class="mark">Elevator Two</div>
  <div class="sub tagline">generative electro</div>
  <div class="sub ver" id="ver"></div>
  <button class="sub lang" id="lang" data-i18n-tip="tip.lang" data-i18n-aria="transport.lang">JA</button>
  <!-- 現在のシーン名。中身は updateScene() が入れる -->
  <div class="sub scene" id="scenename"></div>
  <div class="transport">
    <button class="tbtn xport" id="play" data-on="0" aria-pressed="false" aria-label="再生" data-i18n-aria="transport.play" data-i18n-tip="tip.play"><svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1 10 6l-7.5 5z"/></svg></button>
    <button class="tbtn xport" id="pause" data-on="1" aria-pressed="true" aria-label="一時停止" data-i18n-aria="transport.pause" data-i18n-tip="tip.pause"><svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1h2.6v10H2.5zM6.9 1h2.6v10H6.9z"/></svg></button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab" data-tab="scene" aria-selected="false" data-i18n="tab.scene">シーン</button>
  <button class="tab" data-tab="pad" aria-selected="true" data-i18n="tab.pad">XYパッド</button>
  <button class="tab" data-tab="sound" aria-selected="false" data-i18n="tab.sound">音作り</button>
</nav>

<main id="main" data-tab="pad">
  <section id="tab-scene">
    <div class="eyebrow" data-i18n="section.scene">シーン</div>
    <!-- 今のシーンを打ち切って次へ進む。波は進むので、行き先は陰陽の位置が決める -->
    <button class="toggle" id="next" aria-pressed="false" style="margin-bottom:.7rem"
      data-i18n-tip="tip.next">
      <span data-i18n="section.next">次へ</span><span class="lamp"></span>
    </button>
    <div id="scenes"></div>
  </section>

  <section class="plane-wrap" id="tab-pad">
    <div class="eyebrow" data-i18n="section.pad">XYパッド — ドラッグで目標を移動</div>
    <div class="plane-outer">
      <div class="axis-v">
        <span data-i18n="pad.sparse">疎</span><span class="mid" data-i18n="pad.density">密度</span><span data-i18n="pad.dense">密</span>
      </div>
      <div class="plane" id="plane">
        <canvas id="cv"></canvas>
        <div class="overlay">
          <div><span class="k" data-i18n="pad.yy">陰陽</span><b id="ryy">—</b></div>
          <div><span class="k" data-i18n="pad.density">密度</span><b id="rd">—</b></div>
          <div><span class="k" data-i18n="pad.bpm">BPM</span><b id="rbpm">—</b></div>
          <div><span class="k" data-i18n="pad.bar">小節</span><b id="rbar">—</b></div>
        </div>
      </div>
    </div>
    <div class="axis"><span data-i18n="pad.yin">陰</span><span style="color:var(--ink)" data-i18n="pad.yy">陰陽</span><span data-i18n="pad.yang">陽</span></div>
    <div class="steps" id="steps"></div>
    <!-- 音がまだ無い段階では、進行が正しく回っているかはここでしか分からない -->
    <div class="prog">
      <div><span data-i18n="prog.phrase">フレーズ</span> <b id="pphrase">—</b> <span id="pbarpos"></span></div>
      <div><span data-i18n="prog.event">イベント</span> <b class="ev" id="pevent">—</b></div>
      <div><span data-i18n="prog.wave">陰陽の波</span> <b id="pwave">—</b></div>
      <div><span data-i18n="prog.key">調</span> <b id="pkey">—</b></div>
    </div>
  </section>

  <section id="tab-sound">
    <div class="eyebrow" data-i18n="section.params">パラメータ</div>
    <div id="params"></div>
    <div class="seqhead"><div class="eyebrow" style="margin:0" data-i18n="section.clock">クロック</div></div>
    <div id="clockparams" style="margin-top:.8rem"></div>
  </section>
</main>

<footer>
  <span class="note" data-i18n="footer.note">白い十字が目標、琥珀のランプが現在地。ステップ列の緑がキックとスネア、青がハット</span>
</footer>

<div id="tip" role="tooltip"></div>

<!-- メッセージカタログ。UI文字列はすべてここにあり、直書きしない。
     ja と en はキー集合が一致していること (tests/i18n.spec.js が検証する) -->

en:{
  'transport.play':'play','transport.pause':'pause','transport.lang':'switch language',

function noiseBuffer(sec){
  const n=Math.floor(ctx.sampleRate*sec);
  const buf=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;

}
// TR-808 のハイハットとシンバルは矩形波6基を非整数比で重ねて作る。その源をあらかじめ焼く
function metalBuffer(sec){
  const RATIO=[2.0,3.0,4.16,5.43,6.79,8.21], base=40;
  const n=Math.floor(ctx.sampleRate*sec);
  const buf=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++){
    const tt=i/ctx.sampleRate;
    let v=0;
    for(const r of RATIO) v+=Math.sign(Math.sin(2*Math.PI*base*r*tt));
    d[i]=v/RATIO.length;
  }
  return buf;
}

/* ---- キット (docs/SCENES.md) ----

const KITS={

const kit = () => KITS[SCENES[sceneIdx].kit];

/* ---- 調性 (D-9) ----
   キーはシーンごとに変え、移動先は五度圏で近い調から選ぶ。
   音階は主回路の群ごとに変える。ベースもハーモニーもここから音を引く */
const SCALES={
  stab:    [0,2,3,5,7,8,10],   // 自然短音階
  jazz:    [0,2,3,5,7,9,10],   // ドリアン。テンションを載せやすい
  funk:    [0,3,5,7,10],       // 短調のペンタトニック

};

const mtof = m => 440*Math.pow(2,(m-69)/12);

function build(){
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  ctx.onstatechange=()=>reviveAudio();   // iOS は interrupted に落とすことがある

  comp = ctx.createDynamicsCompressor();
  comp.threshold.value=-14; comp.knee.value=24; comp.ratio.value=4;
  comp.attack.value=.05; comp.release.value=.6;

  // DynamicsCompressorNode は自動メイクアップを持たないので、圧縮した分を戻す段を後ろに置く
  makeup = ctx.createGain(); makeup.gain.value=1;

  // コンプのアタックをすり抜ける立ち上がりを tanh で丸める。
  // 前段で半分にしてから curve の定義域 -1〜1 を実振幅 -2〜2 に見立てる
  const clipPre = ctx.createGain(); clipPre.gain.value=.5;
  const clip = ctx.createWaveShaper();
  {
    const n=2048, curve=new Float32Array(n);
    for(let i=0;i<n;i++) curve[i]=Math.tanh((i/(n-1)*2-1)*2);
    clip.curve=curve; clip.oversample='4x';
  }
  out = clip;   // destination への最終段。経路の切り替えはここから行う

  master = ctx.createGain(); master.gain.value=0;
  master.connect(comp).connect(makeup).connect(clipPre).connect(clip).connect(ctx.destination);
  streamDest = ctx.createMediaStreamDestination();
  out.connect(streamDest);   // バックグラウンド再生用の <audio> へ流す経路

  // 全体フィルタ。第3層イベントの masterfilter がここを閉じて開く (D-4)
  mixFilter = ctx.createBiquadFilter();
  mixFilter.type='lowpass'; mixFilter.frequency.value=20000; mixFilter.Q.value=.7;
  mixFilter.connect(master);

  dry = ctx.createGain(); dry.gain.value=.9; dry.connect(mixFilter);

  // リバーブ
  const conv=ctx.createConvolver();
  {
    const sec=3.2, n=Math.floor(ctx.sampleRate*sec);
    const buf=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){
      const d=buf.getChannelData(ch);
      for(let i=0;i<n;i++){
        const u=i/n;
        d[i]=(Math.random()*2-1)*Math.pow(1-u,2.6)*(1-Math.exp(-i/300));
      }

    conv.buffer=buf;

  revSend=ctx.createGain(); revSend.gain.value=1;

    d.connect(lp).connect(fb).connect(d);
    lp.connect(o).connect(pn).connect(mixFilter);
    pn.connect(revSend);

  // drumFilter は sweep イベントが動かす
  noiseBuf=noiseBuffer(2);
  metalBuf=metalBuffer(1);

  drumBus=ctx.createGain(); drumBus.gain.value=1;
  drumSat=ctx.createWaveShaper();

    const n=1024, curve=new Float32Array(n);
    for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; curve[i]=Math.tanh(x*1.9); }
    drumSat.curve=curve; drumSat.oversample='2x';
  }
  drumFilter=ctx.createBiquadFilter();
  drumFilter.type='lowpass'; drumFilter.frequency.value=20000; drumFilter.Q.value=1.0;
  const drumPost=ctx.createGain(); drumPost.gain.value=1;
  drumBus.connect(drumSat).connect(drumPost).connect(drumFilter);
  build.drumPost=drumPost;
  drumFilter.connect(dry);
  const dSend=ctx.createGain(); dSend.gain.value=.5; drumFilter.connect(dSend).connect(revSend);
  const dDly =ctx.createGain(); dDly.gain.value=.3;  drumFilter.connect(dDly).connect(dlySend);

/* ============================================================
   Ladder フィルタ (D-10)
   ------------------------------------------------------------
   ベースの中核。BiquadFilter の多段近似ではレゾナンスを上げたときの
   粘りと飽和が出ないため、音声スレッドで自前に持つ。
   4段の一次ローパスに負帰還をかけ、各段を tanh で飽和させる古典的な構成。
   単一ファイル方針は Blob URL で読み込むことで保つ (時計と同じ手)。
   ============================================================ */
const LADDER_SRC=`
class LadderProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors(){
    return [
      {name:'cutoff',    defaultValue:700, minValue:30, maxValue:16000, automationRate:'a-rate'},
      {name:'resonance', defaultValue:1.4, minValue:0,  maxValue:4.2,   automationRate:'k-rate'},
      {name:'drive',     defaultValue:1.0, minValue:.1, maxValue:8,     automationRate:'k-rate'},
    ];
  }
  constructor(){ super(); this.s=[0,0,0,0]; }
  process(inputs, outputs, params){
    const inp=inputs[0][0], out=outputs[0][0];
    if(!out) return true;
    if(!inp){ out.fill(0); return true; }
    const cut=params.cutoff, res=params.resonance[0], drv=params.drive[0];
    const nyq=sampleRate*0.45, s=this.s;
    for(let i=0;i<out.length;i++){
      const fc=Math.min(cut.length>1?cut[i]:cut[0], nyq);
      const g=1-Math.exp(-2*Math.PI*fc/sampleRate);
      // 4段目の出力を戻す。レゾナンスを上げるほど低域が痩せるのが ladder の性格
      const x=Math.tanh(inp[i]*drv - res*s[3]);
      s[0]+=g*(x-Math.tanh(s[0]));
      s[1]+=g*(Math.tanh(s[0])-Math.tanh(s[1]));
      s[2]+=g*(Math.tanh(s[1])-Math.tanh(s[2]));
      s[3]+=g*(Math.tanh(s[2])-Math.tanh(s[3]));
      out[i]=s[3];
    }
    return true;
  }
}
registerProcessor('ladder', LadderProcessor);
`;
let ladderReady=false;

// ベースの経路を組む。Worklet が使えない環境では BiquadFilter 2段へ落とす
function ensureBass(){
  if(bassReady) return;
  bassSum=ctx.createGain(); bassSum.gain.value=.5;
  bassPre=ctx.createGain(); bassPre.gain.value=1;
  bassShaper=ctx.createWaveShaper();
  {
    const n=1024, curve=new Float32Array(n);
    for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; curve[i]=Math.tanh(x*2.2); }
    bassShaper.curve=curve; bassShaper.oversample='4x';
  }
  if(ladderReady){
    bassLadder=new AudioWorkletNode(ctx,'ladder',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
  }else{
    // 代替。粘りは出ないが鳴らないよりはよい
    const a=ctx.createBiquadFilter(), b=ctx.createBiquadFilter();
    a.type='lowpass'; b.type='lowpass'; a.Q.value=6; b.Q.value=.7;
    a.connect(b);
    bassLadder={ _a:a, _b:b, connect:(n)=>b.connect(n),
      parameters:{ get:(k)=> k==='cutoff' ? a.frequency : k==='resonance' ? a.Q : b.gain } };
    bassLadder.__in=a;
  }
  bassAmp=ctx.createGain(); bassAmp.gain.value=0;
  bassComp=ctx.createDynamicsCompressor();
  // 「厚めのコンプが効いた音」(D-3)。速く深くかけて質量を出す
  bassComp.threshold.value=-22; bassComp.knee.value=6; bassComp.ratio.value=6;
  bassComp.attack.value=.004; bassComp.release.value=.12;
  bassBus=ctx.createGain(); bassBus.gain.value=.9;

  bassSum.connect(bassPre).connect(bassShaper);
  bassShaper.connect(bassLadder.__in || bassLadder);
  bassLadder.connect(bassAmp);
  bassAmp.connect(bassComp).connect(bassBus);
  bassBus.connect(dry);
  const bRev=ctx.createGain(); bRev.gain.value=.08; bassBus.connect(bRev).connect(revSend);
  const bDly=ctx.createGain(); bDly.gain.value=.10; bassBus.connect(bDly).connect(dlySend);
  build.bassSends={rev:bRev,dly:bDly};

  // ゆっくりしたうねり。「ベースラインにフィルタが揺れ動く」の土台 (D-3)
  const lo=ctx.createOscillator(), lg=ctx.createGain();
  lo.type='sine'; lo.frequency.value=.06; lg.gain.value=0;
  lo.connect(lg).connect(bassCutParam());
  lo.start();
  bassLfo={osc:lo,gain:lg};
  bassReady=true;
}
const bassCutParam = () => bassLadder.parameters ? bassLadder.parameters.get('cutoff') : bassLadder.frequency;
const bassResParam = () => bassLadder.parameters ? bassLadder.parameters.get('resonance') : null;
const bassDrvParam = () => (bassLadder.parameters && bassLadder.parameters.get('drive')) || null;

/* ============================================================
   ベース (D-10)
   ------------------------------------------------------------
   矩形波3基を ±7cent でデチューンし、1オクターブ下のサブを足す。
   飽和 → Ladder → 深いコンプ、という順で質量を作る。
   単音なので包絡とフィルタは共有の段に持たせ、打点ごとには
   オシレータだけを立てる。
   ============================================================ */
function bassNote(time,midi,durSec,vel,accent){
  if(!bassReady) return;
  const f=mtof(midi), t=time;
  const oscs=[];
  for(const cents of [-7,0,7]){
    const o=ctx.createOscillator();
    o.type='square'; o.frequency.value=f; o.detune.value=cents;
    o.connect(bassSum); o.start(t); o.stop(t+durSec+.06);
    oscs.push(o);
  }
  // サブ。ここが「厚み」の半分を担う
  const sub=ctx.createOscillator(), sg=ctx.createGain();
  sub.type='square'; sub.frequency.value=f/2;
  sg.gain.value=.85+current.weight*.5;
  sub.connect(sg).connect(bassSum); sub.start(t); sub.stop(t+durSec+.06);
  oscs.push(sub);
  for(const o of oscs) disposeAt(o,t+durSec+.12);
  disposeAt(sg,t+durSec+.12);

  // 振幅。立ち上がりは速く、切れ際だけ少し丸める
  const g=bassAmp.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(Math.max(g.value,.0001),t);
  g.linearRampToValueAtTime(vel*.9,t+.006);
  g.setValueAtTime(vel*.9,t+durSec*.8);
  g.linearRampToValueAtTime(.0001,t+durSec);

  // フィルタ包絡。1音ごとにカットオフを叩いて戻す。アクセントで深さが変わる
  const cp=bassCutParam(), base=bassCutoffBase();
  const peak=Math.min(base*(2.2+accent*4.5+current.drive*2.2), 9000);
  cp.cancelScheduledValues(t);
  cp.setValueAtTime(peak,t);
  cp.exponentialRampToValueAtTime(Math.max(60,base),t+Math.min(durSec*.9,.45));
}

// カットオフの基準値。陰は低く閉じ、陽は高く開く
function bassCutoffBase(){
  const yy=current.yy, w=current.weight;
  return (170+yy*680)*(1.25-w*.5);
}

/* ============================================================
   ドラム音源 (D-10)
   すべて TR-808 の作り方に倣った合成。サンプルは持たない。
   各関数は「その時刻に鳴らして、鳴り終わったら片付ける」だけを行う。
   ============================================================ */
function drumOut(pan){
  const p=ctx.createStereoPanner(); p.pan.value=pan||0;
  p.connect(drumBus);
  return p;
}
function decayTo(gain,t,peak,dec,atk){
  const a=atk||.001;
  gain.setValueAtTime(0.0001,t);
  gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);
  gain.exponentialRampToValueAtTime(.0001,t+a+dec);
}

// バスドラム: 正弦波のピッチ落ち + 冒頭の短いクリック
function bd(t,v){
  const k=kit().bd, w=current.weight;
  const o=ctx.createOscillator(), g=ctx.createGain(), p=drumOut(0);
  o.type='sine';
  const f0=k.f0*(1-w*.18), f1=k.f1*(1-w*.16);
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f1,t+k.pd);
  const dec=k.dec*(.8+w*.5);
  decayTo(g.gain,t,v*k.gain*(.55+w*.6),dec);
  o.connect(g).connect(p);
  o.start(t); o.stop(t+dec+.05);
  if(k.click>.02){
    const c=ctx.createBufferSource(), cg=ctx.createGain(), hp=ctx.createBiquadFilter();
    c.buffer=noiseBuf; c.loop=true; hp.type='highpass'; hp.frequency.value=1800;
    decayTo(cg.gain,t,v*k.click*.5,.012);
    c.connect(hp).connect(cg).connect(p);
    c.start(t); c.stop(t+.05);
    disposeAt(c,t+.1); disposeAt(hp,t+.1); disposeAt(cg,t+.1);
  }
  disposeAt(o,t+dec+.1); disposeAt(g,t+dec+.1); disposeAt(p,t+dec+.1);
}

// スネア: 正弦波2基 + ノイズ
function sd(t,v){
  const k=kit().sd, p=drumOut(-.05);
  for(const [f,amp] of [[k.tone,.6],[k.tone*1.62,.4]]){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f,t);
    o.frequency.exponentialRampToValueAtTime(f*.82,t+.08);
    decayTo(g.gain,t,v*amp*.5,.10);
    o.connect(g).connect(p); o.start(t); o.stop(t+.2);
    disposeAt(o,t+.25); disposeAt(g,t+.25);
  }
  const n=ctx.createBufferSource(), ng=ctx.createGain(), bp=ctx.createBiquadFilter();
  n.buffer=noiseBuf; n.loop=true; bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=.7;
  decayTo(ng.gain,t,v*k.noise*.5,k.dec);
  n.connect(bp).connect(ng).connect(p);
  n.start(t); n.stop(t+k.dec+.05);
  disposeAt(n,t+k.dec+.1); disposeAt(bp,t+k.dec+.1); disposeAt(ng,t+k.dec+.1); disposeAt(p,t+k.dec+.15);
}

// クラップ: 短いノイズを数回連射してから尾を引かせる
function cp(t,v){
  const p=drumOut(.12), bp=ctx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=1250; bp.Q.value=1.1; bp.connect(p);
  for(let i=0;i<3;i++){
    const n=ctx.createBufferSource(), g=ctx.createGain();
    n.buffer=noiseBuf; n.loop=true;
    const at=t+i*.011;
    decayTo(g.gain,at,v*.42,.016);
    n.connect(g).connect(bp); n.start(at); n.stop(at+.05);
    disposeAt(n,at+.1); disposeAt(g,at+.1);
  }
  const n=ctx.createBufferSource(), g=ctx.createGain();
  n.buffer=noiseBuf; n.loop=true;
  decayTo(g.gain,t+.033,v*.30,.16);
  n.connect(g).connect(bp); n.start(t+.033); n.stop(t+.25);
  disposeAt(n,t+.3); disposeAt(g,t+.3); disposeAt(bp,t+.35); disposeAt(p,t+.35);
}

// ハイハット: 焼いておいた矩形波6基の倍音列をハイパスで削って包絡をかける
function hh(t,v,open){
  const k=kit(), dec = open ? k.oh.dec : k.hh.dec;
  const n=ctx.createBufferSource(), hp=ctx.createBiquadFilter(), g=ctx.createGain(),
        p=drumOut(open?.18:.10);
  n.buffer=metalBuf; n.loop=true;
  n.playbackRate.value=rand(.97,1.03);   // 打点ごとにわずかに揺らす
  hp.type='highpass'; hp.frequency.value=k.hh.hp;
  decayTo(g.gain,t,v*k.hh.gain*(open?.85:1),dec);
  n.connect(hp).connect(g).connect(p);
  n.start(t+rand(0,.004)); n.stop(t+dec+.05);
  disposeAt(n,t+dec+.1); disposeAt(hp,t+dec+.1); disposeAt(g,t+dec+.1); disposeAt(p,t+dec+.15);
}

// シンバル: ハイハットと同じ源を低めのバンドパスで長く伸ばす
function cy(t,v){
  const n=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain(), p=drumOut(-.3);
  n.buffer=metalBuf; n.loop=true;
  bp.type='bandpass'; bp.frequency.value=5200; bp.Q.value=.5;
  decayTo(g.gain,t,v*.30,1.25);
  n.connect(bp).connect(g).connect(p);
  n.start(t); n.stop(t+1.4);
  disposeAt(n,t+1.5); disposeAt(bp,t+1.5); disposeAt(g,t+1.5); disposeAt(p,t+1.55);
}

// カウベル: 矩形波2基。electro のキットだけが使う
function cb(t,v){
  const p=drumOut(.3), bp=ctx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=2640; bp.Q.value=1.4; bp.connect(p);
  for(const f of [540,800]){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='square'; o.frequency.value=f;
    decayTo(g.gain,t,v*.20,.34);
    o.connect(g).connect(bp); o.start(t); o.stop(t+.4);
    disposeAt(o,t+.45); disposeAt(g,t+.45);
  }
  disposeAt(bp,t+.5); disposeAt(p,t+.5);
}

// リム: ごく短い矩形波の打点
function rim(t,v,pan){
  const o=ctx.createOscillator(), g=ctx.createGain(), p=drumOut(pan);
  o.type='square'; o.frequency.value=rand(1500,1900);
  decayTo(g.gain,t,v*.20,.028);
  o.connect(g).connect(p); o.start(t); o.stop(t+.06);
  disposeAt(o,t+.1); disposeAt(g,t+.1); disposeAt(p,t+.1);
}

// パーカッション。キットに応じて3通りに作り分ける (D-3 の「FM も有効」はここ)
function perc(t,v,pan,tone){
  const k=kit();
  if(k.perc==='fm'){
    const car=ctx.createOscillator(), mod=ctx.createOscillator(),
          md=ctx.createGain(), g=ctx.createGain(), p=drumOut(pan);
    car.type='sine'; mod.type='sine';
    const f=220*Math.pow(2,tone);
    car.frequency.value=f; mod.frequency.value=f*2.47;
    md.gain.value=f*3.2;
    mod.connect(md).connect(car.frequency);
    decayTo(g.gain,t,v*k.percGain*.5,.18);
    car.connect(g).connect(p);
    car.start(t); mod.start(t); car.stop(t+.3); mod.stop(t+.3);
    disposeAt(car,t+.35); disposeAt(mod,t+.35); disposeAt(md,t+.35);
    disposeAt(g,t+.35); disposeAt(p,t+.35);
    return;
  }
  const n=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(), p=drumOut(pan);
  n.buffer = k.perc==='metal' ? metalBuf : noiseBuf; n.loop=true;
  n.playbackRate.value=Math.pow(2,tone);
  f.type='bandpass'; f.frequency.value=800*Math.pow(2,tone+1); f.Q.value=k.perc==='metal'?2.2:1.0;
  const dec = k.perc==='metal' ? .12 : .09;
  decayTo(g.gain,t,v*k.percGain*.45,dec);
  n.connect(f).connect(g).connect(p);
  n.start(t); n.stop(t+dec+.05);
  disposeAt(n,t+dec+.1); disposeAt(f,t+dec+.1); disposeAt(g,t+dec+.1); disposeAt(p,t+dec+.15);
}

/* ---- 現在値をオーディオに反映 ---- */
function apply(){
  if(!ctx || !ready) return;
  const tm=ctx.currentTime, T=.25, c=current;
  master.gain.setTargetAtTime(running ? volume/100 : 0, tm, T);

  // 押し出し: 飽和段の入りを持ち上げ、そのぶんを後段で戻す
  const drive=.55+c.drive*1.5;
  drumBus.gain.setTargetAtTime(drive,tm,T);
  build.drumPost.gain.setTargetAtTime(1/(.7+c.drive*.9),tm,T);

  // 空間: リバーブとディレイの量。ディレイはテンポに同期させる
  revGain.gain.setTargetAtTime(.12+c.space*.55,tm,T);
  const sd=stepDur();
  delayNodes.tapL.d.delayTime.setTargetAtTime(sd*3,tm,1.2);    // 付点8分
  // 右は16分5つ。3と5はどちらも16分のグリッドに乗り、互いに素なので
  // 返しが拍とずれ続けて dub 的な絡みになる。グリッドから外すと打点が濁る
  delayNodes.tapR.d.delayTime.setTargetAtTime(sd*5,tm,1.2);
  const dubbing = phrase==='dubout';
  if(tm>evDelayUntil){
    delayNodes.tapL.fb.gain.setTargetAtTime(.28+c.space*.34+(dubbing?.22:0),tm,T);
    delayNodes.tapR.fb.gain.setTargetAtTime(.24+c.space*.32+(dubbing?.22:0),tm,T);
  }
  delayNodes.tapL.o.gain.setTargetAtTime(.18+c.space*.5,tm,T);
  delayNodes.tapR.o.gain.setTargetAtTime(.16+c.space*.45,tm,T);
  build.drumSends.dly.gain.setTargetAtTime(.12+c.space*.35+(dubbing?.35:0),tm,T);
  build.drumSends.rev.gain.setTargetAtTime(.15+c.space*.5,tm,T);

  // ドラムのフィルタはフレーズ型で開き具合が変わる。
  // sweep イベントが動かしている間は触らない (取り合いになるため)
  if(tm>evFilterUntil){
    drumFilter.frequency.setTargetAtTime(phraseCutoff(),tm,T*2);
    drumFilter.Q.setTargetAtTime(1.0,tm,T);
  }
  if(tm>evMasterUntil) mixFilter.frequency.setTargetAtTime(20000,tm,T);

  // ベース (D-10)。押し出しが飽和の入りとレゾナンスを、重さが量と音域を決める
  if(bassReady){
    bassPre.gain.setTargetAtTime(.6+c.drive*1.9,tm,T);
    bassBus.gain.setTargetAtTime((phrase==='break'?.15:1)*(.55+c.weight*.6),tm,T);
    const res=bassResParam();
    if(res) res.setTargetAtTime(1.1+c.drive*1.5,tm,T);
    // Ladder 自身の入力も持ち上げる。各段の tanh が効きはじめ、倍音が増える
    const drv=bassDrvParam();
    if(drv) drv.setTargetAtTime(.9+c.drive*3.2,tm,T);
    bassComp.threshold.setTargetAtTime(-18-c.drive*12,tm,T);
    // うねりの速さと深さ。密度が上がるほど速く、陽へ寄るほど深く振れる
    bassLfo.osc.frequency.setTargetAtTime(.035+c.density*.14,tm,T);
    bassLfo.gain.gain.setTargetAtTime(bassCutoffBase()*(.25+c.yy*.5),tm,T);
    build.bassSends.dly.gain.setTargetAtTime(.05+c.space*.22+(dubbing?.2:0),tm,T);
    build.bassSends.rev.gain.setTargetAtTime(.04+c.space*.14,tm,T);
  }
}

// フレーズ型ごとのドラムの開き具合。build は16小節かけて開いていく (D-9 のレイヤー累積に対応)
function phraseCutoff(){
  const u=clamp((barCount-phraseStartBar)/PHRASE_BARS);
  switch(phrase){
    case 'build':  return 900*Math.pow(20000/900,u);
    case 'break':  return 2600;
    case 'drop':   return 18000;
    case 'dubout': return 4200;
    default:       return 11000;
  }
}

/* ============================================================
   進行 — 第1層 シーン (D-4 / D-12 / D-13)
   ============================================================ */
let sceneIdx=0;          // いま鳴っているシーン
let sceneStartBar=0;     // そのシーンが始まった小節
let sceneBars=0;         // このシーンを何小節続けるか
let recent=[];           // 直近に出たシーン。同じものを続けて引かないため

// 陰陽の波。陰 → 陽 → 陰 を 20〜40 分かけて往復する (D-13)
let wavePos=0;           // 0〜1 の位相
let wavePeriod=1800;     // 秒。1周期。揺らぎを持たせて毎回同じ形にはしない
const waveYY = pos => .5 - .5*Math.cos(pos*Math.PI*2);

function newWavePeriod(){ wavePeriod=rand(1200,2400); }

// 波の位置から次のシーンを選ぶ。直近に出たものは避ける
function chooseScene(){
  const yy=waveYY(wavePos);
  const cand=SCENES.map((s,i)=>({i,d:Math.abs(s.yy-yy)}))
    .filter(c=>!recent.includes(c.i))
    .sort((a,b)=>a.d-b.d);
  const pool=cand.slice(0,3);   // 最も近い3つから引き、同じ道を辿らせない
  return pool.length ? pick(pool).i : Math.floor(Math.random()*SCENES.length);
}

// evolution が高いほどシーンは短い。2〜5分 (D-12) を小節数に直す
function sceneLengthBars(){
  const sec=lerp(300,120,current.evolution)*rand(.85,1.15);
  return Math.max(16, Math.round(sec/(60/bpmNow()*4)/16)*16);   // 16小節の倍数に丸める
}

function enterScene(idx,{manual=false}={}){
  sceneIdx=idx;
  moveKey();          // キーはシーンごとに五度圏で近い調へ移る (D-9)
  reseedPattern();    // 並びも引き直す。前のシーンの模様を持ち越さない
  sceneStartBar=barCount;
  sceneBars=sceneLengthBars();
  recent.push(idx); if(recent.length>3) recent.shift();
  // 手で選ばれた場合は、そのシーンの陰陽へ波の位置を移してから続きを進める (D-13)
  if(manual) wavePos=yyToWavePos(SCENES[idx].yy);
  target.yy=SCENES[idx].yy;
  sceneEdited=false;
  updateScene();
  highlightScene();
}

// 陰陽値から波の位相を逆に引く。いまが上り坂なら上り側、下り坂なら下り側を返す
function yyToWavePos(yy){
  const a=Math.acos(clamp(1-2*yy,-1,1))/(Math.PI*2);   // 0〜.5 (上り)
  const rising = (wavePos%1) < .5;
  return rising ? a : 1-a;
}

/* ---- 第2層 フレーズ (16小節) ---- */
const PHRASE_BARS=16;
let phrase='plateau', phraseStartBar=0;

function choosePhrase(){
  const w=SCENES[sceneIdx].w;
  let sum=0; for(const k of PHRASES) sum+=w[k]||0;
  if(sum<=0) return 'plateau';
  let r=Math.random()*sum;
  for(const k of PHRASES){ r-=(w[k]||0); if(r<=0) return k; }
  return 'plateau';
}

// build が続いたあとは drop で剥がす、といった並びの制約はここに置く (D-9)
function nextPhrase(){
  const prev=phrase;
  let p=choosePhrase();
  if(prev==='build' && p==='build' && Math.random()<.6) p='drop';
  if(prev==='break' && p==='break') p='drop';
  phrase=p; phraseStartBar=barCount;
  reseedPattern();
  showProgress();
}

/* ---- 第3層 イベント (4 / 8 小節の節目) ---- */
let lastEvent='—', lastEventBar=-99;

function maybeEvent(bar,time){
  const sc=SCENES[sceneIdx];
  // ブレイク中と定常では起きやすさが違う。build の途中は仕掛けを増やす
  const base = phrase==='build' ? .55 : phrase==='plateau' ? .30 : .40;
  if(Math.random()>base) return;
  const weights=EVENTS.map(e=>{
    if(!e.glitchy) return e.p;
    return e.p*(0.2+current.glitch*1.6)*(0.4+sc.glitch*1.2);   // グリッチ系だけ二重に重み付ける
  });
  let sum=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*sum;
  for(let i=0;i<EVENTS.length;i++){
    r-=weights[i];
    if(r<=0){ lastEvent=EVENTS[i].id; lastEventBar=bar; fireEvent(lastEvent,bar,time); break; }
  }
  showProgress();
}

/* ============================================================
   リズム生成 (D-7)
   ------------------------------------------------------------
   トラックごとに別の方式で作る。一律に確率を回すと、土台が崩れるか
   ハットがベタになるかのどちらかに落ちるため。
   各トラックは16個の強さ (0 なら鳴らさない) を持つ。
   ============================================================ */
const seq={kick:[],snare:[],clap:[],hat:[],ohat:[],perc1:[],perc2:[],rim:[],bass:[]};
let hatRot=0, percPer=[3,5], percOff=[0,0], kickVariant=null;

/* 並びは毎小節引き直すが、種が同じなら同じ並びが出る。
   種が変わるのはシーン・フレーズが切り替わったときと、変異が当たったときだけ。
   こうしないとミニマルに要る反復が出ず、小節ごとにばらばらの並びになってしまう */
let patSeed=1234;
function rng(seed){
  let a=seed>>>0;
  return ()=>{
    a+=0x6D2B79F5;
    let t=a;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function reseedPattern(){ patSeed=(Math.random()*1e9)|0; }

// ユークリッドリズム E(k,n)。k個を n個の枠へ均した位置に置く。
// Bjorklund の厳密な手続きではないが、等間隔に散る点は同じで、定型から外れた並びが得られる
function euclid(k,n){
  const out=new Array(n).fill(false);
  if(k<=0) return out;
  for(let i=0;i<k;i++) out[Math.floor(i*n/k)%n]=true;
  return out;
}

// electro funk 局面のキック。4つ打ちを離れてシンコペーションへ寄る (D-3 の B 要素)
const FUNK_KICK=[
  [0,3,6,10],
  [0,6,10,12],
  [0,4,7,10,14],
  [0,3,8,11],
];
// キックの変形演算子。節目でだけ呼ばれる (D-7)
const KICK_OPS=['skip','push','double','ghost'];

function applyKickOp(k,op){
  switch(op){
    case 'skip':   k[12]=0; break;                       // 4拍目を抜く
    case 'push':   k[12]=0; k[11]=1; break;              // 4拍目を食う
    case 'double': k[10]=Math.max(k[10],.85); break;     // 8分の裏を足す
    case 'ghost':  k[14]=Math.max(k[14],.45); break;     // 小さく差し込む
  }
}

/* ---- ベースの並び (D-7) ----
   音の並びより「フィルタがどう動くか」で性格が決まるトラックなので、
   位置と音価をシーンの陰陽から決め、度数は重み表から引く */
const BASS_GRIDS={
  slow:   [0,8],
  mid:    [0,6,8,14],
  eighth: [0,2,4,6,8,10,12,14],
  funk:   [0,3,6,8,11,14],
  busy:   [0,2,3,6,8,10,11,14],
};
// 音階の何番目を引くか。主音と5度を厚くする
const DEG_W=[5,1,1.6,1,3,1,1.2];

function bassBar(bar,R,kickPat){
  const sc=SCENES[sceneIdx], yy=current.yy, d=current.density;
  const sl=scale(), root=28+keyPc;
  const out=new Array(16).fill(null);
  if(phrase==='break') return out;   // ブレイクではベースも抜く

  const grid = sc.group==='funk' ? (R()<.5?BASS_GRIDS.funk:BASS_GRIDS.busy)
             : yy<.32 ? BASS_GRIDS.slow
             : yy<.55 ? BASS_GRIDS.mid
             : (R()<.5?BASS_GRIDS.eighth:BASS_GRIDS.mid);
  const busy=clamp(.35+yy*.45+d*.2);
  const legato = yy<.4 ? .95 : .6;   // 陰は音価が長く、陽は短く刻む

  const hits=[];
  for(const i of grid){ if(i===0 || R()<busy) hits.push(i); }
  if(!hits.length) hits.push(0);

  const sumW=DEG_W.reduce((a,b)=>a+b,0);
  for(let n=0;n<hits.length;n++){
    const i=hits[n];
    let deg=0;
    if(i!==0){
      let r=R()*sumW;
      for(let k=0;k<sl.length;k++){ r-=DEG_W[k%DEG_W.length]; if(r<=0){ deg=sl[k]; break; } }
    }
    const oct = (yy>.6 && R()<.22) ? 12 : 0;
    const next = n+1<hits.length ? hits[n+1] : 16;
    const steps=Math.max(1,(next-i)*legato);
    // キックと同じ位置はアクセント。フィルタの叩き方が変わる
    const acc = (kickPat[i]||0)>0 ? .85 : .3;
    out[i]={midi:root+deg+oct, steps, vel:.55+acc*.35, accent:acc};
  }
  return out;
}

// 小節ごとの並びを引き直す。onBar() の頭で呼ぶ
function regenerate(bar){
  const sc=SCENES[sceneIdx], d=current.density;
  const funk = sc.group==='funk';
  const quiet = phrase==='break', dub = phrase==='dubout';

  // --- 変異 (D-7)。当たったときだけ種を引き直し、それまでは同じ並びを繰り返す
  if(Math.random()<current.mutate*.5) reseedPattern();
  // 2小節でひと組。偶数小節と奇数小節で別の顔を持たせる
  const R=rng(patSeed+(bar%2)*7919);

  if(R()<.5) hatRot=Math.floor(R()*16);
  percPer=[[3,5,7][Math.floor(R()*3)],[5,7,11][Math.floor(R()*3)]];
  percOff=[Math.floor(R()*16),Math.floor(R()*16)];

  // --- キック: 4つ打ちを基本堅持。節目でだけ崩す
  const k=new Array(16).fill(0);
  if(funk && !quiet){
    for(const i of FUNK_KICK[Math.floor(R()*FUNK_KICK.length)]) k[i]=1;
  }else{
    for(const i of [0,4,8,12]) k[i]=1;
  }
  if(dub){ k[4]=0; k[12]=0; }               // dub 局面は2拍ぶんだけ残す
  // 8小節の終わりでのみ変形する。それ以外の小節は素のまま
  const edge = (bar%8===7);
  kickVariant = edge ? KICK_OPS[Math.floor(Math.random()*KICK_OPS.length)] : null;
  if(kickVariant) applyKickOp(k,kickVariant);
  if(quiet) k.fill(0);
  k[0]=quiet?0:Math.max(k[0],1);            // 小節頭は変異させない (ブレイク中を除く)
  seq.kick=k;

  // --- スネア / クラップ: 2・4拍が基本。funk ではゴーストを足す
  const sn=new Array(16).fill(0), cl=new Array(16).fill(0);
  if(!quiet && !dub){
    if(sc.kit==='electro' || funk){ cl[4]=1; cl[12]=1; }
    else { sn[4]=1; sn[12]=1; }
    if(funk){
      if(R()<.6) sn[7]=.35;
      if(R()<.4) sn[14]=.3;
    }
    if(edge && Math.random()<.5) sn[15]=.5;   // 小節をまたぐ手前の合図
  }
  seq.snare=sn; seq.clap=cl;

  // --- ハット: ユークリッドを主軸に、密度で間引き、拍で強弱を付ける
  const e=euclid(sc.hatK,16);
  const hat=new Array(16).fill(0), oh=new Array(16).fill(0);
  for(let i=0;i<16;i++){
    if(!e[(i+hatRot)%16]) continue;
    if(R()>0.45+d*.55) continue;               // 密度が低いと抜ける
    hat[i]=(i%4===0?.9:i%2===0?.7:.55)*(.85+R()*.27);
  }
  if(!quiet && R()<.55){
    // オープンハットは裏拍にひとつだけ。定型を避けるため位置は種ごとに引き直す
    const cand=[2,6,10,14].filter(i=>hat[i]>0 || R()<.4);
    if(cand.length){ const i=cand[Math.floor(R()*cand.length)]; oh[i]=.8; hat[i]=0; }
  }
  seq.hat=hat; seq.ohat=oh;

  // --- パーカッション: 互いに素な周期を回してポリリズムを作る (D-7)。
  // 小節をまたいで模様が変わっていくよう、位置は通し番号で決める
  const p1=new Array(16).fill(0), p2=new Array(16).fill(0);
  for(let i=0;i<16;i++){
    const g=bar*16+i;
    if(g%percPer[0]===percOff[0]%percPer[0] && R()<.35+d*.5) p1[i]=.5+R()*.4;
    if(g%percPer[1]===percOff[1]%percPer[1] && R()<.25+d*.45) p2[i]=.4+R()*.4;
  }
  seq.perc1=p1; seq.perc2=p2;

  // --- リム: 陰のキットだけ、まばらに
  const rm=new Array(16).fill(0);
  if(sc.kit==='deep' || dub){
    for(let i=0;i<16;i++) if(R()<.06+d*.10) rm[i]=.4+R()*.4;
  }
  seq.rim=rm;

  // --- ベース
  seq.bass=bassBar(bar,R,k);
}

/* ============================================================
   第3層イベントの実行
   maybeEvent() が選んだ仕掛けを、実際に音へ効かせる。
   小節をまたぐものは「いつまで効いているか」を音声時計で持つ。
   ============================================================ */
let evFilterUntil=0, evMasterUntil=0, evDelayUntil=0;
let muteHatUntilBar=-1, muteKickUntilBar=-1, glitchBar=-1;

function fireEvent(id,bar,time){
  const barSec=stepDur()*16;
  switch(id){
    case 'sweep':{
      // ドラムだけを閉じてから開き直す。2小節かけて戻る
      const f=drumFilter.frequency;
      f.cancelScheduledValues(time);
      f.setValueAtTime(Math.max(400,phraseCutoff()*.06),time);
      f.exponentialRampToValueAtTime(Math.max(800,phraseCutoff()),time+barSec*2);
      drumFilter.Q.setValueAtTime(3.5,time);
      drumFilter.Q.linearRampToValueAtTime(1.0,time+barSec*2);
      evFilterUntil=time+barSec*2;
      break;
    }
    case 'masterfilter':{
      const f=mixFilter.frequency;
      f.cancelScheduledValues(time);
      f.setValueAtTime(700,time);
      f.exponentialRampToValueAtTime(20000,time+barSec*2);
      evMasterUntil=time+barSec*2;
      break;
    }
    case 'hatdrop':  muteHatUntilBar=bar+1; break;
    case 'kickdrop': muteKickUntilBar=bar+1; break;
    case 'glitch':   glitchBar=bar; break;
    case 'feedback':{
      // ディレイのフィードバックを跳ね上げ、2小節かけて戻す
      for(const tap of [delayNodes.tapL,delayNodes.tapR]){
        tap.fb.gain.cancelScheduledValues(time);
        tap.fb.gain.setValueAtTime(.86,time);
        tap.fb.gain.linearRampToValueAtTime(.4,time+barSec*2);
      }
      evDelayUntil=time+barSec*2;
      break;
    }
    case 'reverse':{
      // 逆再生風の立ち上がり。次の小節の頭へ向けて膨らむ
      const n=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
      n.buffer=noiseBuf; n.loop=true;
      bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=.9;
      bp.frequency.linearRampToValueAtTime(5200,time+barSec);
      g.gain.setValueAtTime(.0001,time);
      g.gain.exponentialRampToValueAtTime(.22,time+barSec*.98);
      g.gain.exponentialRampToValueAtTime(.0001,time+barSec*1.02);
      n.connect(bp).connect(g).connect(drumBus);
      n.start(time); n.stop(time+barSec*1.1);
      disposeAt(n,time+barSec*1.2); disposeAt(bp,time+barSec*1.2); disposeAt(g,time+barSec*1.2);
      break;
    }
  }
}

/* ============================================================
   クロック
   小節と16分ステップを ctx.currentTime 基準で進める。
   setTimeout はバックグラウンドで絞られるが、音声時計は絞られない。
   ============================================================ */
let stepIdx=0, barCount=0, nextStepTime=0, uiStep=-1;
const uiSteps=[];   // 表示の予定。遅れて届いた分は最新だけ描く

function bpmNow(){
  // シーンの bpm を、BPM スライダーの中心値のぶんだけ平行移動する (D-11)
  return clamp(SCENES[sceneIdx].bpm + (bpmCenter-125), 100, 150);
}
function stepDur(){ return 60/bpmNow()/4; }   // 16分音符

// 1ステップぶんの予約。並びに従ってドラムを鳴らす
function playStep(i,time){
  showStepAt(i,time);
  if(!ready) return;
  const sw=stepDur(), k=kit();
  const hatOff  = barCount<=muteHatUntilBar;
  const kickOff = barCount<=muteKickUntilBar;

  if(seq.kick[i]  && !kickOff) bd(time,seq.kick[i]);
  if(seq.snare[i]) sd(time,seq.snare[i]);
  if(seq.clap[i])  cp(time,seq.clap[i]);
  if(!hatOff){
    // ハットだけは打点をわずかにずらす。機械的に揃いすぎるのを避ける (D-7)
    if(seq.hat[i])  hh(time+rand(-.002,.003),seq.hat[i],false);
    if(seq.ohat[i]) hh(time,seq.ohat[i],true);
  }
  const b=seq.bass[i];
  if(b) bassNote(time,b.midi,b.steps*sw,b.vel,b.accent);
  if(seq.perc1[i]) perc(time,seq.perc1[i],-.45,.2);
  if(seq.perc2[i]) perc(time,seq.perc2[i], .50,1.1);
  if(seq.rim[i])   rim(time,seq.rim[i],rand(-.6,.6));
  if(k.cowbell && i===6 && Math.random()<.22) cb(time,.7);
  if(i===0 && phrase==='drop') cy(time,.8);   // 戻しの頭にシンバル

  // グリッチ: その小節の終盤だけ32分で刻み直す (D-3 の C 要素)
  if(barCount===glitchBar && i>=12){
    perc(time+sw*.5,.55,rand(-.6,.6),rand(.5,1.6));
    if(i===15) hh(time+sw*.75,.5,false);
  }
}

function showStepAt(idx,at){ uiSteps.push({idx,at}); }
function flushSteps(){ uiSteps.length=0; }
function runStepUI(now){
  let bestAt=-1,bestIdx=-1;
  for(let i=uiSteps.length-1;i>=0;i--){
    if(uiSteps[i].at>now) continue;
    if(uiSteps[i].at>bestAt){ bestAt=uiSteps[i].at; bestIdx=uiSteps[i].idx; }
    uiSteps.splice(i,1);
  }
  if(bestIdx>=0 && bestIdx!==uiStep){ uiStep=bestIdx; renderSteps(); }
}

// 小節の頭で3階層を進める。ここが進行の中心。
// フレーズとシーンを先に決めてから並びを引き直す (両者が並びの前提になるため)
function onBar(bar,time){
  if(bar-phraseStartBar>=PHRASE_BARS) nextPhrase();
  // シーンの切り替えはフレーズの切れ目でのみ起きる。途中で切らない
  if(bar-sceneStartBar>=sceneBars && bar===phraseStartBar){
    newWavePeriod();
    enterScene(chooseScene());
  }
  regenerate(bar);
  if(bar>0 && bar%4===0) maybeEvent(bar,time);   // 開始直後の1小節目にいきなり仕掛けを出さない
  showProgress();
}

function seqTick(){
  const now=ctx.currentTime;
  const ahead=.12;   // 先読み。これより先の予約はしない
  while(nextStepTime < now+ahead){
    if(stepIdx===0) onBar(barCount,nextStepTime);
    playStep(stepIdx,nextStepTime);
    nextStepTime += stepDur();
    stepIdx++;
    if(stepIdx>=16){ stepIdx=0; barCount++; }
  }
}

/* ============================================================
   平滑化ループ
   ============================================================ */
let last=performance.now(), smoothAt=0;
function smooth(){
  const now=performance.now();
  const dt=Math.min(.5,(now-last)/1000); last=now;   // 復帰直後の巨大なdtで値が飛ばないように抑える
  smoothAt=now;
  const tau=Math.max(1,glide)/3;
  const k=1-Math.exp(-dt/tau);
  for(const key in P) current[key]+=(target[key]-current[key])*k;

  // 波を進め、手で触られていない限り陰陽の目標を波に従わせる (D-13)
  if(running && !dragging){
    wavePos=(wavePos+dt/wavePeriod)%1;
    if(!sceneEdited) target.yy=lerp(target.yy, waveYY(wavePos), Math.min(1,dt*.5));
  }
  apply();
  readout();
}
// 音声時計が止まっている間 (発音前、AudioContextの中断中) の受け皿
setInterval(()=>{ if(performance.now()-smoothAt>=250) smooth(); }, 100);

const paramsEl=document.getElementById('params');
const clockEl=document.getElementById('clockparams');
const inputs={};
function makeSlider(key,host){
  const wrap=document.createElement('div'); wrap.className='param';
  wrap.innerHTML=`<label for="s_${key}"><span data-i18n="param.${key}" data-i18n-tip="tip.${key}"></span><span class="val" id="v_${key}"></span></label>`;
  const r=document.createElement('input');
  r.type='range'; r.min=0; r.max=1; r.step=.005; r.value=target[key]; r.id='s_'+key;
  r.addEventListener('input',()=>{ target[key]=parseFloat(r.value); updateVal(key); markEdited(); });
  wrap.appendChild(r); host.appendChild(wrap);
  inputs[key]=r; updateVal(key);
}

{
  const wrap=document.createElement('div'); wrap.className='param';

    volume=parseInt(r.value,10);
    document.getElementById('v_volume').textContent=volume;
  });

}

{

function updateVal(key){
  const el=document.getElementById('v_'+key);
  if(el) el.textContent=target[key].toFixed(2);
}
function syncUI(){
  for(const key in inputs){ inputs[key].value=target[key]; updateVal(key); }
}
function markEdited(){
  sceneBtns.forEach(b=>b.setAttribute('aria-pressed','false'));
  if(!sceneEdited){ sceneEdited=true; updateScene(); }
}

/* ---- ステップ列 ---- */
const stepsEl=document.getElementById('steps');
for(let i=0;i<16;i++) stepsEl.appendChild(document.createElement('i'));
function renderSteps(){
  const cells=stepsEl.children;
  for(let i=0;i<16;i++){
    const on = (seq.kick[i]||0)>0 || (seq.snare[i]||0)>0 || (seq.clap[i]||0)>0;
    const hat = (seq.hat[i]||0)>0 || (seq.ohat[i]||0)>0;
    cells[i].className=(i%4===0?'beat ':'')+(on?'on ':hat?'hat ':'')+(i===uiStep?'now':'');
  }
}
renderSteps();

/* ---- XY パッド ---- */
const plane=document.getElementById('plane');
const cv=document.getElementById('cv'), g2=cv.getContext('2d');
function resize(){
  const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*d));
  cv.height=Math.max(1,Math.round(r.height*d));
  g2.setTransform(d,0,0,d,0,0);
}
new ResizeObserver(resize).observe(plane);
window.addEventListener('resize',resize);
resize();

let dragging=false;
function setFromPointer(e){
  const r=cv.getBoundingClientRect();
  target.yy      = clamp((e.clientX-r.left)/r.width);
  target.density = clamp((e.clientY-r.top)/r.height);
  // 手で陰陽を動かしたら、波の位置もそこへ移す。放したあとは続きから進む (D-13)
  wavePos=yyToWavePos(target.yy);
  markEdited();
}
plane.addEventListener('pointerdown',e=>{dragging=true;plane.setPointerCapture(e.pointerId);setFromPointer(e)});
plane.addEventListener('pointermove',e=>{if(dragging)setFromPointer(e)});
plane.addEventListener('pointerup',()=>dragging=false);
plane.addEventListener('pointercancel',()=>dragging=false);

// 陰は青緑、陽は琥珀。密度で粒の数が変わる
const flakes=[];
function draw(){
  requestAnimationFrame(draw);
  const w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return;
  const yy=current.yy, dn=current.density;

  // 陰 (青緑) から陽 (琥珀) へ。色相を下る経路は緑を通ってしまうので、
  // 青 → 紫 → 赤と上って一周させる
  const hue=(a,b)=>(lerp(a,b,yy))%360;
  const gd=g2.createLinearGradient(0,0,w,h);
  gd.addColorStop(0, `hsl(${hue(196,398)} ${lerp(34,52,yy)}% ${lerp(11,19,yy)}%)`);
  gd.addColorStop(1, `hsl(${hue(210,382)} ${lerp(40,44,yy)}% ${lerp(6,11,yy)}%)`);
  g2.fillStyle=gd; g2.fillRect(0,0,w,h);

  const want=Math.round(lerp(14,90,dn));
  while(flakes.length<want) flakes.push({x:Math.random()*w,y:Math.random()*h,v:rand(.1,.5),r:rand(.6,2.2)});
  while(flakes.length>want) flakes.pop();
  g2.fillStyle=`rgba(231,226,206,${lerp(.10,.26,yy)})`;
  for(const f of flakes){
    f.y-=f.v*(0.4+dn); if(f.y<0){ f.y=h; f.x=Math.random()*w; }
    g2.beginPath(); g2.arc(f.x,f.y,f.r*lerp(1.6,.7,dn),0,6.283); g2.fill();
  }

  // 拍の明滅。無音の段階でも拍が見えるようにしておく
  if(uiStep>=0 && uiStep%4===0){
    g2.fillStyle=`rgba(216,163,64,${.05+ (uiStep===0?.05:0)})`;
    g2.fillRect(0,0,w,h);
  }

  // 白い十字が目標、琥珀のランプが現在地
  const tx=target.yy*w, ty=target.density*h;
  g2.strokeStyle='rgba(255,255,255,.5)'; g2.lineWidth=1;
  g2.beginPath(); g2.moveTo(tx-7,ty); g2.lineTo(tx+7,ty); g2.moveTo(tx,ty-7); g2.lineTo(tx,ty+7); g2.stroke();
  const cx=current.yy*w, cy=current.density*h;
  g2.fillStyle='rgba(216,163,64,.9)';
  g2.beginPath(); g2.arc(cx,cy,3.4,0,6.283); g2.fill();
}
draw();

/* ---- 読み出し ---- */
const rYY=document.getElementById('ryy'), rD=document.getElementById('rd'),
      rBPM=document.getElementById('rbpm'), rBar=document.getElementById('rbar');
function readout(){
  rYY.textContent=current.yy.toFixed(2);
  rD.textContent=current.density.toFixed(2);
  rBPM.textContent=Math.round(bpmNow());
  rBar.textContent=running ? String(barCount-sceneStartBar+1) : '—';
  document.body.style.setProperty('--sea-split', (34+current.density*34).toFixed(1)+'%');
}

/* ============================================================
   バックグラウンド再生
   ------------------------------------------------------------
   iOS の Safari は画面ロックやバックグラウンド遷移で2つの止め方をしてくる。

   1. AudioContext 自体が中断される
      → 出力を MediaStreamDestination 経由で <audio> 要素に流し、
        ページを「メディア再生中」として扱わせる
   2. setInterval / setTimeout が絞られて止まる
      → 進行の時計を AudioWorklet に移す。音声スレッドで回るので絞られない

   どちらも対応していない環境では ctx.destination と setInterval に戻る。
   elevator-one で作った仕組みをそのまま引き継いでいる (D-2)。
   ============================================================ */
const CLOCK_SRC=`
class ClockProcessor extends AudioWorkletProcessor {
  constructor(){ super(); this.n=0; }
  process(){
    if(++this.n>=8){ this.n=0; this.port.postMessage(0); }   // 128フレーム × 8
    return true;
  }
}
registerProcessor('clock', ClockProcessor);
`;

let clockNode=null, sink=null, sinkActive=false, fallbackTimer=null;

function tick(){
  if(!ctx) return;
  if(performance.now()-smoothAt>=100) smooth();   // 平滑化とUI更新は100ms間隔で十分
  runStepUI(ctx.currentTime);
  runDisposals(ctx.currentTime);   // 止めたあとも鳴り終わりの片付けだけは続ける
  if(!running) return;
  seqTick();
}

async function startClock(){
  if(clockNode) return;
  if(ctx.audioWorklet){
    const url=URL.createObjectURL(new Blob([CLOCK_SRC],{type:'text/javascript'}));
    try{
      await ctx.audioWorklet.addModule(url);
      // Ladder も同じ入口で読む。こちらが失敗してもクロックは動かす
      try{
        const lurl=URL.createObjectURL(new Blob([LADDER_SRC],{type:'text/javascript'}));
        try{ await ctx.audioWorklet.addModule(lurl); ladderReady=true; }
        finally{ URL.revokeObjectURL(lurl); }
      }catch(e){ ladderReady=false; }
      clockNode=new AudioWorkletNode(ctx,'clock',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});
      clockNode.port.onmessage=tick;
      clockNode.connect(comp);   // 繋がないと process が呼ばれない。出力は無音なので混ざらない
      return;
    }catch(e){
      clockNode=null;
    }finally{
      URL.revokeObjectURL(url);
    }
  }
  clearInterval(fallbackTimer); fallbackTimer=setInterval(tick,25);
}

// 再生が実際に進み始めたかを最大1.5秒待って見る
async function sinkAdvances(){
  const t0=sink.currentTime;
  for(let i=0;i<15;i++){
    await new Promise(r=>setTimeout(r,100));
    if(sink.currentTime>t0) return true;
  }
  return false;
}

async function routeToSink(){
  if(sinkActive){
    if(sink.paused) try{ await sink.play(); }catch(e){}
    return true;
  }
  if(!sink){
    sink=document.createElement('audio');
    sink.setAttribute('playsinline','');
    sink.autoplay=true;
    sink.srcObject=streamDest.stream;
    sink.addEventListener('pause',()=>reviveAudio());
    sink.addEventListener('ended',()=>reviveAudio());
    document.body.appendChild(sink);
  }
  try{
    out.disconnect(ctx.destination);   // 二重に鳴らさないため先に切る
    await sink.play();
    if(await sinkAdvances()){
      sinkActive=true;
      if(!running) sink.pause();
      return true;
    }
  }catch(e){ /* 下のフォールバックへ */ }
  try{ sink.pause(); }catch(e){}
  out.connect(ctx.destination);
  return false;
}

// ロック画面 / コントロールセンター / CarPlay には現在のシーンを出す
function mediaMetadata(){
  return new MediaMetadata({title:sceneLabel(), artist:`Elevator Two ${VERSION}`});
}
function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata=mediaMetadata();
    navigator.mediaSession.setActionHandler('play', ()=>{ startAudio(); });
    navigator.mediaSession.setActionHandler('pause',stopAudio);
    // 「次へ」はロック画面からも押せるようにする
    navigator.mediaSession.setActionHandler('nexttrack',()=>{ newWavePeriod(); enterScene(chooseScene()); });
  }catch(e){}
}
function updateMediaMetadata(){
  if(!('mediaSession' in navigator) || !navigator.mediaSession.metadata) return;
  try{ navigator.mediaSession.metadata=mediaMetadata(); }catch(e){}
}

function reviveAudio(){
  if(!running || !ctx) return;
  if(ctx.state!=='running') ctx.resume().catch(()=>{});
  if(sinkActive && sink && sink.paused) sink.play().catch(()=>{});
}
document.addEventListener('visibilitychange',reviveAudio);
setInterval(reviveAudio,4000);

/* ---- 再生 / 一時停止 ---- */
const playBtn=document.getElementById('play');
const pauseBtn=document.getElementById('pause');

function setPowerUI(on){
  playBtn.dataset.on=on?'1':'0';
  pauseBtn.dataset.on=on?'0':'1';
  playBtn.setAttribute('aria-pressed',on?'true':'false');
  pauseBtn.setAttribute('aria-pressed',on?'false':'true');
}
setPowerUI(false);

async function startAudio(){
  if(running) return;
  if(navigator.audioSession) try{ navigator.audioSession.type='playback'; }catch(e){}
  if(!ctx) build();
  await ctx.resume();
  running=true;
  setPowerUI(true);
  stepIdx=0; barCount=0; nextStepTime=ctx.currentTime+.12;
  phraseStartBar=0; sceneStartBar=0;
  sceneBars=sceneLengthBars();
  muteHatUntilBar=-1; muteKickUntilBar=-1; glitchBar=-1;
  evFilterUntil=0; evMasterUntil=0; evDelayUntil=0;
  await startClock();
  ensureBass();   // Ladder の読み込み結果が要るので、時計のあとに組む
  routeToSink().catch(()=>{});   // 完了を待たない
  setupMediaSession();
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing';
}

function stopAudio(){
  if(!running) return;
  running=false;
  setPowerUI(false);
  muteHatUntilBar=-1; muteKickUntilBar=-1; glitchBar=-1;
  flushSteps();
  uiStep=-1; renderSteps();
  apply();
  if(sink) sink.pause();
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused';
}

playBtn.addEventListener('click',()=>{ startAudio(); });
pauseBtn.addEventListener('click',stopAudio);

/* ---- タブ切替 (狭幅時のみ表示) ---- */
const mainEl=document.getElementById('main');
const tabBtns=[...document.querySelectorAll('#tabs .tab')];
tabBtns.forEach(b=>b.addEventListener('click',()=>{
  mainEl.dataset.tab=b.dataset.tab;
  tabBtns.forEach(o=>o.setAttribute('aria-selected',String(o===b)));
  resize(); // display:none 明けの canvas を再計測
}));

/* ---- ツールチップ ---- */
const tipEl=document.getElementById('tip');
let tipHost=null;
const TIP_LIFE_MS=5000;
let tipTimer=0;
function showTip(el){
  const txt=el.dataset.tip;
  if(!txt) return;
  clearTimeout(tipTimer);
  tipEl.classList.remove('fade');
  tipHost=el; tipEl.textContent=txt; tipEl.classList.add('on');
  const r=el.getBoundingClientRect();
  const tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
  let x=r.left, y=r.bottom+8;
  if(y+th>innerHeight-8) y=Math.max(8, r.top-th-8);
  if(x+tw>innerWidth-10) x=innerWidth-tw-10;
  if(x<8) x=8;
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
  tipTimer=setTimeout(fadeTip, TIP_LIFE_MS);
}
function fadeTip(){ tipHost=null; tipEl.classList.add('fade'); tipEl.classList.remove('on'); }
function hideTip(){ clearTimeout(tipTimer); tipHost=null; tipEl.classList.remove('on','fade'); }
// 引数名は t() (翻訳) と紛れないように node
const nearest=node=>(node && node.closest) ? node.closest('[data-tip]') : null;
document.addEventListener('mouseover',e=>{ const el=nearest(e.target); if(el&&el!==tipHost) showTip(el); });
document.addEventListener('mouseout', e=>{ const el=nearest(e.target); if(el&&el===tipHost) hideTip(); });
document.addEventListener('focusin',  e=>{ const el=nearest(e.target); if(el) showTip(el); });
document.addEventListener('focusout', hideTip);
window.addEventListener('blur', hideTip);

/* ---- 表示言語の適用 ---- */
const langBtn=document.getElementById('lang');
function applyI18n(){
  document.documentElement.lang=lang;
  for(const el of document.querySelectorAll('[data-i18n]'))      el.textContent=t(el.dataset.i18n);
  for(const el of document.querySelectorAll('[data-i18n-tip]'))  el.dataset.tip=t(el.dataset.i18nTip);
  for(const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label',t(el.dataset.i18nAria));
  langBtn.textContent=lang.toUpperCase();
  updateScene();   // シーン名も訳し分ける。MediaMetadata もここで追随する
  showProgress();  // フレーズ名とイベント名も同じく
  hideTip();
}
langBtn.addEventListener('click',()=>{
  lang = lang==='ja' ? 'en' : 'ja';
  try{ localStorage.setItem(LANG_KEY,lang); }catch(_){ /* 保存できなくても切り替えはできる */ }
  applyI18n();
});

// 初期シーンは波の位置 (陰寄り) から引く
wavePos=yyToWavePos(P.yy.def);
newWavePeriod();
enterScene(chooseScene());
sceneBars=sceneLengthBars();
applyI18n();
showProgress();
readout();

window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); if(running) stopAudio(); else startAudio(); }
});

})();
</script>
